cards:
  - slug: card-la-dot-product
    unit: vectors
    front: "What does the *sign* of a dot product tell you?"
    back: |
      Positive: the vectors broadly agree in direction. Zero: orthogonal. Negative: they
      oppose. From $a \cdot b = \lVert a \rVert \lVert b \rVert \cos\theta$.

  - slug: card-la-cosine
    unit: vectors
    front: "What does cosine similarity 0.95 actually mean?"
    back: |
      Two vectors are close in *one model's* embedding space. Not the same meaning, not a
      95% confidence. Scale is model-specific and negations often land close together.

  - slug: card-la-matrix-columns
    unit: matrices
    front: "What are the columns of a matrix?"
    back: |
      The images of the input basis vectors. Read them and you know what the map does
      before computing anything.

  - slug: card-la-product-shape
    unit: matrices
    front: "Shape of $AB$ when $A$ is $m \\times n$ and $B$ is $n \\times p$?"
    back: |
      $m \times p$. Inner dimensions must match and then disappear. A mismatch there is the
      most common shape error in neural network code.

  - slug: card-la-commutativity
    unit: matrix-multiplication
    front: "Is $AB = BA$?"
    back: |
      Not in general — the product composes maps, and order of application matters. It does
      hold for special cases (identity, diagonals, inverses), which is why the misconception
      survives.

  - slug: card-la-matmul-derived
    unit: matrix-multiplication
    front: "Why row-times-column rather than entry-by-entry?"
    back: |
      Because it is the only rule under which the product represents the composition of the
      two maps. Entry-by-entry exists (Hadamard, `A * B`) and does not compose.
