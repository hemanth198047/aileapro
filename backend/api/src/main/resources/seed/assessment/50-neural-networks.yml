cards:
  - slug: card-nn-forward
    unit: how-a-neuron-learns
    front: "Write the forward pass of one neuron."
    back: |
      $z = w \cdot x + b$, then $a = \sigma(z)$ for some activation $\sigma$. A dot product,
      an addition, and a non-linearity.

  - slug: card-nn-update-rule
    unit: how-a-neuron-learns
    front: "The gradient descent update, with the sign."
    back: |
      $w \leftarrow w - \eta \, \partial L / \partial w$. Minus, because the gradient points
      uphill on the loss.

  - slug: card-nn-loss-vs-accuracy
    unit: how-a-neuron-learns
    front: "Loss falls, accuracy flat. What happened?"
    back: |
      Confidence improved on examples already correct, without moving any across the
      threshold. Loss measures how wrong the probabilities are; accuracy counts sides.

  - slug: card-nn-why-activation
    unit: how-a-neuron-learns
    front: "Why is an activation function needed between layers?"
    back: |
      Composing linear maps gives a linear map, so without one, any depth collapses to a
      single matrix. The non-linearity is what makes depth buy anything.
