cards:
  - slug: card-cv-detect
    unit: detection-vs-classification
    front: "Classification vs detection outputs?"
    back: |
      Classification: whole-image labels. Detection: boxes (locations) + classes per instance.

  - slug: card-asr-stages
    unit: asr-pipeline-intuition
    front: "ASR in one line?"
    back: |
      Capture → prep → features → sequence model → decode → post-process; domain shift still
      bites.
