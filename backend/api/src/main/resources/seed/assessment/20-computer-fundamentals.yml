cards:
  - slug: card-cf-state-definition
    unit: instructions-and-state
    front: "What is a program's *state*?"
    back: |
      The values currently held by everything the program can read or write. Instructions
      transform state; source code and printed output are not it.

  - slug: card-cf-assignment
    unit: instructions-and-state
    front: "How do you read `x = x + 1` without it sounding false?"
    back: |
      As an instruction, left to right in the wrong order: evaluate `x + 1` first, then
      store the result in `x`. `=` stores; it does not assert equality.

  - slug: card-cf-expression-statement
    unit: instructions-and-state
    front: "Expression or statement — which one changes state?"
    back: |
      A statement changes state; an expression produces a value and changes nothing. A line
      containing only an expression is legal and does nothing.

  - slug: card-cf-exec-pipeline
    unit: how-source-becomes-execution
    front: "The four stages from source text to execution."
    back: |
      Read the text → parse into a structure → translate to a lower-level form (machine
      code or bytecode) → execute.

  - slug: card-cf-interpreted
    unit: how-source-becomes-execution
    front: "Does \"interpreted\" mean no compilation happens?"
    back: |
      No. CPython compiles to bytecode (`__pycache__`) and the virtual machine runs that.
      "Compiled" and "interpreted" name stages of a toolchain, not two kinds of language.

  - slug: card-cf-runtime
    unit: how-source-becomes-execution
    front: "Name three things a runtime does that you never wrote."
    back: |
      Reclaims memory you stopped referencing, resolves which function a name means, and
      unwinds the stack when something raises.
