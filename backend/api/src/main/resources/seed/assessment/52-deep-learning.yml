cards:
  - slug: card-dl-linear-collapse
    unit: activations-and-nonlinearity
    front: "Why is an activation function mandatory between layers?"
    back: |
      Composing linear maps gives a linear map, so any depth collapses to one matrix. The
      nonlinearity is what makes depth buy anything.

  - slug: card-dl-residual
    unit: vanishing-gradients-intuition
    front: "In one line, why do residual connections work?"
    back: |
      $\partial(\mathbf{x} + F(\mathbf{x}))/\partial \mathbf{x} = I + \partial F/\partial \mathbf{x}$.
      The identity term gives the gradient an undiminished path back through every layer.
