cards:
  - slug: card-calc-update-sign
    unit: derivatives-as-rates
    front: "Which way does the gradient point, and what follows?"
    back: |
      Uphill — the direction of steepest increase. So the update subtracts it:
      $w \leftarrow w - \eta \, \partial L / \partial w$.

  - slug: card-calc-chain-rule
    unit: chain-rule-for-gradients
    front: "State the chain rule as a sentence about rates."
    back: |
      $dy/dx = (dy/du)(du/dx)$. The rate of $y$ per unit of $x$ is the product of the rates along
      the chain — which is why depth multiplies gradients rather than adding them.
