cards:
  - slug: card-ft-vs-prompt
    unit: fine-tuning-vs-prompting
    front: "Prompting vs fine-tuning in one line?"
    back: |
      Prompting steers a frozen model via context; fine-tuning changes weights so behaviour
      persists with shorter prompts — and can regress unrelated skills.

  - slug: card-lora-update
    unit: peft-lora-intuition
    front: "What does LoRA train?"
    back: |
      Low-rank factors $A$ and $B$ so $\Delta W \approx BA$, while pretrained $W$ stays frozen.
