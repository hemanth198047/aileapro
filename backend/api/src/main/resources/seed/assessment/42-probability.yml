cards:
  - slug: card-prob-base-rate
    unit: conditioning-and-bayes
    front: "A 99%-accurate test for a rare condition fires. Now what?"
    back: |
      Build the count table. Most positives will be false, because the negative class is so much
      larger that even a small error rate outnumbers the true positives.

  - slug: card-prob-precision-vs-recall-prior
    unit: conditioning-and-bayes
    front: "Which of precision and recall survives a change in base rate?"
    back: |
      Recall — it is conditioned on the true class. Precision is conditioned on the prediction, so
      it moves with the prior and does not transfer from a rebalanced test set.
