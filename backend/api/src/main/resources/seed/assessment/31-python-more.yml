cards:
  - slug: card-py-cf-continue
    unit: python-control-flow
    front: "continue vs break in a filtering loop?"
    back: |
      continue skips this item and keeps going. break leaves the loop entirely — later items
      never run.

  - slug: card-py-cf-guards
    unit: python-control-flow
    front: "Why early-return guards?"
    back: |
      Each rejection exits immediately; the success path stays flat and readable.

  - slug: card-np-broadcast
    unit: python-numpy-essentials
    front: "Broadcasting rule in one line?"
    back: |
      Compare axes right-to-left: equal sizes or one side is 1. Element count matching is not
      enough.

  - slug: card-np-star
    unit: python-numpy-essentials
    front: "* vs @ in NumPy?"
    back: |
      * is elementwise. @ (or np.matmul) is matrix multiplication.
