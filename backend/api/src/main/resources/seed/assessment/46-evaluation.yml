cards:
  - slug: card-eval-precision-recall
    unit: precision-recall-and-f1
    front: "Precision and recall, in one sentence each."
    back: |
      Precision: of what I flagged, how much was real. Recall: of what was real, how much did I
      flag. Lowering the threshold raises recall and usually lowers precision.

  - slug: card-eval-fold-spread
    unit: holdout-vs-cross-validation
    front: "Two models share a cross-validated mean. What else do you look at?"
    back: |
      The standard deviation across folds. A large spread means the model depends heavily on which
      rows it trained on — and the worst fold is usually worth investigating.
