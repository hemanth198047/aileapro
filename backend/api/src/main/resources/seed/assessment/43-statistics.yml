cards:
  - slug: card-stats-split
    unit: sampling-bias-and-selection
    front: "Does a random split fix sampling bias?"
    back: |
      No. It randomises within the sample you already have. Both halves can still miss the
      population.

  - slug: card-stats-survivorship
    unit: sampling-bias-and-selection
    front: "Survivorship bias in one line?"
    back: |
      You only observe units that made it into the log or label store — dropouts never train you.

  - slug: card-stats-ci
    unit: confidence-intervals-intuition
    front: "What does 95% refer to in a CI?"
    back: |
      Long-run coverage of the procedure across repeated samples — not P(true value in this
      interval) after seeing the data.

  - slug: card-stats-width
    unit: confidence-intervals-intuition
    front: "How does CI width scale with n (roughly)?"
    back: |
      Like 1/√n for many mean estimators — 16× more data ≈ 4× narrower intervals.
