      - agent-loop-cause
      - agent-vs-workflow

  - slug: agent-failure-modes-quiz
    title: "Quiz: how agents fail"
    kind: quiz
    unit: agent-failure-modes
    passMark: 0.7
    timeLimitSeconds: 900
    items:
      - agent-compounding
      - agent-injection-defence
      - agent-loop-cause
      - agent-vs-workflow

cards:
  - slug: card-agent-boundary
    unit: tool-calling-loop
    front: "Where is the trust boundary in an agent loop?"
    back: |
      Between the model's proposed call and your handler. The model only ever emits a request; your
      code validates, authorises, and executes — which is why controls belong there and not in the
      prompt.

  - slug: card-agent-compounding
    unit: agent-failure-modes
    front: "95% per-step reliability over 20 steps gives what?"
    back: |
      About 36%. Steps multiply, so the fixes are fewer steps and verification with retry — not a
      longer chain.
