cards:
  - slug: card-llm-objective
    unit: next-token-prediction
    front: "State the LLM training objective, and one thing it does not contain."
    back: |
      Minimise cross-entropy against the actual next token, given everything before it. It contains
      no notion of truth, which is why fluent fabrication is expected rather than anomalous.

  - slug: card-llm-context-memory
    unit: context-window-limits
    front: "Does the model remember the conversation?"
    back: |
      No. Each call is stateless and the client re-sends the whole history, which is why cost grows
      with conversation length and why anything that must persist is your job to store.

  - slug: card-llm-prompt-spec
    unit: prompting-as-specification
    front: "The five parts of a specified prompt."
    back: |
      Role or context, task, constraints, output format, examples. Plus the artefact that makes it
      engineering: an evaluation set of 20-50 real inputs.
