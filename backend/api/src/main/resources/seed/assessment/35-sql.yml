cards:
  - slug: card-sql-fanout
    unit: sql-select-join-aggregate
    front: "What is join fan-out?"
    back: |
      Multiple matches on a key multiply rows — duplicating entities unless that grain is
      intentional.

  - slug: card-sql-left
    unit: sql-select-join-aggregate
    front: "INNER vs LEFT for optional labels?"
    back: |
      INNER drops unmatched left rows. LEFT keeps them with NULLs — often needed to avoid
      selection bias.
