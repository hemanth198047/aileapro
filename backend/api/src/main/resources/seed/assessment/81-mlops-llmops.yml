cards:
  - slug: card-mlops-skew
    unit: training-serving-skew
    front: "Same model file, different predictions online — first suspect?"
    back: |
      Training–serving skew: transforms, defaults, joins, or encodings diverged. Shared feature code
      + replay tests beat hoping weights imply identical systems.

  - slug: card-llmops-axes
    unit: cost-latency-quality-tradeoffs
    front: "Name the three LLMOps trade-off axes."
    back: |
      Cost (tokens × price), latency (esp. p95), and multi-dimensional quality — with cascades,
      caching, and retrieval as levers.

  - slug: card-llmops-fluent-failure
    unit: observability-for-llm-apps
    front: "Why can HTTP 200 hide an LLM outage?"
    back: |
      Fluent wrong answers still succeed at the transport layer. Sample quality, score suites, and
      versioned traces — do not trust uptime alone.
