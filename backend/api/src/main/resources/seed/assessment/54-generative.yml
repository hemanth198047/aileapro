cards:
  - slug: card-gan-players
    unit: gan-game-intuition
    front: "GAN in one sentence."
    back: |
      Generator maps noise to fakes; discriminator learns real vs fake; they train as a game.
      Watch for mode collapse even when losses look calm.

  - slug: card-diffusion-story
    unit: diffusion-denoising-intuition
    front: "Diffusion in one sentence."
    back: |
      Destroy data with a fixed noise schedule, learn to denoise, sample by iterative cleanup from
      pure noise (DDPM-style).
