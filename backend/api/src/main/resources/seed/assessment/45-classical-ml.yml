cards:
  - slug: card-sl-leakage-test
    unit: supervised-learning-framing
    front: "The one-line test for whether a feature leaks."
    back: |
      At what timestamp is this value written? If it is at or after the label, it leaks — however
      predictive it looks.

  - slug: card-lr-coefficient
    unit: linear-regression-intuition
    front: "State what a regression coefficient means."
    back: |
      The predicted change in $y$ per one-unit increase in that feature, **holding the model's
      other features fixed**. Conditional on the feature set, and not a causal effect.

  - slug: card-tvt-validation-decay
    unit: train-validation-test
    front: "Why does a validation score stop being honest?"
    back: |
      Because selecting among options fits that set's noise. After enough comparisons the winner's
      score is optimistic, which is what the untouched test set is for.
