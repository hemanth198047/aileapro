cards:
  - slug: card-bigo-growth
    unit: big-o-for-ml-engineers
    front: "What is Big-O for, in one line?"
    back: |
      Leading cost growth as n gets large — not a millisecond forecast for today's run.

  - slug: card-hash-vs-ann
    unit: hashing-and-lookup
    front: "Hash map vs nearest-neighbour search?"
    back: |
      Dicts: exact key equality, average O(1). Embeddings need similarity indexes, not get(key).
