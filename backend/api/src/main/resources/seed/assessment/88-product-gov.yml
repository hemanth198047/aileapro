cards:
  - slug: card-prod-layers
    unit: ai-product-metrics
    front: "Three metric layers for AI products?"
    back: |
      Product/outcome, model/quality, operational — plus docs and eval gates.

  - slug: card-gov-kit
    unit: accountability-and-oversight
    front: "Minimum accountability kit?"
    back: |
      Owner, inventory, risk map, measures, manage/mitigate, periodic review.

  - slug: card-noai
    unit: when-not-to-use-ai
    front: "When not to use AI?"
    back: |
      Stable rules, high harm without oversight, unmeasurable success, or a simpler tool fits.
