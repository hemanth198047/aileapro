cards:
  - slug: card-py-mutable-types
    unit: python-values-and-types
    front: "Which core Python types are mutable?"
    back: "`list`, `dict`, `set`. Not `tuple`, not `str`, not the numbers."

  - slug: card-py-assignment
    unit: python-values-and-types
    front: "`b = a` on a list — copy or alias?"
    back: |
      Alias. Both names label the same object, so `b.append(x)` is visible through `a`.
      `a is b` is `True`. For a copy: `a.copy()` or `list(a)`.

  - slug: card-py-mutate-vs-rebind
    unit: python-values-and-types
    front: "`b.append(3)` versus `b = b + [3]` — which one does `a` see?"
    back: |
      `append` mutates the shared object, so `a` sees it. `b + [3]` builds a new list and
      rebinds `b`, so `a` does not.

  - slug: card-py-mutable-default
    unit: python-functions
    front: "Why does `def add(x, bag=[])` accumulate across calls?"
    back: |
      Defaults are evaluated once, when `def` runs, and stored on the function object. Every
      call omitting `bag` shares that one list. Default to `None` and build inside.

  - slug: card-py-implicit-none
    unit: python-functions
    front: "What does a function with no `return` return?"
    back: "`None`. Printing inside a function is not returning a value."

  - slug: card-py-membership-cost
    unit: python-collections
    front: "Cost of `x in c` for a list versus a set?"
    back: |
      List O(n) — it compares element by element. Set O(1) average — it hashes and looks in
      one place. Inside a loop this is the difference between quadratic and linear.

  - slug: card-py-dict-vs-set
    unit: python-collections
    front: "What does a `dict` add over a `set`?"
    back: |
      A value per key. Both give O(1) membership, unique keys, and insertion order, so the
      choice is about intent rather than speed.
