cards:
  - slug: card-infra-batch-cap
    unit: batching-and-gpu-utilization
    front: "What caps batch size?"
    back: |
      Memory, latency SLOs, and sometimes optimisation quality — not "utilization % looked high."

  - slug: card-infra-kv
    unit: kv-cache-and-inference-cost
    front: "Is chat after prefill free?"
    back: |
      No. KV memory and growing history/tool traces keep costing; compact and retrieve on purpose.
