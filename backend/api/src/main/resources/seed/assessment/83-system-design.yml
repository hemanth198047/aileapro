      - arch-instruct-grounding

  - slug: llm-app-architecture-patterns-quiz
    title: "Quiz: LLM app architecture patterns"
    kind: quiz
    unit: llm-app-architecture-patterns
    passMark: 0.7
    timeLimitSeconds: 900
    items:
      - arch-rag-default
      - arch-workflow-vs-agent
      - arch-agents-subsume
      - arch-instruct-grounding
      - arch-fine-tune-facts
      - arch-fallbacks
      - arch-decision-tree

cards:
  - slug: card-arch-tree
    unit: llm-app-architecture-patterns
    front: "RAG vs fine-tune vs agents — first questions?"
    back: |
      Side effects? Known step order? Changing corpus / citations? Stable format with labels? Then
      budgets, evals, fallbacks — agents are not the default container.

  - slug: card-arch-workflow
    unit: llm-app-architecture-patterns
    front: "Known step order — agent or workflow?"
    back: |
      Fixed workflow with typed tools at known steps. Open loops multiply cost and failure for no
      control-flow gain.
