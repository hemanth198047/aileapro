cards:
  - slug: card-tf-block-parts
    unit: transformer-block-overview
    front: "Name the four parts of a transformer block and what each does."
    back: |
      Self-attention (mixes across positions), a position-wise MLP (per-position processing, and
      about two-thirds of the parameters), residual connections (the gradient path), and layer
      normalisation (keeps activations in range).

  - slug: card-tf-position
    unit: positional-encoding-intuition
    front: "Why must position be added to the embeddings?"
    back: |
      Attention is a weighted sum over a set and is permutation-equivariant, so order carries no
      information unless it is injected before the first block.
