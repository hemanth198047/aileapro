cards:
  - slug: card-ann-tradeoff
    unit: approximate-nearest-neighbors
    front: "ANN's core trade-off?"
    back: |
      Lower latency by not scanning everything — at the risk of missing true neighbours unless
      you buy recall back with parameters and measurement.

  - slug: card-chunk-precision
    unit: chunking-and-retrieval-quality
    front: "Why not maximise chunk size?"
    back: |
      Multi-topic chunks embed to blurred averages. Prefer focused, structure-aware chunks;
      expand to parent context after retrieval if the reader needs more.
