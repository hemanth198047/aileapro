cards:
  - slug: card-eval-harness
    unit: llm-eval-harness-basics
    front: "Four parts of an LLM eval harness?"
    back: |
      Cases, production-faithful runner, scorers, versioned report — gated in CI, not a playground
      anecdote.

  - slug: card-injection-primary
    unit: prompt-injection-and-trust
    front: "Primary defence against prompt injection?"
    back: |
      Capability control in code (least privilege, allow-lists, confirms). Prompt hardening is
      secondary — not a boundary.

  - slug: card-exfil-handler
    unit: data-exfiltration-via-tools
    front: "Where must exfiltration be stopped?"
    back: |
      In the tool handler: destination allow-lists, scoped credentials, DLP, confirms. Model refusal
      is not authorisation.
