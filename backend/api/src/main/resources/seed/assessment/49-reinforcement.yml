cards:
  - slug: card-rl-return
    unit: rl-loop-state-action-reward
    front: "Immediate reward vs return?"
    back: |
      Return G_t is the discounted sum of future rewards. RL typically maximises expected return,
      not only R_{t+1}.

  - slug: card-rl-policy-value
    unit: policy-vs-value-intuition
    front: "Policy vs value — one line each."
    back: |
      Policy: what to do in a state. Value: how good a state (or state–action) is under a policy.
      Not synonyms.
