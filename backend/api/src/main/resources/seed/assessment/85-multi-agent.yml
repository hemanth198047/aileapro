cards:
  - slug: card-multiagent-role
    unit: multi-agent-roles-and-handoffs
    front: "Role vs persona — what's the difference?"
    back: |
      A role is a contract (inputs, output schema, tools, stops). A persona is a label. Contracts
      can be validated; labels cannot.

  - slug: card-multiagent-ping-pong
    unit: multi-agent-failure-modes
    front: "What stops agent ping-pong?"
    back: |
      Per-pair turn budgets, progress checks, and rejecting non-actionable handoffs — then escalate.
