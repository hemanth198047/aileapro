cards:
  - slug: card-emb-failure-list
    unit: what-embeddings-capture
    front: "Five things embeddings capture unreliably."
    back: |
      Negation, sentiment or stance, specific identifiers, numeric and temporal relations, and the
      direction of a relationship. Each is a real retrieval bug, and each is predictable from the
      training objective.

  - slug: card-emb-similarity-relevance
    unit: what-embeddings-capture
    front: "Similarity and relevance: what is the difference?"
    back: |
      Similarity is proximity in a space trained on topical relatedness. Relevance is a property of
      the question. A chunk can be very similar and useless, or relevant and distant — which is why
      hybrid search and rerankers exist.
