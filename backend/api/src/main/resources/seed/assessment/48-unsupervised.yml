cards:
  - slug: card-km-objective
    unit: kmeans-and-clustering
    front: "What does k-means minimise?"
    back: |
      Within-cluster sum of squared distances to centroids (WCSS / inertia). Cluster IDs are
      invented names for that partition — not supervised classes.

  - slug: card-pca-vs-cluster
    unit: pca-for-intuition
    front: "Does PCA find clusters?"
    back: |
      No. PCA finds high-variance orthogonal directions. Blobs in a 2D plot are a visualisation
      accident when groups already separate along those directions — not PCA's objective.
