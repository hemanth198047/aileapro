cards:
  - slug: card-logreg-model
    unit: logistic-regression-intuition
    front: "Logistic regression in one formula?"
    back: "p = σ(wᵀx + b); threshold separately for hard decisions."

  - slug: card-tree-scale
    unit: decision-trees-and-ensembles
    front: "Do random forests need StandardScaler?"
    back: "No — splits care about orderings within a feature, not shared units across features."

  - slug: card-leak-timestamp
    unit: feature-leakage-and-scaling
    front: "Timestamp test for a feature?"
    back: "At prediction time, is this value already written? If not, it leaks."
