cards:
  - slug: card-cnn-sharing
    unit: convolution-intuition
    front: "Convolution vs dense — two constraints?"
    back: "Local receptive fields and weight sharing across spatial positions."

  - slug: card-rf
    unit: pooling-and-receptive-fields
    front: "What is a receptive field?"
    back: "The region of the input that influences a given activation."

  - slug: card-rnn-share
    unit: rnn-sequence-modeling
    front: "What does an RNN share across time?"
    back: "The same cell parameters at every timestep; state h_t carries the memory."

  - slug: card-lstm-forget
    unit: lstm-gates-intuition
    front: "Forget gate does what?"
    back: "Scales how much of c_{t-1} is kept in the additive cell update."
