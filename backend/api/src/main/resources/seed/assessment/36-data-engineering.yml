cards:
  - slug: card-data-pipeline-vs-store
    unit: feature-store-vs-pipeline
    front: "Pipeline vs feature store — one line?"
    back: |
      Pipelines move data. Feature contracts define PIT semantics and train/serve parity. Kafka ≠
      feature store.

  - slug: card-data-snapshot
    unit: reproducible-training-data
    front: "Why snapshot training data?"
    back: |
      Metrics need recoverable inputs. Mutable warehouse "today" is not last month's experiment.
