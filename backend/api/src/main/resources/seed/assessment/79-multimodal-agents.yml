cards:
  - slug: card-clip-space
    unit: clip-joint-embeddings
    front: "What does CLIP learn?"
    back: |
      A joint embedding space where matched images and captions sit closer than mismatched
      pairs — enabling retrieval and zero-shot text-prompt classification.

  - slug: card-agent-memory-split
    unit: agent-memory-patterns
    front: "Short-term vs long-term agent memory?"
    back: |
      Short-term lives in the context window for this loop. Long-term lives in durable stores
      (structured state, vector notes, logs) you read back on purpose.
