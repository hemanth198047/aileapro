cards:
  - slug: card-rag-stages
    unit: rag-pipeline-basics
    front: "The query-time stages of a RAG pipeline."
    back: |
      Embed the query → search the index → select and rank passages → build the prompt →
      generate with citations. Retrieval first, because the retrieved text is the input.

  - slug: card-rag-hallucination
    unit: rag-pipeline-basics
    front: "Does RAG eliminate unsupported claims?"
    back: |
      No. Retrieval constrains what is *available*, not what is generated. Models still
      blend retrieved text with parametric knowledge and fill gaps. Reduced, not removed.

  - slug: card-rag-vs-fine-tuning
    unit: rag-pipeline-basics
    front: "RAG or fine-tuning?"
    back: |
      RAG for what the model *knows* — facts, freshness, citations. Fine-tuning for how it
      *behaves* — format, style, task shape.

  - slug: card-rag-citation
    unit: rag-pipeline-basics
    front: "What makes a citation checkable?"
    back: |
      A specific span paired with the specific claim it supports. "This document was
      retrieved" is not a citation.

  - slug: card-rag-debug
    unit: rag-pipeline-basics
    front: "Answers are bad. Retrieval or generation?"
    back: |
      Measure retrieval recall first on questions with known supporting passages. If the
      right passage never arrives, prompt work cannot help.
