cards:
  - slug: card-attn-formula
    unit: scaled-dot-product-attention
    front: "Write scaled dot-product attention in one line."
    back: "softmax(QKᵀ / √d_k) V — score, scale, mix values."

  - slug: card-attn-variance
    unit: scaled-dot-product-attention
    front: "Why √d_k?"
    back: |
      If q,k components are independent unit-variance, Var(q·k)=d_k; dividing by √d_k restores
      variance ≈ 1 so softmax stays well-behaved as width grows.
