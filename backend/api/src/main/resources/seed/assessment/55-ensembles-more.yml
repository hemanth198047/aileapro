cards:
  - slug: card-bag-vs-boost
    unit: bagging-vs-boosting
    front: "Bagging vs boosting in one contrast."
    back: |
      Bagging: parallel bootstrap (and feature randomness) → cut variance.
      Boosting: sequential residual fitting → cut bias. Not the same algorithm in two fonts.
