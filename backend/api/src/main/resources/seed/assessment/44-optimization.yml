cards:
  - slug: card-opt-update
    unit: gradient-descent-basics
    front: "Gradient descent update in one line?"
    back: |
      w ← w − η ∇L(w). Minus because the gradient points uphill.

  - slug: card-opt-autograd
    unit: gradient-descent-basics
    front: "Does backward() update weights?"
    back: |
      No. Autograd computes grads; optimizer.step (or manual update) moves parameters.

  - slug: card-opt-eta
    unit: learning-rates-and-local-minima
    front: "Too-large vs too-small η symptoms?"
    back: |
      Too large: oscillate / diverge / NaN. Too small: crawl forever with tiny nonzero steps.

  - slug: card-opt-global
    unit: learning-rates-and-local-minima
    front: "Must GD find the global minimum?"
    back: |
      No. Deep losses are non-convex; practice targets useful low-loss regions and generalisation.
