cards:
  - slug: card-rai-proxy
    unit: training-data-and-harm
    front: "Does removing a protected attribute remove its influence?"
    back: |
      No. Proxies carry it — postcode, school, purchase history, phrasing. Worse, dropping the
      attribute removes your ability to measure the disparity you caused.

  - slug: card-rai-disaggregate
    unit: training-data-and-harm
    front: "The highest-value responsible-AI practice, in one line."
    back: |
      Disaggregated evaluation: compute every metric separately per affected group and report the
      breakdown rather than the average.
