  - slug: multi-agent-failure-modes
    title: Multi-Agent Failure Modes
    kind: knowledge_unit
    parent: multi-agent-systems-core
    status: published
    version: 1.0.0
    difficulty: 4
    estimateMinutes: 36
    volatility: HIGH
    knowledgeClass: EMERGING
    lastReviewedAt: 2026-09-20
    lastVerifiedAt: 2026-09-20
    tags: [agents, multi-agent, reliability, failure-modes]
    objectives:
      - Name failure modes that appear only when multiple agents coordinate.
      - Explain ping-pong loops, contradictory state, and supervisor collapse.
      - Design observability for cross-agent traces, not only final answers.
      - Decide when to collapse roles back into a workflow.
    description: >-
      What goes wrong when several agents share a task: loops between roles, divergent "facts,"
      cost blowouts, and supervisors that become single points of failure.
    blocks:
      - type: why
        markdown: |
          Single-agent failures (loops, injection, compounding error) still apply. Multi-agent
          systems add *coordination* failures: agents argue, overwrite each other, or wait forever
          for a handoff that never validates.

          These are design bugs. They show up after the happy-path demo, when two roles disagree
          about the world.

      - type: eli5
        markdown: |
          Two people editing the same homework in different documents, each sure theirs is latest.
          They message "your turn" back and forth without a shared checklist. Eventually someone
          submits a mash-up that cites both versions of the answer.

          Multi-agent failures are that mess: no shared truth, endless "your turn," and a confident
          final merge of contradictions.

      - type: beginner
        markdown: |
          Failure modes that show up specifically with multiple agents:

          1. **Ping-pong.** A ↔ B keep handing work back ("please revise" / "please clarify") with
             no progress metric or turn limit.
          2. **Divergent state.** Two roles hold incompatible facts; the merger smooths them into
             fluent nonsense.
          3. **Duplicate side effects.** Two agents call the same write tool because ownership was
             never exclusive.
          4. **Supervisor collapse.** The "orchestrator" does all the work and specialists are
             unused — or the orchestrator is a single point of wrong plans.
          5. **Cost fan-out.** Parallel agents each grow their own contexts; spend multiplies with
             little shared memory discipline.

          Mitigations that actually help:

          - Turn budgets and "no progress" detectors *per role pair*.
          - A single **source of truth** object (ticket state, scratchpad schema) updated
            transactionally in code.
          - Exclusive tool ownership per role.
          - Merge rules written as code (`prefer extractor.facts`; never "average" claims).

      - type: intermediate
        markdown: |
          **Handoffs are free in demos and expensive in compounding.** Each rejection that sends
          work backwards multiplies another reliability factor. Cap retries; after N rejects,
          escalate to a human or a deterministic fallback.

          **Logging must be cross-agent.** A final answer log cannot show that agent B overwrote
          agent A's `incident_id`. Record: role id, handoff payload hash, validation outcome,
          tool calls, and the shared state version after each step.

          **Evaluation is harder.** Task success alone hides whether specialists were used well.
          Track: handoff accept rate, ping-pong length, duplicate tool calls, and disagreement rate
          between roles on factual fields.

          **Collapse when evidence says so.** If two roles always run in fixed order with the same
          tools, they are a workflow wearing a costume. Prefer an explicit pipeline — fewer
          decisions, clearer tests.

          Agent surveys note that evaluation and reliability remain open problems even for single
          agents; multi-agent setups inherit that and add coordination metrics. Do not treat a
          multi-agent benchmark win as proof your production handoffs are safe.

      - type: example
        markdown: |
          **Ping-pong.** Critic always returns `{blocking: true, issues: ["be clearer"]}`. Drafter
          rewrites tone but never changes facts. After 15 turns the budget dies.

          Fix in code:

          ```
          if handoff_count(pair="drafter-critic") > 3:
              escalate("human_edit")
          if critic.issues unchanged from previous:
              reject("non_actionable_critique")
          ```

          **Divergent state.** Researcher says revenue is $12M; analyst's scratchpad still has $1.2M
          from an earlier tool misread. Synthesizer outputs a paragraph using both.

          Fix: one `facts` map keyed by claim id; writes go through

          ```python
          def upsert_fact(store, claim_id, value, source, role):
              prev = store.get(claim_id)
              if prev and prev.value != value:
                  raise Conflict(claim_id, prev, value, role)
              store[claim_id] = Fact(value, source, role)
          ```

          Conflicts escalate; they are not averaged in prose.

      - type: misconception
        payload:
          code: multiagent.handoff_is_free
          claim: "Handing work between agents is basically free — just send the message."
          markdown: |
            **The claim:** a handoff is only another chat message, so adding hops is cheap.

            **Why it feels right:** APIs make `send_to_agent` a one-liner; demos never show rejected
            packets or duplicated spends.

            **What actually happens:** each handoff is a serialisation boundary, a validation gate,
            more tokens in some context, and another chance to drop fields. Failed handoffs retry;
            retries compound cost and error. Treating handoffs as free produces deep graphs nobody
            can debug.

            **How to catch yourself:** budget maximum handoffs the way you budget maximum tool
            steps. If you cannot say what a failed handoff costs, you have not priced the design.

      - type: common_mistake
        markdown: |
          **No conflict type — only more prose.** When agents disagree, writing a longer summary is
          not reconciliation.

          **Shared mutable scratchpad with no version.** Last writer wins silently.

          **Measuring only final task success.** You will not see ping-pong until the bill arrives.

      - type: exercise_set
        payload:
          checkedByPlatform: false
          markdown: |
            1. Invent a ping-pong transcript of six turns. Add the smallest code rule that stops it.
            2. Design a shared `facts` store API with conflict behaviour.
            3. List metrics you would chart for a three-agent system in its first week in production.
            4. Take a multi-agent design and collapse it to a workflow; list what you lose and gain.
            5. Write an incident blameless summary template for a wrong merge of two agents' facts.

      - type: quiz_set
        payload:
          selfCheck: true
          items:
            - question: "What is a ping-pong failure?"
              answer: >-
                Two roles repeatedly hand work back and forth without a progress metric or turn
                limit, burning budget without converging.
            - question: "How should conflicting facts be handled?"
              answer: >-
                Via an explicit shared store and conflict/escalation rules in code — not by fluent
                merger prose.
            - question: "Why log handoff payload hashes?"
              answer: >-
                So you can see whether state changed, was rejected, or was silently overwritten
                across roles.
            - question: "When should you collapse multi-agent to a workflow?"
              answer: >-
                When roles run in fixed order with overlapping tools and little branching — fewer
                decisions, clearer tests.

      - type: mastery_criteria
        payload:
          markdown: |
            You have this when you can:

            - Name multi-agent-specific failures and a mitigation for each.
            - Instrument cross-agent traces and handoff health.
            - Price handoffs as reliability and cost events.
            - Collapse unjustified role graphs back into workflows.
