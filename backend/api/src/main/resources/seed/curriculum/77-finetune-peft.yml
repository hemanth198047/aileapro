  - slug: peft-lora-intuition
    title: PEFT and LoRA Intuition
    kind: knowledge_unit
    parent: peft-and-lora
    status: published
    version: 1.0.0
    difficulty: 4
    estimateMinutes: 35
    volatility: HIGH
    knowledgeClass: CURRENT
    lastReviewedAt: 2026-09-19
    lastVerifiedAt: 2026-09-19
    tags: [peft, lora, fine-tuning, llm, adapters]
    objectives:
      - Explain why full fine-tuning is often unnecessary for adaptation.
      - Describe LoRA as low-rank updates on frozen weights.
      - State what you store and serve when many task adapters share one base model.
      - Identify failure modes PEFT does not automatically solve.
    description: >-
      Parameter-efficient fine-tuning updates a small set of parameters — often low-rank
      matrices beside attention projections — while the base model stays frozen and shareable.
    blocks:
      - type: why
        markdown: |
          Full fine-tuning of a large language model duplicates billions of parameters per
          variant, needs heavy optimiser state, and makes "one base model, many products"
          operationally painful.

          LoRA and related PEFT methods exist so adaptation is cheap enough to try, cheap enough
          to keep many variants, and reversible enough to roll back.

      - type: eli5
        markdown: |
          The big model is a huge notebook written in permanent ink. Full fine-tuning rewrites
          pages. LoRA sticks a thin transparent overlay on a few pages and writes only on the
          overlay.

          You keep one notebook (the base weights) and a stack of cheap overlays (adapters). Swap
          the overlay to switch tasks. If an overlay goes badly, throw it away — the notebook is
          unchanged.

      - type: beginner
        markdown: |
          **PEFT (parameter-efficient fine-tuning)** means adapting a pretrained model by training
          only a small fraction of parameters (or a small attached module), not every weight.

          **LoRA (Low-Rank Adaptation)** freezes the pretrained weight matrix $W$ and learns a
          low-rank update:

          $$
          W' = W + \frac{\alpha}{r} B A
          $$

          where $A \in \mathbb{R}^{r \times k}$, $B \in \mathbb{R}^{d \times r}$, and rank
          $r \ll \min(d, k)$. Only $A$ and $B$ (plus maybe biases/norms, depending on setup) are
          trained. At inference you can merge $BA$ into $W$ for zero extra latency, or keep
          adapters separate to hot-swap tasks.

          Typical injection points are attention projection matrices (query/value, sometimes key
          and output). The intuition: task adaptation often lies in a low-dimensional subspace of
          the full weight update.

      - type: intermediate
        markdown: |
          **Why low rank is plausible.** Fine-tuning updates for a new task are often highly
          constrained relative to the full parameter space. Representing $\Delta W$ as $BA$ with
          small $r$ is an inductive bias that regularises adaptation and cuts trainable parameter
          count by orders of magnitude versus full FT.

          **What you gain operationally.**

          - Smaller optimiser state and lower GPU memory during training.
          - One shared base checkpoint; many small adapter files per customer or task.
          - Easier rollback: disable or replace the adapter without reverting a full model copy.
          - Optional merge for single-tenant serving where latency matters more than hot-swap.

          **What you still must get right.** Data quality, learning rate, rank $r$, which layers
          to adapt, and evaluation. LoRA does not invent missing supervision. Too-high rank or
          aggressive training can still overfit and still damage behaviours if your data is narrow.

          **Related PEFT family (names only, same idea).** Adapters (small bottleneck modules),
          prefix/prompt tuning (learned virtual tokens), QLoRA-style stacks that combine
          quantisation with LoRA for further memory savings. Libraries and recipes churn; the
          shared pattern is "freeze most of $W$, train something small."

          **Serving many variants.** Prefer adapter hot-swap when tenants share a base model and
          need isolation of behaviour. Prefer merged weights when you have one dominant adapter
          and want maximum throughput. Measure — merging is not free if you must keep dozens of
          merged copies anyway.

      - type: example
        markdown: |
          Rough parameter arithmetic for intuition (illustrative dimensions):

          - Full update of a $4096 \times 4096$ matrix: $\sim 16$M parameters.
          - LoRA with $r = 8$: $A$ is $8 \times 4096$, $B$ is $4096 \times 8$ → $\sim 65$k
            parameters for that matrix — about $250\times$ fewer.

          Apply across several attention projections and the trainable count is still tiny versus
          the base model. That is why teams can keep dozens of task adapters on disk without
          dozens of full model replicas.

          **Product sketch.** One open base model serves three internal tools: support tone,
          SQL-generation style, and internal summarisation. Three LoRA adapters, one eval suite
          each, shared embedding/tokenizer stack. Shipping a fix to support tone is an adapter
          replace, not a re-bake of the other two.

      - type: code
        payload:
          language: python
          markdown: |
            Pseudocode for a LoRA-wrapped linear layer — structure, not a training framework.

            ```python
            import torch
            import torch.nn as nn

            class LoRALinear(nn.Module):
                def __init__(self, base: nn.Linear, rank: int = 8, alpha: float = 16.0):
                    super().__init__()
                    self.base = base
                    for p in self.base.parameters():
                        p.requires_grad = False
                    d_out, d_in = base.weight.shape
                    self.A = nn.Parameter(torch.randn(rank, d_in) * 0.01)
                    self.B = nn.Parameter(torch.zeros(d_out, rank))
                    self.scale = alpha / rank

                def forward(self, x):
                    return self.base(x) + self.scale * (x @ self.A.T @ self.B.T)

                def merged_weight(self):
                    return self.base.weight + self.scale * (self.B @ self.A)
            ```

            Training updates `A` and `B` only. For single-adapter serving, fold `merged_weight()`
            back into a plain `nn.Linear` and drop the LoRA path.

      - type: misconception
        payload:
          code: lora.as_good_as_full_ft
          claim: "LoRA always matches full fine-tuning quality."
          markdown: |
            **The claim:** because LoRA is popular, it is a free lunch — same quality, lower cost.

            **Why it feels right:** many public benchmarks show LoRA close to full FT for common
            instruction and domain-adaptation setups, and memory savings are dramatic.

            **What actually happens:** LoRA approximates $\Delta W$ in a low-rank subspace. For
            some tasks that subspace is enough; for others (large distribution shifts, heavy
            new capabilities) full FT or higher rank / more adapted modules can still win. Rank,
            target modules, and data matter. "We used LoRA" is not a quality guarantee.

            **How to catch yourself:** ablate rank and compare against a strong prompt baseline
            and, when affordable, against a fuller update on a subset. Optimise for the metric
            you ship, not for the method name.

      - type: common_mistake
        markdown: |
          **Treating adapter swap as tenant isolation for secrets.** Adapters change behaviour;
          they do not sandbox data. Retrieval filters and auth still belong in your application.

          **Tuning rank without measuring.** $r=64$ "because bigger is safer" can overfit and
          erase the memory advantage that justified PEFT.

      - type: exercise_set
        payload:
          checkedByPlatform: false
          markdown: |
            1. Write $W' = W + BA$ in words a teammate can understand, including why $r$ is small.
            2. Give two operational reasons to prefer LoRA over full fine-tuning for multi-tenant
               behaviour variants.
            3. When would you merge an adapter into the base weights, and when would you keep it
               separate?
            4. Does LoRA remove the need for a regression eval suite? Why or why not?
            5. Estimate trainable parameters for one $d \times d$ matrix with LoRA rank $r$, and
               compare to $d^2$.

      - type: quiz_set
        payload:
          selfCheck: true
          items:
            - question: "What stays frozen in standard LoRA?"
              answer: "The pretrained base weights $W$; only the low-rank factors (and similar small sets) train."
            - question: "What does rank $r$ control?"
              answer: >-
                The capacity of the update $\Delta W = BA$ — higher $r$ means a richer update and
                more trainable parameters.
            - question: "Why can many adapters share one base model?"
              answer: >-
                Each adapter is a small file of factors; the large frozen weights are loaded once
                and reused.
            - question: "Name one problem LoRA does not automatically fix."
              answer: >-
                Bad or narrow training data, missing evaluation, or using fine-tuning where
                retrieval was the right tool.

      - type: mastery_criteria
        payload:
          markdown: |
            You have this when you can:

            - Sketch LoRA's update equation and say what is stored on disk per task.
            - Argue for PEFT vs full FT from memory, serving, and rollback — not from hype.
            - Choose merge vs hot-swap for a described serving setup.
            - State clearly what PEFT does not excuse you from measuring.
