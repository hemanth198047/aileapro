# Wave 2, part 1: the calculus that training actually uses.
#
# Scope is deliberately narrow. A learner heading for machine learning needs the derivative as
# a rate, the gradient as a direction, and the chain rule as the thing backpropagation is.
# Limits, integration, and series are not on this page because nothing downstream in the seed
# depends on them yet, and pretending otherwise would be padding.

units:
  - slug: calculus-for-ml
    title: Calculus for Machine Learning
    kind: chapter
    parent: calculus
    status: published
    version: 1.0.0
    difficulty: 3
    estimateMinutes: 65
    volatility: LOW
    knowledgeClass: FOUNDATIONAL
    lastReviewedAt: 2026-09-19
    tags: [mathematics, calculus, gradients]
    objectives:
      - Read a derivative as a rate of change rather than as a formula to memorise.
      - Apply the chain rule to a composed function and say what each factor contributes.
      - Connect both to the gradient step that trains every model in this curriculum.
    description: >-
      Two ideas, taught for use: the derivative as a rate, and the chain rule as the rule that
      makes backpropagation possible. Everything else about calculus is left where it belongs.
    blocks:
      - type: why
        markdown: |
          Training a model is a loop of "measure the error, then move the parameters the way that
          reduces it". The second half of that sentence is a derivative. Without it there is no
          direction to move in, and the only alternative is guessing.

          These two pages are the minimum needed to read a gradient in a paper, debug a training
          run, and understand why the chain rule is the reason deep networks are trainable at all.

  - slug: derivatives-as-rates
    title: Derivatives as Rates of Change
    kind: knowledge_unit
    parent: calculus-for-ml
    status: published
    version: 1.0.0
    difficulty: 2
    estimateMinutes: 30
    volatility: LOW
    knowledgeClass: FOUNDATIONAL
    lastReviewedAt: 2026-09-19
    tags: [mathematics, calculus, gradients, optimization]
    objectives:
      - State what a derivative measures and what its sign and magnitude each tell you.
      - Compute a derivative from the difference quotient on a simple function.
      - Explain why the gradient points uphill and what follows for gradient descent.
      - Name a point where a derivative does not exist and say what that means for training.
    description: >-
      A derivative answers one question: if I nudge the input, how much does the output move, and
      in which direction? That is the only question gradient descent ever asks.
    blocks:
      - type: why
        markdown: |
          Every training loop you will ever write contains the line `w -= lr * grad`. The whole
          justification for that line is a derivative: it says which way the loss goes when the
          weight moves, so stepping the other way lowers the loss.

          Read the derivative as a *rate* rather than as a table of rules and this becomes obvious
          instead of magical — and the two most common training failures, a dead gradient and an
          exploding one, become things you can name instead of things that just happen.

      - type: eli5
        markdown: |
          You are driving and you look at the speedometer. It does not tell you where you are; it
          tells you how fast your position is changing right now.

          A derivative is a speedometer for any quantity. How fast does the error change when I
          turn this dial a tiny bit? If the answer is "it goes up fast", turn the dial the other
          way. If the answer is "it barely moves", this dial is not the problem.

      - type: beginner
        markdown: |
          For a function $f$, the derivative at a point $x$ is the limit of the average rate of
          change over a shrinking interval:

          $$
          f'(x) = \lim_{h \to 0} \frac{f(x + h) - f(x)}{h}
          $$

          Two things to read off it, and both matter more than the arithmetic:

          - **Sign.** $f'(x) > 0$ means the output rises as the input rises. $f'(x) < 0$ means it
            falls. $f'(x) = 0$ means you are at a flat point — a minimum, a maximum, or a saddle.
          - **Magnitude.** A large $|f'(x)|$ means a small nudge to the input causes a large move
            in the output. Sensitivity, in one number.

          The rules you will actually use, all of which follow from the limit above:

          $$
          \frac{d}{dx}x^n = nx^{n-1}, \qquad
          \frac{d}{dx}e^{x} = e^{x}, \qquad
          \frac{d}{dx}\ln x = \frac{1}{x}
          $$

          For a function of several variables, the **partial derivative**
          $\partial f / \partial x_i$ is the same thing with every other input held fixed, and the
          **gradient** $\nabla f$ is the vector of all of them.

      - type: intermediate
        markdown: |
          The gradient is not just a bag of partial derivatives — it has a geometric meaning that
          is the entire reason gradient descent works. Near a point, $f$ is well approximated by
          its linearisation:

          $$
          f(\mathbf{x} + \mathbf{d}) \approx f(\mathbf{x}) + \nabla f(\mathbf{x}) \cdot \mathbf{d}
          $$

          That dot product is largest when $\mathbf{d}$ points the same way as $\nabla f$, so the
          gradient is the direction of **steepest increase**. Minimising means stepping along
          $-\nabla f$, which is exactly the update rule from the neuron unit.

          The word *approximately* is doing real work. The linearisation is only trustworthy in a
          small neighbourhood, which is what the learning rate controls. Too large a step leaves
          the region where the approximation held, and the loss can rise even though you moved
          "downhill" — the oscillating loss curve in every badly tuned training run.

          A derivative can also fail to exist. $|x|$ has no derivative at $0$: the rate from the
          left is $-1$ and from the right is $+1$. Practical code picks one (subgradient $0$ is
          the usual convention) and moves on, but that choice is a decision, not a fact.

      - type: example
        markdown: |
          Take $f(x) = x^2$ and find the rate at $x = 3$ from the definition, not the rule.

          $$
          \frac{f(3+h) - f(3)}{h} = \frac{(3+h)^2 - 9}{h} = \frac{9 + 6h + h^2 - 9}{h} = 6 + h
          $$

          As $h \to 0$ this is $6$, matching $f'(x) = 2x$ at $x = 3$.

          Now read it as a rate. At $x = 3$ the function climbs six units of output per unit of
          input. So to *decrease* $f$, move $x$ down. One gradient descent step with
          $\eta = 0.1$:

          $$
          x \leftarrow 3 - 0.1 \cdot 6 = 2.4, \qquad f(2.4) = 5.76 < 9
          $$

          The loss fell, as promised. Try the same step with $\eta = 1.0$: $x \leftarrow 3 - 6 =
          -3$ and $f(-3) = 9$ — no progress at all, because the step left the neighbourhood where
          the linear approximation was any good. With $\eta = 1.5$ it gets worse each step.

      - type: misconception
        payload:
          code: calc.gradient_points_downhill
          claim: "The gradient points toward the minimum, so you follow it."
          markdown: |
            **The claim:** the gradient shows the way down to the answer, so training follows it.

            **Why it feels right:** gradient descent does go downhill, and the gradient is the only
            direction anyone mentions. The minus sign in the update rule is easy to read as
            decoration.

            **What actually happens:** the gradient points in the direction of steepest *increase*.
            That is why the update subtracts it. Someone who has this backwards writes
            `w += lr * grad`, watches the loss climb steadily, and concludes the model cannot
            learn the task.

            Worse, even $-\nabla f$ does not point at the minimum. It points at the steepest local
            descent, which in a long narrow valley is mostly *across* the valley rather than along
            it. This is why plain gradient descent zigzags and why momentum exists.

            **How to catch yourself:** check the sign on a function you can do in your head. At
            $x = 3$ on $f(x) = x^2$, the gradient is $+6$ and the minimum is at $0$, which is in
            the negative direction. The gradient and the answer are on opposite sides.

      - type: exercise_set
        payload:
          checkedByPlatform: false
          markdown: |
            1. Compute $f'(2)$ for $f(x) = x^2$ from the difference quotient. Show the algebra.
            2. For $f(x) = 3x^2 - 12x + 7$, find where $f'(x) = 0$ and say whether it is a minimum
               or a maximum, justifying the answer from the sign of $f'$ on either side.
            3. $f(x, y) = x^2 + 3y$. Write $\nabla f$ and evaluate it at $(1, 2)$. Which input is
               the output more sensitive to there?
            4. Starting from $x = 4$ on $f(x) = x^2$, take three gradient descent steps with
               $\eta = 0.1$, then three with $\eta = 1.1$. Report both sequences of $f(x)$.
            5. $f(x) = \max(0, x)$ is the ReLU. State $f'$ for $x < 0$ and $x > 0$, and say what a
               network does with the gradient of a unit sitting at $x = -5$.

      - type: quiz_set
        payload:
          selfCheck: true
          items:
            - question: "What do the sign and the magnitude of a derivative each tell you?"
              answer: >-
                The sign says whether the output rises or falls as the input rises; the magnitude
                says how sensitive the output is to a small change in the input.
            - question: "Why does the parameter update subtract the gradient?"
              answer: >-
                Because the gradient points in the direction of steepest increase, and training is
                trying to decrease the loss.
            - question: "What breaks when the learning rate is too large, in terms of this page?"
              answer: >-
                The step leaves the neighbourhood where the linear approximation to the function is
                accurate, so the predicted decrease no longer holds and the loss can rise.
            - question: "What does a gradient of zero on a weight mean for that weight's training?"
              answer: >-
                It receives no update from that example. The loss is locally flat in that direction,
                which is why saturated activations stall learning.

      - type: mastery_criteria
        payload:
          markdown: |
            You have this when you can:

            - Compute a derivative from the difference quotient on a quadratic and get the same
              answer as the power rule.
            - Say, without hesitating, which way the gradient points and why the update subtracts it.
            - Predict from the gradient and the learning rate whether one step will lower the loss.
            - Explain what a zero gradient means for a parameter, and name one situation that
              produces one.
