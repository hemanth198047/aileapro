  - slug: chain-rule-for-gradients
    title: The Chain Rule, and Why Backpropagation Is Just Bookkeeping
    kind: knowledge_unit
    parent: calculus-for-ml
    status: published
    version: 1.0.0
    difficulty: 3
    estimateMinutes: 35
    volatility: LOW
    knowledgeClass: FOUNDATIONAL
    lastReviewedAt: 2026-09-19
    tags: [mathematics, calculus, chain-rule, backpropagation]
    objectives:
      - Apply the chain rule to a composition of two or three functions.
      - Trace a gradient backwards through a small computation graph.
      - Explain why backpropagation costs about the same as a forward pass.
      - Predict what a chain of small local derivatives does to a gradient.
    description: >-
      A network is a composition of functions, so its gradient is a product of local derivatives.
      That single fact is what backpropagation implements, and what vanishing gradients are.
    blocks:
      - type: why
        markdown: |
          A neural network is not a mysterious object: it is $f_3(f_2(f_1(x)))$ with learned
          parameters in each layer. Differentiating a composition is exactly what the chain rule
          does, so the gradient of a hundred-layer network needs no new mathematics.

          It also explains a failure you will meet. A product of numbers each smaller than one
          shrinks toward zero, and a product of numbers each larger than one explodes. Both are
          just the chain rule, applied many times.

      - type: eli5
        markdown: |
          A machine has three gears in a row. Turning the first gear turns the second twice as
          fast; the second turns the third three times as fast.

          How fast does the third gear turn when you turn the first? Six times as fast. You
          multiply the ratios along the chain.

          The chain rule is that, for any chain of any length. And if every gear halved the speed
          instead of doubling it, then after twenty gears almost nothing is moving — which is a
          real problem in deep networks with a real name.

      - type: beginner
        markdown: |
          If $y = f(u)$ and $u = g(x)$, then

          $$
          \frac{dy}{dx} = \frac{dy}{du} \cdot \frac{du}{dx}
          $$

          Read it as rates multiplying: $u$ changes so fast per unit of $x$, and $y$ changes so
          fast per unit of $u$, so $y$ changes at the product of those rates per unit of $x$.

          For a longer chain the pattern continues:

          $$
          \frac{dy}{dx} = \frac{dy}{du_3} \cdot \frac{du_3}{du_2} \cdot \frac{du_2}{du_1}
          \cdot \frac{du_1}{dx}
          $$

          With several variables, the derivatives are matrices (Jacobians) and the products are
          matrix products, but the structure is unchanged. That is why the linear algebra unit
          comes first.

      - type: intermediate
        markdown: |
          **Backpropagation is the chain rule with memoisation.** In a network, one intermediate
          value feeds many downstream computations. Recomputing its derivative for each path would
          be exponential in depth; storing it once and reusing it is linear.

          The algorithm therefore has two halves:

          - **Forward pass.** Compute and *cache* each intermediate value.
          - **Backward pass.** Start with $\partial L / \partial L = 1$ at the output and walk
            backwards, at each node multiplying the incoming gradient by that node's local
            derivative, then passing the result to its inputs.

          Because each node does a constant amount of work per edge in both directions, the
          backward pass costs roughly what the forward pass costs — typically within a factor of
          two or three. That is the entire reason deep learning is affordable.

          Now read the product structurally. The gradient reaching layer 1 in an $L$-layer network
          is a product of $L$ local factors. If a typical factor is $0.5$, then after 20 layers the
          gradient carries a factor of about $10^{-6}$: the early layers stop learning. If a typical
          factor is $1.5$, the same product is about $3300$ and training diverges. Sigmoid
          activations have a maximum derivative of $0.25$, which is why deep sigmoid stacks were
          effectively untrainable and why ReLU and residual connections were such a large change.

      - type: example
        markdown: |
          A three-node graph, differentiated by hand. Let

          $$
          u = 2x, \qquad v = u^2, \qquad L = v + 1
          $$

          with $x = 3$.

          **Forward.** $u = 6$, $v = 36$, $L = 37$. Keep all three; the backward pass needs them.

          **Local derivatives.**

          $$
          \frac{\partial L}{\partial v} = 1, \qquad
          \frac{\partial v}{\partial u} = 2u = 12, \qquad
          \frac{\partial u}{\partial x} = 2
          $$

          **Backward.** Multiply along the chain, carrying the running gradient:

          $$
          \frac{\partial L}{\partial u} = 1 \cdot 12 = 12, \qquad
          \frac{\partial L}{\partial x} = 12 \cdot 2 = 24
          $$

          **Check it directly.** $L = (2x)^2 + 1 = 4x^2 + 1$, so $dL/dx = 8x = 24$ at $x = 3$.
          Same answer.

          Notice that $\partial v / \partial u = 2u$ needed the *cached* value $u = 6$ from the
          forward pass. That is why training uses memory proportional to the number of activations,
          and why a batch size that fits in memory for inference may not fit for training.

      - type: misconception
        payload:
          code: calc.backprop_is_new_math
          claim: "Backpropagation is a separate algorithm you have to learn on top of calculus."
          markdown: |
            **The claim:** backpropagation is its own technique, distinct from differentiation, with
            its own rules to memorise.

            **Why it feels right:** it has a name, a paper, and a reputation for being the hard part
            of neural networks. Framework documentation describes it as a feature.

            **What actually happens:** backpropagation is the chain rule evaluated in a particular
            order — output-to-input — with intermediate results cached instead of recomputed. There
            is no additional mathematical content. The contribution is computational: it makes the
            gradient cost about the same as the prediction, rather than growing with the number of
            parameters.

            Believing it is separate magic has a cost. People who hold this view cannot reason about
            vanishing gradients, cannot say why an activation with a small derivative hurts depth,
            and cannot explain why training needs more memory than inference. All three follow
            immediately from "it is a product of cached local derivatives".

            **How to catch yourself:** differentiate a three-node chain by hand and then by
            substitution, as in the example above. If both give the same number, there was never a
            second algorithm.

      - type: common_mistake
        markdown: |
          **Forgetting a factor in a longer chain.** The usual symptom is a gradient that is off by
          a constant, which looks like a badly tuned learning rate. Write the chain out with every
          factor before simplifying.

          **Assuming a deep network just needs more layers.** Depth multiplies more factors into
          the gradient product. Beyond a point, adding layers makes the early ones learn *less*
          unless something — normalisation, residual connections, a better activation — keeps the
          typical factor near one.

      - type: exercise_set
        payload:
          checkedByPlatform: false
          markdown: |
            1. $y = (3x + 1)^2$. Find $dy/dx$ with the chain rule, then expand and differentiate
               directly. Confirm they agree.
            2. $L = \sigma(wx + b)$ with $\sigma$ the logistic function, whose derivative is
               $\sigma(z)(1 - \sigma(z))$. Write $\partial L / \partial w$.
            3. Using the fact that $\sigma'(z) \le 0.25$, give an upper bound on the gradient
               magnitude reaching the first layer of a 10-layer sigmoid network with unit weights.
            4. In the worked example, change $u = 2x$ to $u = 5x$ and recompute
               $\partial L / \partial x$ both ways.
            5. Explain in two sentences why the backward pass needs the forward pass's cached
               values, and what that implies for memory during training.

      - type: quiz_set
        payload:
          selfCheck: true
          items:
            - question: "State the chain rule for $y = f(g(x))$ and read it aloud as rates."
              answer: >-
                $dy/dx = f'(g(x)) \cdot g'(x)$. The rate of $y$ per unit of $x$ is the rate of $y$
                per unit of $g$, times the rate of $g$ per unit of $x$.
            - question: "Why is backpropagation not more expensive than the forward pass?"
              answer: >-
                Each node's local derivative is computed once from cached forward values and reused
                for every path through it, so the work is proportional to the number of edges in
                both directions.
            - question: "What happens to the gradient at layer one when every local factor is 0.5 in a 20-layer network?"
              answer: >-
                It is multiplied by about $10^{-6}$, so the early layers receive almost no update.
                That is the vanishing gradient problem.
            - question: "Why does training need more memory than inference?"
              answer: >-
                The backward pass needs the intermediate activations from the forward pass, so they
                must be kept rather than discarded as soon as they are used.

      - type: mastery_criteria
        payload:
          markdown: |
            You have this when you can:

            - Differentiate a three-function composition by hand and verify it by substitution.
            - Draw a small computation graph and push a gradient backwards through it, naming the
              local derivative at each node.
            - Explain backpropagation to someone else without using the word "magic", in terms of
              cached local derivatives.
            - Predict, from the typical size of a local factor, whether a deep stack will vanish,
              explode, or train.
