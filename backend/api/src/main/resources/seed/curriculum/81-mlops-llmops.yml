  - slug: observability-for-llm-apps
    title: Observability for LLM Apps
    kind: knowledge_unit
    parent: running-llms
    status: published
    version: 1.0.0
    difficulty: 4
    estimateMinutes: 38
    volatility: HIGH
    knowledgeClass: CURRENT
    lastReviewedAt: 2026-09-19
    lastVerifiedAt: 2026-09-19
    tags: [llmops, observability, evaluation, tracing]
    objectives:
      - List the fields a production LLM trace must record to debug quality and cost.
      - Separate online metrics, sampled human review, and offline regression suites.
      - Detect silent quality regressions when accuracy-style metrics do not apply.
      - Design alerts that fire on spend, latency, and eval-score drift — not only on HTTP 500s.
    description: >-
      Seeing inside non-deterministic LLM features: traces, token and cost accounting, eval scores
      in production samples, and alerts that notice fluent failure.
    blocks:
      - type: why
        markdown: |
          Classical services fail loudly: 500s, timeouts, empty bodies. LLM features fail politely:
          a confident wrong answer with HTTP 200. If you only monitor uptime, you will learn about
          quality from Twitter.

          Observability here means reconstructing *what the model saw and said*, what it cost, and
          whether sampled outputs still pass the bars you set before launch.

      - type: eli5
        markdown: |
          A vending machine that sometimes gives the wrong snack but always takes the money will
          never light its "out of order" bulb. You only notice if you watch what people received,
          how long they waited, and how often they ask for a refund.

          LLM apps are that machine. Logs of "request succeeded" are not enough — you need a record
          of the snack.

      - type: beginner
        markdown: |
          **Minimum trace for one LLM call** (extend for tool loops):

          - Request id, user/tenant id (or a privacy-preserving stand-in)
          - Prompt template id + version, model id + version, temperature and other decode params
          - Retrieved chunk ids / tool calls if any (not necessarily full PII-bearing text in the
            hot path — store references + redacted previews)
          - Input/output token counts, estimated cost, latency to first token and to completion
          - Safety filter outcomes, finish reason, schema-validation pass/fail
          - Optional: offline eval scores attached later on a sample

          **Three complementary views:**

          1. **Operational:** error rate, p95 latency, tokens and $, cache hit rate.
          2. **Quality sample:** daily draw of N traces scored by rubric, model-as-judge with known
             bias, or humans on high-risk traffic.
          3. **Regression suite:** fixed prompts run on every prompt/model change (see eval unit).

          Uptime without (2) and (3) is theatre.

      - type: intermediate
        markdown: |
          **Fluent failure modes to instrument for:**

          - Sudden drop in citation rate or retrieval hit rate while the model still answers
          - Rise in "I don't know" *or* in unsupported claims (both can be regressions)
          - Schema break rate for structured outputs
          - Tool-loop step count and repeat-call rate (agents)
          - Cost per successful task, not only cost per HTTP call

          **Privacy and retention.** Traces often contain user content. Default to redaction,
          field-level encryption, short retention for raw prompts, and role-gated access. "Log
          everything forever" is how you create a second production incident.

          **Online eval is sampling, not proof.** A 1% sample with a noisy judge can miss a rare
          catastrophic failure mode. Pair it with adversarial suites and targeted sampling on
          high-risk intents (refunds, medical, legal, credentials).

          **Prompt and model versioning in the trace** is what makes canaries possible. Ship vNext
          to 5% of traffic, compare eval and cost distributions, roll back by version pin — the same
          muscle as classical ML serving, applied to text.

          **Dashboards that matter on day one:** $/day by feature, p95 latency, eval score on the
          canary slice, and a queue of traces that failed schema or safety checks. Everything else
          can wait.

      - type: example
        markdown: |
          Docs assistant. After a prompt tweak, HTTP success stays 99.7%. Within 48 hours:

          - Median tokens/call rises 40% (prompt grew; nobody capped it)
          - Faithfulness score on the 200-trace daily sample falls 0.91 → 0.79
          - Support tickets: "answers sound right but cite the wrong policy"

          Because traces store `prompt_version`, `retrieval_ids`, and the model reply, the team diffs
          v12 vs v11, finds an instruction that encouraged answering without quotes, reverts the
          pin, and adds a canary gate: no full rollout if sampled faithfulness drops >0.05.

          Without versioned traces, the same incident is "the model got worse" — unactionable.

      - type: misconception
        payload:
          code: llmops.uptime_equals_healthy
          claim: "If the LLM endpoint returns 200 and p99 is fine, the feature is healthy."
          markdown: |
            **The claim:** classical SRE signals are sufficient because a bad answer is still a
            successful RPC.

            **Why it feels right:** those signals are what existing runbooks know how to page on.

            **What actually happens:** quality and cost regressions present as normal responses.
            Users absorb the damage until churn or screenshots arrive. Latency can even improve if a
            bug truncates context.

            **How to catch yourself:** ask what alert would fire if every answer became confidently
            wrong while staying under 800ms. If the answer is "none," you are monitoring the socket,
            not the product.

      - type: common_mistake
        markdown: |
          **Logging only the final assistant message** in an agent or RAG stack. You need retrieval
          and tool rows to debug.

          **Paging on token count without a baseline per prompt version.** Traffic mix shifts will
          false-alarm you.

          **Shipping prompt edits with no canary and no suite.** You are flying blind on purpose.

      - type: exercise_set
        payload:
          checkedByPlatform: false
          markdown: |
            1. Write a JSON schema for one RAG call's trace. Mark which fields are PII-sensitive.
            2. Propose three alerts with thresholds for a billing-assistant feature.
            3. Design a 5% canary: what you compare, how long you wait, what forces rollback.
            4. List four fluent failure modes and the metric that would move for each.
            5. Explain how you would sample traces for human review without reading everyone's data.

      - type: quiz_set
        payload:
          selfCheck: true
          items:
            - question: "Why can HTTP 200 hide an LLM outage?"
              answer: >-
                Wrong or unsafe answers still return success; quality must be sampled and scored,
                not inferred from uptime.
            - question: "What belongs in a minimum LLM trace?"
              answer: >-
                Versions (prompt, model), token/cost/latency, retrieval or tool references, safety
                and schema outcomes, and ids needed to join to user impact.
            - question: "What are the three complementary quality views?"
              answer: >-
                Operational metrics, sampled online quality review, and a fixed offline regression
                suite on every change.
            - question: "Why version prompts in production traces?"
              answer: >-
                  So canaries and rollbacks attribute behaviour to a specific prompt/model pair
                  instead of an unidentifiable "the assistant."

      - type: mastery_criteria
        payload:
          markdown: |
            You have this when you can:

            - Specify a trace schema that makes a quality incident debuggable in one sitting.
            - Name alerts that catch fluent failure, not only transport failure.
            - Separate canary, sample review, and golden suites by what each can prove.
            - Apply retention and redaction appropriate to prompt content.
