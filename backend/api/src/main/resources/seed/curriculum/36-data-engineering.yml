  - slug: feature-store-vs-pipeline
    title: Feature Store vs Pipeline
    kind: knowledge_unit
    parent: data-for-ml
    status: published
    version: 1.0.0
    difficulty: 3
    estimateMinutes: 36
    volatility: MEDIUM
    knowledgeClass: STABLE
    lastReviewedAt: 2026-09-20
    lastVerifiedAt: 2026-09-20
    tags: [features, feature-store, pipelines, kafka, mlops]
    objectives:
      - Distinguish data pipelines (move/transform events) from feature stores (serve consistent features).
      - Explain point-in-time correctness for training labels vs online serving.
      - Choose when a lightweight shared transform library beats a full feature platform.
      - Connect streaming ingestion to the freshness guarantees models actually need.
    description: >-
      Pipelines move and transform data. Feature stores (or equivalent discipline) make the *same*
      feature definitions available for training and serving without leakage.
    blocks:
      - type: why
        markdown: |
          Teams say "we have a pipeline" when they mean "a nightly job dumps a CSV." Then serving
          recomputes something vaguely similar in the API. Predictions drift from the offline metric
          and nobody can say which definition of `user_avg_spend_30d` was used.

          The distinction between **moving data** and **serving features with a contract** is what
          prevents that story.

      - type: eli5
        markdown: |
          A bakery truck (pipeline) delivers flour to the kitchen every morning. A recipe card
          (feature definition) says exactly how to measure flour for every cake, whether you bake
          now or tomorrow from frozen dough.

          Having trucks is not the same as having one recipe card both shifts use. Without the card,
          night bakers invent their own scoops.

      - type: beginner
        markdown: |
          A **data pipeline** ingests, validates, and transforms events or tables into storage
          (batch jobs, streams). Example: click events land in a log; a consumer writes cleaned
          rows to a warehouse. Systems like Kafka shine as a durable log between producers and
          many consumers — movement and fan-out, not feature semantics by themselves.

          A **feature store** (product or patterned discipline) provides:

          - **Registered feature definitions** (code + metadata).
          - **Offline access** for training with **point-in-time joins** (as-of label time).
          - **Online access** for low-latency serving with the same definitions.
          - **Lineage** back to source data and transform versions.

          You can implement much of this with a shared library + tables + a key-value cache. The
          product name matters less than the contract: train and serve call one definition.

          ```
          Pipeline:  events -> clean tables / topics
          Features:  definitions over those tables
          Training:  point-in-time join features to labels
          Serving:   online get(entity_id) -> feature vector
          ```

      - type: intermediate
        markdown: |
          **Point-in-time correctness.** When training on "did the user churn by day T?", features
          must use only information knowable before T. A naive join to "current" aggregates leaks
          the future. Feature platforms emphasise time-travel joins for this reason; rolling your
          own means you own that bug.

          **Freshness vs consistency.** Streams can update online features in seconds. Training
          snapshots might be daily. Document the skew you accept; monitor online/offline feature
          distributions.

          **When not to buy a feature store.** Few models, one team, shared transform package,
          strong review culture — start there. Add a store when many consumers need the same
          features, or when point-in-time bugs keep recurring.

          **Experiment tracking complements but does not replace features.** Logging runs (e.g. via
          MLflow-style tracking) records *which* data version and code produced a model; it does
          not by itself guarantee online serving uses that code. Wire them: run → feature view
          version → model version → deployment config.

      - type: example
        markdown: |
          Feature: `orders_7d` for fraud scoring.

          **Pipeline-only mistake:**

          ```
          Nightly job: COUNT(*) FROM orders WHERE user_id=? AND ts > now()-7d  -> train.csv
          API:         COUNT(*) FROM orders WHERE user_id=? AND ts > now()-7d  // live SQL
          ```

          Looks identical until: timezone differs, soft-deleted orders excluded in one path, or
          training used a warehouse snapshot while serving hit the primary DB mid-write.

          **Contract approach:**

          ```python
          # features/orders.py  — single definition
          def orders_7d(entity_id, as_of: datetime) -> int:
              return count_orders(entity_id, start=as_of - days(7), end=as_of)

          # training
          df["orders_7d"] = [orders_7d(u, label_time) for u, label_time in rows]

          # serving
          value = orders_7d(user_id, as_of=request_time)
          ```

          Online path may read a precomputed table updated from a Kafka consumer; the *function
          meaning* stays one module. Precompute is an optimisation, not a second definition.

      - type: misconception
        payload:
          code: data.feature_store_is_pipeline
          claim: "If events flow through Kafka into a warehouse, we already have a feature store."
          markdown: |
            **The claim:** a robust ingestion pipeline equals feature management for ML.

            **Why it feels right:** data engineering delivered reliable tables; dashboards work;
            "the data is there."

            **What actually happens:** pipelines move bytes. Feature stores (or equivalent
            discipline) define *point-in-time semantics*, train/serve parity, and entity-keyed
            retrieval. You can have pristine Kafka topics and still leak labels or diverge online
            SQL from training notebooks.

            **How to catch yourself:** ask for the function or config that both training and serving
            import for one feature. If the answer is "the ETL job" and "the API query," you have two
            definitions.

      - type: common_mistake
        markdown: |
          **Training on warehouse "current state" tables** for historical labels. Instant leakage.

          **Duplicating SQL in the notebook and the service.** Calendar-driven skew.

          **Equating freshness with correctness.** A fast wrong feature still hurts.

      - type: exercise_set
        payload:
          checkedByPlatform: false
          markdown: |
            1. Define `orders_7d` with an `as_of` argument and write one leaking join that ignores it.
            2. Draw boxes: Kafka topic, cleaner job, feature table, training join, online cache.
               Label which box owns the feature *definition*.
            3. List three signals that you have outgrown a shared library and need stronger feature
               platform practices.
            4. For a recommendation model, pick three features and state required freshness.
            5. Explain how an MLflow-tracked run should record feature view / transform versions.

      - type: quiz_set
        payload:
          selfCheck: true
          items:
            - question: "What does a pipeline guarantee that a feature contract still must add?"
              answer: >-
                Pipelines move and clean data; feature contracts add shared definitions,
                point-in-time training access, and train/serve parity.
            - question: "What is point-in-time correctness?"
              answer: >-
                Features for a label at time T use only information available at or before T — no
                future leakage.
            - question: "When might a shared library suffice?"
              answer: >-
                Few models, one team, strong review — until many consumers or repeated PIT bugs
                demand heavier platformisation.
            - question: "How does streaming relate to features?"
              answer: >-
                Streams can update online values quickly; they do not replace a single feature
                definition or PIT training joins.

      - type: mastery_criteria
        payload:
          markdown: |
            You have this when you can:

            - Draw pipeline vs feature-definition responsibilities on one diagram.
            - Spot a leaking join in a training query.
            - Decide library vs feature platform with explicit criteria.
    resources:
      - source: mlflow-docs
        purpose: DEEPER_REFERENCE
        relevance: 0.7
        excerpt: "Tracking runs and artefacts so feature/transform versions attach to trained models."
      - source: kafka-intro
