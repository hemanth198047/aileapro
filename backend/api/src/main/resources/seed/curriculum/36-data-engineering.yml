  - slug: reproducible-training-data
    title: Reproducible Training Data
    kind: knowledge_unit
    parent: data-for-ml
    status: published
    version: 1.0.0
    difficulty: 3
    estimateMinutes: 34
    volatility: MEDIUM
    knowledgeClass: STABLE
    lastReviewedAt: 2026-09-20
    lastVerifiedAt: 2026-09-20
    tags: [reproducibility, datasets, lineage, datasheets]
    objectives:
      - Snapshot or version the exact rows and transforms used for a training run.
      - Record dataset motivation, composition, and limitations alongside metrics.
      - Reconstruct a past training set well enough to debug a regression.
      - Refuse "train on whatever is in prod today" as a process.
    description: >-
      Training data as a versioned artefact: snapshots, hashes, lineage, and datasheets — so a
      model metric refers to a real, recoverable dataset.
    blocks:
      - type: why
        markdown: |
          "We got 0.91 last month" is meaningless if nobody can rebuild last month's training table.
          Without snapshots and docs, every retrain is a new experiment wearing old clothes, and
          every incident review devolves into folklore.

          Reproducibility is how offline metrics stay scientific.

      - type: eli5
        markdown: |
          A science fair volcano. Judges ask how you made it. "Stuff from the kitchen" is not an
          answer. A recipe with amounts, date, and photo of the ingredients is.

          Training data needs that recipe: what rows, from where, filtered how, on which date.

      - type: beginner
        markdown: |
          Minimum bar for a training run:

          1. **Data version** — snapshot id, query + as-of timestamp, or dataset hash.
          2. **Code version** — transform/feature commit hash.
          3. **Label definition** — documented and versioned.
          4. **Split method** — random seed, time-based cut, group keys.
          5. **Run record** — links the above to metrics and model artefact (experiment tracking).

          Practical patterns:

          - Materialise `s3://…/datasets/fraud_v2026-09-01/` with a manifest (`row_count`,
            `checksum`, `query.sql`, `label_version`).
          - Or store a deterministic query plus warehouse time-travel stamp.
          - Log all of it on the training run.

          **Datasheets for datasets** argue that every dataset should document motivation,
          composition, collection, and recommended uses — so consumers know when *not* to use it.
          A metric without that context overclaims.

      - type: intermediate
        markdown: |
          **Mutable tables are not versions.** `SELECT * FROM users` today is not what you trained
          on. Prefer immutable snapshots or time-travel reads pinned in the run.

          **Splits leak across time.** Random splits on time-correlated rows inflate metrics.
          Document and enforce time-based or entity-grouped splits where needed.

          **PII and retention.** Snapshots inherit compliance duties. Retention policies and access
          controls are part of reproducibility engineering, not afterthoughts.

          **When data changes under you.** Schema drifts, category vocabularies, and delayed labels
          all shift the distribution. Pin versions; monitor skew between training snapshot and live
          feature distributions.

          **Tracking tools.** MLflow-style run logging is useful when every run records
          `data_version`, `git_commit`, parameters, and metrics. Empty "accuracy=0.9" runs without
          those fields are souvenirs, not science.

          ```yaml
          # manifest.yml next to a snapshot
          name: fraud_train
          as_of: 2026-09-01T00:00:00Z
          row_count: 1250004
          checksum_sha256: "…"
          label_version: churn_v3
          split: {type: time, train_end: 2026-08-01, valid_end: 2026-08-15}
          datasheet: docs/fraud_train_datasheet.md
          ```

      - type: example
        markdown: |
          Incident: production precision dropped after a "routine retrain."

          Without reproducibility: engineers retrain again on "current warehouse," metrics move
          randomly, blame oscillates between model and "bad data."

          With reproducibility:

          ```
          1. Open run R_8841 → data_version=fraud_v2026-08-01, commit=a1b2c3
          2. Rebuild snapshot from manifest; checksum matches
          3. Diff vs new fraud_v2026-09-01 → new bot traffic segment, label delay changed
          4. Datasheet notes label_v3 assumes 7-day observation window; ops shortened to 2 days
          5. Fix label job; pin window in definition; add monitor
          ```

          The datasheet made the observation-window assumption discoverable instead of tribal.

      - type: misconception
        payload:
          code: data.snapshot_optional
          claim: "As long as we track model metrics in a dashboard, snapshots are optional."
          markdown: |
            **The claim:** metrics and model files are enough; data can always be regenerated from
            live systems.

            **Why it feels right:** storage costs money; warehouses feel permanent; tracking UIs
            emphasise charts.

            **What actually happens:** live systems mutate, jobs change, and "regenerate" produces
            a different dataset. Metrics then compare unequal experiments. Dashboards without data
            versions create false confidence.

            **How to catch yourself:** try to recreate last quarter's training table from docs alone
            in one hour. If you cannot, snapshots were not optional.

      - type: common_mistake
        markdown: |
          **Checksumming only the model file.** The dataset is half the story.

          **Datasheet as empty template.** Unfilled fields help nobody; write the failure modes you
          already know.

          **One eternal `train.csv` overwritten nightly.** You destroyed history.

      - type: exercise_set
        payload:
          checkedByPlatform: false
          markdown: |
            1. Write a manifest for a dataset you know; list fields a stranger needs to rebuild it.
            2. Draft five datasheet questions for a click-prediction dataset (motivation, sampling,
               harms).
            3. Design a time-based split policy and one test that fails if someone uses a random
               split.
            4. List what an MLflow run must log for a training job to be auditable.
            5. Plan retention: how long to keep snapshots vs aggregates for your compliance story.

      - type: quiz_set
        payload:
          selfCheck: true
          items:
            - question: "What belongs in a training-data manifest?"
              answer: >-
                Identity of rows (snapshot/query/as-of), checksums, label and split versions, and
                pointers to docs/datasheet.
            - question: "Why are mutable warehouse tables insufficient?"
              answer: >-
                Their contents change; a past metric cannot be tied to a recoverable input set.
            - question: "What do datasheets add beyond checksums?"
              answer: >-
                Motivation, composition, collection process, and recommended uses/limitations for
                human judgement.
            - question: "What must an experiment run record for auditability?"
              answer: >-
                Data version, transform/code version, parameters, metrics, and model artefact links.

      - type: mastery_criteria
        payload:
          markdown: |
            You have this when you can:

            - Produce a manifest that lets a teammate rebuild a training set.
            - Attach a useful datasheet, not a blank form.
            - Reject unreproducible "train on prod today" processes in review.
    resources:
      - source: mlflow-docs
        purpose: PRIMARY_REFERENCE
        relevance: 0.85
        excerpt: "Run and artefact tracking patterns for pinning data and code versions to metrics."
      - source: datasheets-2018
        purpose: PRIMARY_REFERENCE
        relevance: 0.9
        excerpt: "Dataset documentation standard: motivation, composition, collection, recommended uses."
