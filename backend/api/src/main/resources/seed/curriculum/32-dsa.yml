  - slug: hashing-and-lookup
    title: Hashing and Lookup
    kind: knowledge_unit
    parent: algorithms-for-ml
    status: published
    version: 1.0.0
    difficulty: 2
    estimateMinutes: 35
    volatility: LOW
    knowledgeClass: STABLE
    lastReviewedAt: 2026-09-20
    lastVerifiedAt: 2026-09-20
    tags: [algorithms, hashing, data-structures, dictionaries]
    objectives:
      - Explain average-case $O(1)$ dictionary lookup and what "average" hides.
      - Choose a hash map when you need exact key → value access at serving or join time.
      - Contrast hash lookup with linear scan and with approximate nearest-neighbour search.
      - "Predict failure modes: collisions, skew, and mutable keys."
    description: >-
      Hash tables as the workhorse of feature stores, vocabularies, and joins: why average
      lookup is constant time, and when it is the wrong tool.
    blocks:
      - type: why
        markdown: |
          Token IDs, user features, and string→index maps are hash lookups. If you scan a list
          for every key, your "simple" preprocessor becomes the bottleneck. If you hash when you
          needed similarity search, you get exact misses and silent wrong neighbours.

      - type: eli5
        markdown: |
          A phone book sorted by name lets you jump near the right page. A hash table is more
          like a coat-check: you hand over a ticket (the key) and get the coat (the value)
          without walking the whole rack — as long as the tickets are well distributed across
          hooks.

      - type: beginner
        markdown: |
          A **hash function** maps a key to a bucket index. The table stores key–value pairs in
          buckets. Average lookup, insert, and delete are $O(1)$ when keys spread evenly and
          buckets stay small.

          **ML-shaped uses:**

          - vocabulary: `string → token id`
          - feature join: `user_id → dense feature vector`
          - dedupe / seen-set: membership tests
          - counting: `key → count` (with care for cardinality)

          **Versus a list scan.** Finding a key in an unsorted list is $O(n)$ per query. At
          $n = 10^6$ keys and $q = 10^6$ queries, scans are catastrophic; a hash map is routine.

          **Versus ANN / embedding search.** Hash maps answer *exact* key equality. They do not
          answer "nearest embedding." Mixing the two up is a common design bug.

      - type: intermediate
        markdown: |
          **Collisions.** Distinct keys can land in the same bucket. Chains or open addressing
          handle them; cost stays average $O(1)$ if load factor is controlled. Pathological
          collision patterns (or a bad hash) push you toward $O(n)$ behaviour.

          **Skew.** One hot key updated by every worker, or one bucket receiving most traffic,
          creates hotspots even when Big-O looks fine on paper. Sharding and local aggregation
          are the usual escapes.

          **What makes a good key.** Prefer immutable, equality-stable identifiers. Using a
          mutable object as a key (or a float with noisy equality) produces lookups that miss
          for reasons that look like data bugs.

          **Memory.** Hash maps trade RAM for speed. A giant string→vector map may need
          external KV storage; the *algorithm* is still hashing, the *system* is a store.

      - type: example
        markdown: |
          Serving needs `user_id → last_30d_counts` for $10$ million users, $q$ requests/sec
          each needing one lookup.

          - **List of pairs:** $O(n)$ per request — dead on arrival.
          - **Sorted array + binary search:** $O(\log n)$ — workable but clunkier to update.
          - **Hash map / KV:** $O(1)$ average — the default.

          Same team later wants "users like this embedding." That is not a hash get — it is
          similarity search. They keep the hash map for exact attributes and add an index for
          vectors. Two structures, two questions.

      - type: misconception
        payload:
          code: dsa.hash_is_similarity
          claim: "A hash map finds similar items the way embeddings do."
          markdown: |
            **The claim:** hashing somehow groups "close" keys, so it replaces nearest-neighbour
            search.

            **Why it feels right:** the word "hash" appears in locality-sensitive hashing (LSH)
            papers, and dictionaries feel like magic addressers.

            **What ordinary hash maps do:** scatter keys to appear random. Nearby embeddings or
            similar strings are *not* near in the table. Exact `get(key)` is the contract.

            **How to catch yourself:** ask whether equality of an ID is enough, or whether you
            need distance in a vector space. Only the second needs ANN/LSH/specialised indexes.

      - type: common_mistake
        markdown: |
          **Scanning a Python list for membership** inside a per-row loop.

          **Using floats or mutable structures as dict keys** and debugging "missing" entries.

          **Building an $n \times n$ similarity matrix** when you only needed exact ID joins.

      - type: exercise_set
        payload:
          checkedByPlatform: false
          markdown: |
            1. Contrast $O(1)$ average dict get with $O(n)$ list scan for $q$ queries.
            2. Give two ML pipeline places that should be hash maps.
            3. Why is embedding nearest neighbour not a normal dict lookup?
            4. What goes wrong under extreme key skew?
            5. Describe a collision in one sentence without formula theatre.

      - type: quiz_set
        payload:
          selfCheck: true
          items:
            - question: "Average-case cost of a well-behaved hash map get?"
              answer: "$O(1)$."
            - question: "When is a hash map the wrong tool versus ANN?"
              answer: >-
                When you need nearest neighbours in embedding space rather than exact key
                equality.
            - question: "What does a collision mean?"
              answer: "Two different keys map to the same bucket."
            - question: "Name one failure mode besides collisions."
              answer: >-
                Key skew/hot keys, bad mutable keys, or memory blow-ups from huge in-process
                maps.

      - type: mastery_criteria
        payload:
          markdown: |
            You have this when you can:

            - Pick hash lookup vs scan vs similarity search for a stated access pattern.
            - Explain average $O(1)$ and one way it degrades.
            - Design a vocab or feature-join path that does not scan per row.
    resources:
      - source: clrs-algorithms
        purpose: BACKGROUND
        relevance: 0.6
        excerpt: >-
          Hash tables and average-case lookup — conceptual framing only; no book prose copied.
