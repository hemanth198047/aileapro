      - source: esl-book
        purpose: PRIMARY_REFERENCE
        relevance: 0.9
        excerpt: "Chapter 7 develops the bias-variance decomposition; Chapter 3 covers ridge and lasso."
      - source: sklearn-linear-model
        purpose: TOOL_REFERENCE
        relevance: 0.7
        excerpt: "The Ridge and Lasso sections show the penalties above and the scaling requirement."
      - source: dropout-2012
        purpose: DEEPER_REFERENCE
