  - slug: claim-method-evidence
    title: Claim, Method, Evidence
    kind: knowledge_unit
    parent: reading-ai-papers
    status: published
    version: 1.0.0
    difficulty: 3
    estimateMinutes: 40
    volatility: LOW
    knowledgeClass: STABLE
    lastReviewedAt: 2026-09-20
    lastVerifiedAt: 2026-09-20
    tags: [research, literacy]
    objectives:
      - "Write a four-line paper brief: claim, method, evidence, limits."
      - Spot missing baselines, data leakage, and overclaim.
      - Choose a smallest experiment that would falsify the headline claim.
    description: >-
      A repeatable reading method so papers become decisions, not vibes.
    blocks:
      - type: why
        markdown: |
          Papers are marketing plus evidence. Without a reading method you either reject everything
          or adopt hype. Engineers need a brief that drives whether to try, wait, or ignore.

      - type: eli5
        markdown: |
          For a magic trick write: what they claim, how they say it works, what proof they showed,
          and what they did not test. Then try the easiest version at home.

      - type: beginner
        markdown: |
          **Four lines:**

          1. **Claim** — what improves, for whom.
          2. **Method** — the idea in one paragraph.
          3. **Evidence** — datasets, metrics, baselines, ablations.
          4. **Limits** — what they admit; what they omit.

          Then ask: **what smallest run** would make me distrust the claim?

      - type: intermediate
        markdown: |
          Check train/test contamination, hyperparameter tuning on the test set, and whether the
          baseline is strong. Prefer papers with code and seeds — still verify.

      - type: misconception
        payload:
          code: research.benchmark_equals_truth
          claim: "State-of-the-art on a leaderboard means it will work in my product."
          markdown: |
            **The claim:** SOTA transfers.

            **What happens:** distribution shift, cost, and latency kill the win.

      - type: exercise_set
        payload:
          checkedByPlatform: false
          markdown: |
            1. Write a four-line brief for Attention Is All You Need (from memory or skim).
            2. Invent a one-evening falsification check for a RAG paper’s headline.
            3. List two ways a baseline can be unfairly weak.

      - type: quiz_set
        payload:
          selfCheck: true
          items:
            - question: "What are the four lines of a paper brief?"
              answer: "Claim, method, evidence, limits."
            - question: "What should you plan after the brief?"
              answer: "A smallest experiment that could falsify the claim."

      - type: mastery_criteria
        payload:
          markdown: |
            You have this when you can brief a paper and name a falsifying check in under a page.
    resources:
      - source: attention-2017
        purpose: EXAMPLE
        relevance: 0.7
        excerpt: Classic architecture paper — good practice target for the four-line brief.

