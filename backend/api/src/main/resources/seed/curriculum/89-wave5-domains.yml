    tags: [mathematics, orientation]
    objectives:
      - Name the five math domains this map expects before deep ML.
      - Explain why the math is taught for use, not for exam theatre.
    description: >-
      A map key: which maths you need, in what order, and what “enough” looks like for practice.
    blocks:
      - type: why
        markdown: |
          The map lists peer domains — linear algebra, calculus, probability, statistics,
          optimisation — rather than nesting them under this umbrella. This chapter is the
          orientation so the umbrella is not an empty room.

  - slug: which-math-when
    title: Which Math When
    kind: knowledge_unit
    parent: math-for-ai-orientation
    status: published
    version: 1.0.0
    difficulty: 1
    estimateMinutes: 25
    volatility: LOW
    knowledgeClass: FOUNDATIONAL
    lastReviewedAt: 2026-09-20
    lastVerifiedAt: 2026-09-20
    tags: [mathematics, path]
    objectives:
      - Order linear algebra → calculus intuition → probability/statistics → optimisation for ML.
      - Say what each domain unlocks in model reading and implementation.
      - Avoid treating unused theorem lists as mastery.
    description: >-
      A practical order and purpose for the mathematics domains on this map.
    blocks:
      - type: why
        markdown: |
          Learners stall when they either skip maths entirely or try to finish a pure-math syllabus
          before writing a single training loop. You need enough notation and intuition to read a
          paper and debug a shape error — not a second undergraduate degree first.

      - type: eli5
        markdown: |
          Before building with LEGO motors you learn: shapes that fit (linear algebra), how fast
          things change (calculus), what “usually” means (probability), how to check a recipe
          worked (statistics), and how to turn knobs to improve a score (optimisation).

      - type: beginner
        markdown: |
          | Domain | You use it to… |
          |--------|----------------|
          | Linear algebra | Read weights, embeddings, attention as maps on vectors |
          | Calculus | Understand gradients and why updates move loss |
          | Probability | Talk about uncertainty, likelihood, sampling |
          | Statistics | Evaluate estimates, confidence, experimental noise |
          | Optimisation | Choose and debug training algorithms |

          Study them as **tools for ML**, then return when a concrete bug demands more depth.

      - type: intermediate
        markdown: |
          **Depth on demand.** Master matrix shapes and chain rule intuition early. Defer measure
          theory, exotic proofs, and niche estimators until a paper or bug forces them.

          **Signal of enough.** You can predict output shapes, explain a gradient step, and
          interpret a simple A/B or eval confidence interval without hand-waving.

      - type: misconception
        payload:
          code: math.all_or_nothing
          claim: "Either finish all of undergrad maths or skip maths forever."
          markdown: |
            **The claim:** binary choice.

            **What happens:** both extremes fail — opaque papers, or fragile intuition.

            **How to catch yourself:** ask which concrete ML task is blocked, then study that slice.

      - type: exercise_set
        payload:
          checkedByPlatform: false
          markdown: |
            1. List the five math domains this map points to.
            2. Which domain unlocks reading attention as matrix products?
            3. When would you deepen statistics before more calculus?
            4. What is a practical “enough” signal for linear algebra here?

      - type: quiz_set
        payload:
          selfCheck: true
          items:
            - question: "Name three math domains on this map."
              answer: "Any of: linear algebra, calculus, probability, statistics, optimisation."
            - question: "What is maths-for-use?"
              answer: "Learning the pieces that unlock reading and debugging models, not exam completeness."

      - type: mastery_criteria
        payload:
          markdown: |
            You have this when you can route yourself to the right math domain for a blocked ML task.
    resources:
      - source: numpy-absolute-basics
        purpose: TOOL_REFERENCE
        relevance: 0.6
        excerpt: Practical numerical arrays — where linear algebra meets code.

