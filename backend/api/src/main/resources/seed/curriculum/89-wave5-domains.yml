  - slug: seams-and-provider-abstraction
    title: Seams and Provider Abstraction
    kind: knowledge_unit
    parent: production-ai-architecture
    status: published
    version: 1.0.0
    difficulty: 3
    estimateMinutes: 35
    volatility: MEDIUM
    knowledgeClass: CURRENT
    lastReviewedAt: 2026-09-20
    lastVerifiedAt: 2026-09-20
    tags: [architecture, providers, seams]
    objectives:
      - Draw a boundary around the model client with typed inputs/outputs.
      - Keep retrieval indexes and prompts versioned outside vendor SDKs.
      - Explain why hiding the provider behind a seam reduces rewrite risk.
    description: >-
      How to keep an AI feature evolvable when models and vendors change underneath.
    blocks:
      - type: why
        markdown: |
          Provider SDKs change. Models deprecate. If prompts, retrieval, and business logic are
          glued to one vendor client, every upgrade is a rewrite. Seams make the model a
          replaceable worker.

      - type: eli5
        markdown: |
          Use a power strip and a standard plug. When you buy a new lamp, you do not rewire the
          house — you unplug and plug in.

      - type: beginner
        markdown: |
          **Minimum seams:**

          1. **Model client** — send messages / embeddings; receive text or vectors.
          2. **Retrieval** — your index, chunking, and filters.
          3. **Orchestration** — workflow, tools, retries, fallbacks.
          4. **Product state** — user/session data in your database.

          Keep prompts and eval suites in **your** repo, versioned with the feature.

      - type: intermediate
        markdown: |
          Abstract **capabilities** (chat, embed, rerank) not one mega-SDK wrapper. Record model
          id, prompt version, and retrieval corpus version on every answer for debugging.

      - type: misconception
        payload:
          code: arch.sdk_is_architecture
          claim: "Calling the vendor SDK from the controller is the architecture."
          markdown: |
            **The claim:** SDK in the request path = done.

            **What happens:** product logic and vendor details fuse; swaps become archaeology.

      - type: exercise_set
        payload:
          checkedByPlatform: false
          markdown: |
            1. List four seams for a RAG chatbot.
            2. What metadata would you log per answer?
            3. Why version prompts with the feature?

      - type: quiz_set
        payload:
          selfCheck: true
          items:
            - question: "What should a model client seam hide?"
              answer: "Vendor-specific request/response details behind a stable capability API."
            - question: "Where should prompt text live?"
              answer: "In your versioned codebase (or config), not only in a vendor playground."

      - type: mastery_criteria
        payload:
          markdown: |
            You have this when you can sketch replaceable seams for model, retrieval, and orchestration.
    resources:
      - source: openai-evals
        purpose: TOOL_REFERENCE
        relevance: 0.55
        excerpt: Versioned eval cases pair with versioned prompts behind architecture seams.

