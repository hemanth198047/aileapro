  - slug: ml-problem-settings
    title: ML Problem Settings
    kind: knowledge_unit
    parent: ml-map-orientation
    status: published
    version: 1.0.0
    difficulty: 2
    estimateMinutes: 30
    volatility: LOW
    knowledgeClass: FOUNDATIONAL
    lastReviewedAt: 2026-09-20
    lastVerifiedAt: 2026-09-20
    tags: [machine-learning, supervised, unsupervised, rl]
    objectives:
      - Classify a product idea as supervised, unsupervised, or RL-shaped.
      - Explain why evaluation design belongs beside model choice.
      - Avoid forcing every problem into classification.
    description: >-
      The three common learning settings and how they steer what you study next on this map.
    blocks:
      - type: why
        markdown: |
          Teams pick algorithms before naming the learning setting. The setting decides what data
          you need, what “correct” means, and which chapters on this map matter first.

      - type: eli5
        markdown: |
          Supervised: flashcards with answers on the back. Unsupervised: sort a messy drawer with
          no labels. RL: learn by points and penalties while acting in a game.

      - type: beginner
        markdown: |
          **Supervised** — inputs with labels; predict labels for new inputs.

          **Unsupervised** — structure without labels (clusters, compression, density).

          **Reinforcement** — actions over time; reward signal, not a fixed labelled table.

          **Evaluation** is not optional decoration: it defines whether the setting was solved.

      - type: intermediate
        markdown: |
          Many products are **hybrids** (supervised ranker + unsupervised embeddings + a thin
          bandit). Name the dominant setting for the risky decision, then add supporting pieces.

      - type: misconception
        payload:
          code: ml.everything_is_classification
          claim: "If it is ML, it is classification."
          markdown: |
            **The claim:** pick a classifier.

            **What happens:** ranking, generation, control, and clustering get forced into the wrong mould.

      - type: exercise_set
        payload:
          checkedByPlatform: false
          markdown: |
            1. Classify: spam filter, customer segmentation, game-playing agent.
            2. Why does evaluation sit beside model choice?
            3. Give one hybrid product example.

      - type: quiz_set
        payload:
          selfCheck: true
          items:
            - question: "What does supervised learning need that unsupervised does not?"
              answer: "Labels (or other supervised targets) paired with inputs."
            - question: "What does RL optimise for?"
              answer: "Cumulative reward from actions over time, not a fixed labelled table."

      - type: mastery_criteria
        payload:
          markdown: |
            You have this when you can name the learning setting before picking an algorithm chapter.
    resources:
      - source: model-cards-2018
        purpose: BACKGROUND
        relevance: 0.4
        excerpt: Intended-use thinking pairs with choosing a learning setting honestly.

