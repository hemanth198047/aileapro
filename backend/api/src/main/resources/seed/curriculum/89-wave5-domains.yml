  - slug: token-gpu-and-margin
    title: Tokens, GPUs, and Margin
    kind: knowledge_unit
    parent: cost-of-intelligence
    status: published
    version: 1.0.0
    difficulty: 3
    estimateMinutes: 35
    volatility: MEDIUM
    knowledgeClass: CURRENT
    lastReviewedAt: 2026-09-20
    lastVerifiedAt: 2026-09-20
    tags: [economics, tokens, gpu, caching]
    objectives:
      - Estimate request cost from tokens and price tables (order of magnitude).
      - Explain caching, batching, and smaller models as cost levers.
      - Separate gross model spend from product margin after review and infra.
    description: >-
      How to think about money when every answer burns tokens or accelerator time.
    blocks:
      - type: why
        markdown: |
          A demo that costs $0.02 per clever answer can cost $20,000/day at product volume.
          Economics is architecture: caching, routing to smaller models, and knowing when not to
          call a model at all.

      - type: eli5
        markdown: |
          Each AI answer is like a taxi ride billed by distance (tokens) and car type (model size).
          Sharing a ride (batching) or remembering the route (caching) saves money.

      - type: beginner
        markdown: |
          **Billable units:** input tokens, output tokens, sometimes embedding tokens, sometimes
          GPU-seconds if you self-host.

          **Levers:** shorter prompts, retrieval instead of huge context, cache repeated prefixes,
          distill/ cascade to smaller models, batch offline jobs.

          **Margin:** revenue or saved labour minus model + infra + human review + support.

      - type: intermediate
        markdown: |
          Track **cost per successful task**, not cost per raw completion. Failed retries and
          long-winded refusals are real spend. Put budgets and kill switches beside quality gates.

      - type: misconception
        payload:
          code: econ.tokens_only
          claim: "If token price drops, the feature is profitable."
          markdown: |
            **The claim:** cheaper tokens ⇒ margin.

            **What happens:** review labour, support, and infra can dominate; volume amplifies waste.

      - type: exercise_set
        payload:
          checkedByPlatform: false
          markdown: |
            1. Estimate cost for 1M requests at 2k tokens in + 500 out at $X/MTok (pick any table).
            2. Name three cost levers besides “use a cheaper model”.
            3. Why measure cost per successful task?

      - type: quiz_set
        payload:
          selfCheck: true
          items:
            - question: "Name two billable units for LLM APIs."
              answer: "Input tokens and output tokens (embeddings may also bill)."
            - question: "Give one non-model cost that eats margin."
              answer: "Human review, support, infra, or failed retries."

      - type: mastery_criteria
        payload:
          markdown: |
            You have this when you can estimate order-of-magnitude cost and name levers beyond model choice.
    resources:
      - source: iso-42001
        purpose: BACKGROUND
        relevance: 0.3
        excerpt: Governance contexts often require cost and risk controls together.

