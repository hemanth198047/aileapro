  - slug: production-vs-demo
    title: Production vs Demo
    kind: knowledge_unit
    parent: ai-in-the-wild
    status: published
    version: 1.0.0
    difficulty: 2
    estimateMinutes: 35
    volatility: MEDIUM
    knowledgeClass: CURRENT
    lastReviewedAt: 2026-09-20
    lastVerifiedAt: 2026-09-20
    tags: [applications, production]
    objectives:
      - List questions that distinguish a demo from a production system.
      - Give examples of tasks AI often helps vs tasks it often fails.
      - Explain why “human in the loop” is a design choice, not a confession.
    description: >-
      A checklist for reading industry claims without swallowing the press release.
    blocks:
      - type: why
        markdown: |
          Every domain has a flashy demo. Production means reliability, cost, integration, and a
          clear job that got better. This unit trains the questions that separate the two.

      - type: eli5
        markdown: |
          A magic show is a demo. A dishwasher that runs every night is production. Ask whether the
          trick still works when guests spill juice and the power flickers.

      - type: beginner
        markdown: |
          **Ask:** What metric moved? Who owns failures? What is the fallback? What data is needed
          weekly? What is the cost per successful task?

          **Often helps:** drafting, ranking, transcription, retrieval over large corpora, coding
          assistance with review.

          **Often fails alone:** high-stakes decisions without oversight, novel physical manipulation,
          tasks needing guaranteed correctness.

      - type: intermediate
        markdown: |
          Prefer case studies that admit failure modes. “Human in the loop” can be the product
          (escalation) rather than a temporary shame.

      - type: misconception
        payload:
          code: apps.demo_equals_deployed
          claim: "If it is on a launch stage, it is in production."
          markdown: |
            **The claim:** stage demo = shipped.

            **What happens:** you copy an architecture that never survived real traffic or liability.

      - type: exercise_set
        payload:
          checkedByPlatform: false
          markdown: |
            1. Write five questions you would ask a vendor claiming “AI for invoices”.
            2. Name two task types that usually need human review.
            3. When is human-in-the-loop a feature?

      - type: quiz_set
        payload:
          selfCheck: true
          items:
            - question: "Name two production questions beyond model accuracy."
              answer: "Ownership of failures, fallback, cost per success, data refresh, or liability."
            - question: "Why can demos mislead?"
              answer: "They hide cost, reliability, integration, and failure ownership."

      - type: mastery_criteria
        payload:
          markdown: |
            You have this when you can interrogate an industry claim with production questions.
