  - slug: unsettled-vs-settled
    title: Unsettled vs Settled
    kind: knowledge_unit
    parent: living-with-uncertainty
    status: published
    version: 1.0.0
    difficulty: 3
    estimateMinutes: 30
    volatility: HIGH
    knowledgeClass: EXPERIMENTAL
    lastReviewedAt: 2026-09-20
    lastVerifiedAt: 2026-09-20
    tags: [frontier, epistemology]
    objectives:
      - Tag a claim as settled practice, promising research, or rumour.
      - Require eval evidence before promoting frontier tricks into production paths.
      - Explain why HIGH volatility units need review dates.
    description: >-
      A discipline for frontier topics: explicit uncertainty, dated claims, no costume of certainty.
    blocks:
      - type: why
        markdown: |
          Frontier work moves weekly. Teaching yesterday’s rumour as eternal truth creates brittle
          engineers. This domain exists to practise uncertainty labels — not to freeze a hype cycle.

      - type: eli5
        markdown: |
          Some playground rules are fixed (settled). Some new tricks might work (promising). Some
          are stories kids tell (rumour). Label them before you build a clubhouse on them.

      - type: beginner
        markdown: |
          **Settled** — reproduced widely; appears in production runbooks.

          **Promising** — strong paper/demo; limited independent replication.

          **Rumour** — screenshots, anonymous posts, no method.

          Promote content along that ladder only with dates and sources.

      - type: intermediate
        markdown: |
          Product paths should prefer settled techniques. Research sandboxes can track promising
          ideas behind feature flags. Never let rumour skip the queue.

      - type: misconception
        payload:
          code: frontier.newest_is_best
          claim: "The newest demo is the best approach for our users."
          markdown: |
            **The claim:** recency = quality.

            **What happens:** you inherit instability, unknown failure modes, and support cost.

      - type: exercise_set
        payload:
          checkedByPlatform: false
          markdown: |
            1. Tag three headlines you have seen this month as settled / promising / rumour.
            2. What evidence would promote a promising idea to settled in your team?
            3. Why do HIGH volatility units show review dates?

      - type: quiz_set
        payload:
          selfCheck: true
          items:
            - question: "Name the three uncertainty labels."
              answer: "Settled, promising, and rumour."
            - question: "Where should rumour sit in a product path?"
              answer: "Nowhere — keep it out of production curriculum until evidenced."

      - type: mastery_criteria
        payload:
          markdown: |
            You have this when you refuse to teach rumour as fact and can date your frontier notes.
    resources:
      - source: nist-ai-rmf
        purpose: BACKGROUND
        relevance: 0.45
        excerpt: Risk framing pairs well with explicit uncertainty about capability claims.

