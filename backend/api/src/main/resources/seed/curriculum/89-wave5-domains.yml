  - slug: moat-and-dependency-risk
    title: Moat and Dependency Risk
    kind: knowledge_unit
    parent: building-on-models
    status: published
    version: 1.0.0
    difficulty: 3
    estimateMinutes: 35
    volatility: MEDIUM
    knowledgeClass: CURRENT
    lastReviewedAt: 2026-09-20
    lastVerifiedAt: 2026-09-20
    tags: [business, moat, dependency]
    objectives:
      - Distinguish workflow, data, distribution, and brand advantages from raw model access.
      - Plan for price changes, ToS changes, and model deprecations.
      - Explain why “ChatGPT but for X” is usually not a moat.
    description: >-
      What can still be a durable business when anyone can call the same API.
    blocks:
      - type: why
        markdown: |
          If your only product is a thin prompt over a public model, a vendor update or a competitor
          with the same idea erases you. Entrepreneurship here is about owned distribution, data
          loops, and workflows — with eyes open on dependency.

      - type: eli5
        markdown: |
          Anyone can buy the same flour. A bakery wins with recipes, location, and regulars — not
          by claiming unique wheat.

      - type: beginner
        markdown: |
          **Possible advantages:** proprietary data flywheels, deep workflow integration, regulated
          trust, distribution, switching costs in the customer’s process.

          **Dependency risks:** price hikes, rate limits, safety policy changes, model quality
          regressions, region availability.

          **Mitigations:** seams (see architecture), multi-provider options, offline eval gates,
          contractual SLAs where real.

      - type: intermediate
        markdown: |
          Prefer **problem ownership** over model ownership. Measure willingness-to-pay for the
          job done, not for “AI”. Keep a kill-switch narrative: what you ship if the model worsens
          overnight.

      - type: misconception
        payload:
          code: biz.wrapper_moat
          claim: "Access to GPT-class models is our moat."
          markdown: |
            **The claim:** API access = advantage.

            **What happens:** competitors get the same API; your wrapper looks like a feature, not a company.

      - type: exercise_set
        payload:
          checkedByPlatform: false
          markdown: |
            1. List three non-model advantages for a vertical AI tool.
            2. Write two dependency risks and a mitigation for each.
            3. Why is “ChatGPT for X” a weak pitch alone?

      - type: quiz_set
        payload:
          selfCheck: true
          items:
            - question: "Name one real moat candidate for an AI startup."
              answer: "Data flywheel, workflow lock-in, distribution, or regulated trust — not raw API access."
            - question: "Name one vendor dependency risk."
              answer: "Price, ToS, deprecation, quality regression, or availability."

      - type: mastery_criteria
        payload:
          markdown: |
            You have this when you can pitch advantage without pretending the model itself is exclusive.
    resources:
      - source: model-cards-2018
        purpose: BACKGROUND
        relevance: 0.35
        excerpt: Honest intended-use docs support trust — a real sales asset in regulated buys.

