  - slug: how-source-becomes-execution
    title: How Source Becomes Execution
    kind: knowledge_unit
    parent: what-a-program-is
    status: published
    version: 1.0.0
    difficulty: 2
    estimateMinutes: 25
    volatility: LOW
    knowledgeClass: FOUNDATIONAL
    lastReviewedAt: 2026-09-16
    tags: [fundamentals, execution, compilers]
    objectives:
      - Explain the path from source text to instructions a processor executes.
      - Contrast compilation and interpretation without treating them as opposites.
      - Say what a runtime provides and why it matters for AI work.
    description: >-
      Source code is text. Something has to turn it into instructions a processor can run, and
      what that something does explains a large share of real performance behaviour.
    blocks:
      - type: why
        markdown: |
          "Why is my Python loop slow but NumPy fast?" is not a question about Python syntax. It
          is a question about what runs, in what language, on what hardware. You cannot answer it
          without a model of how source becomes execution — and that question appears constantly
          in AI work, where the fast path is almost always someone else's compiled code.

      - type: beginner
        markdown: |
          Source code is a text file. A processor executes **machine instructions** — numbers
          that mean things like "add these two registers". Between the two sits a translator.

          Two broad strategies:

          - **Compilation** translates the whole program ahead of time into machine
            instructions, then you run the result. C and Rust work this way.
          - **Interpretation** reads your program and carries out its meaning as it goes, using
            a program that is itself already compiled. Python works largely this way.

          Neither is "the fast one" in the abstract. Compilation moves work before execution,
          which buys speed at run time and costs flexibility. Interpretation keeps the program
          inspectable and portable, and pays for it per operation.

      - type: intermediate
        markdown: |
          The real picture for Python, the language you will use most here:

          1. Your `.py` text is **parsed** into a syntax tree.
          2. That tree is compiled into **bytecode** — instructions for a virtual machine, not
             for your CPU (this is what `.pyc` files hold).
          3. The **interpreter loop** in CPython reads bytecode and executes each operation by
             running already-compiled C code.

          So Python *is* compiled, just not to machine code. The cost you feel in a hot loop is
          step 3: per operation, the interpreter dispatches, checks types, and allocates objects.

          This is exactly why numerical libraries win. When you call a NumPy operation on a
          million-element array, the interpreter dispatches **once** and then compiled C runs
          over a contiguous block of memory. The same arithmetic written as a Python `for` loop
          dispatches a million times. Same mathematics, two very different amounts of work —
          and the reason is in the execution path, not in the formula.

          A **runtime** is the machinery that exists while your program runs: memory management,
          garbage collection, threading, the standard library. When you later fight a GPU
          out-of-memory error or the Python global interpreter lock, you are arguing with a
          runtime, not with the language's grammar.

      - type: example
        markdown: |
          A concrete look at the bytecode Python actually produces:

          ```python
          import dis

          def add_one(x):
              return x + 1

          dis.dis(add_one)
          ```

          The output lists virtual-machine instructions — load the argument, load the constant
          `1`, perform a binary add, return. That list, not your text, is what gets executed.

          The practical consequence, in the shape you will meet it in week one of any AI course:

          ```python
          # Interpreted per element: a million dispatches.
          total = 0
          for value in values:
              total += value * 2

          # One dispatch into compiled code that loops in C.
          total = (values * 2).sum()   # values is a NumPy array
          ```

      - type: misconception
        payload:
          code: execution.interpreted_means_not_compiled
          claim: "Python is interpreted, so no compilation happens."
          markdown: |
            **The claim:** interpreted and compiled are opposites, and Python sits firmly on the
            interpreted side, so no compilation step exists.

            **Why it feels right:** you run `python script.py` and it just goes. There is no
            visible build step and no binary to ship.

            **What actually happens:** CPython compiles your source to bytecode every time it
            loads a module, caching the result in `__pycache__`. Execution is then an
            interpreter loop over that bytecode. Meanwhile a "compiled" language may still rely
            on a heavy runtime, and a JIT compiles at run time. Compilation and interpretation
            are stages a language implementation can mix, not tribes.

            **How to catch yourself:** ask "compiled *to what*, and *when*?" rather than
            "compiled or interpreted?".

      - type: exercise_set
        payload:
          checkedByPlatform: false
          markdown: |
            1. Run the `dis.dis` example above on a two-line function of your own. Name one
               instruction in the output and say in words what it does.
            2. Delete a `__pycache__` directory in a project, run it once, and look again.
               Explain what appeared and why.
            3. Time a Python loop that sums one million integers against the same sum with
               NumPy. Record both numbers, then state which stage of the execution path
               accounts for the gap.
            4. In one sentence each, say what a compiler, an interpreter, and a runtime do.

            The lab that runs this code inside AILEAPRO arrives in Phase 8; for now use a local
            Python install.

      - type: mastery_criteria
        payload:
          markdown: |
            You have this when you can explain, unprompted, why the same arithmetic is much
            slower in a Python loop than in a NumPy call, in terms of what is executed rather
            than by citing "NumPy is faster".
