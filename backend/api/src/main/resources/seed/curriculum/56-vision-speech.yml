# Wave 4: vision tasks + speech pipeline intuition.
#
# Detection vs classification cites YOLOv3 and LeCun CNN; ASR cites Whisper.
# Concepts and engineering intuition — no paper text dumps.

units:
  - slug: vision-tasks
    title: Vision Tasks
    kind: chapter
    parent: computer-vision
    status: published
    version: 1.0.0
    difficulty: 3
    estimateMinutes: 45
    volatility: MEDIUM
    knowledgeClass: CURRENT
    lastReviewedAt: 2026-09-20
    tags: [computer-vision, detection, classification]
    objectives:
      - Tell classification, detection, and related localisation tasks apart by output shape.
      - Choose a task framing that matches the product decision.
    description: >-
      What the model must output: a label for the whole image, or boxes (and labels) for
      instances inside it.
    blocks:
      - type: why
        markdown: |
          "Do vision" is not a spec. A whole-image label and a set of boxes solve different
          products. Pick the task before you pick the backbone.

  - slug: detection-vs-classification
    title: Detection vs Classification
    kind: knowledge_unit
    parent: vision-tasks
    status: published
    version: 1.0.0
    difficulty: 3
    estimateMinutes: 40
    volatility: MEDIUM
    knowledgeClass: CURRENT
    lastReviewedAt: 2026-09-20
    lastVerifiedAt: 2026-09-20
    tags: [computer-vision, detection, classification, yolo]
    objectives:
      - Contrast image classification outputs with object detection outputs.
      - Explain why detection needs localisation (boxes/masks) as well as labels.
      - Relate CNNs as a shared backbone idea to both task heads.
      - Name when classification is enough and when detection is required.
    description: >-
      Classification names the image; detection finds and labels instances with locations.
      Same family of visual features, different heads and losses.
    blocks:
      - type: why
        markdown: |
          A photo labelled "street" does not tell you where the pedestrians are. If the product
          needs "where" and "how many," classification metrics can look fine while the system
          is useless.

      - type: eli5
        markdown: |
          Classification is sorting whole photos into folders: cat, dog, truck. Detection is
          circling every cat and dog in the photo and labelling each circle. One name for the
          page versus many labelled stickers on the page.

      - type: beginner
        markdown: |
          **Image classification.** Input: image. Output: one label (or a distribution over
          labels) for the *whole* image. Classic CNN document-recognition pipelines showed that
          shared local filters work well for this kind of grid input.

          **Object detection.** Input: image. Output: a set of objects, each with a **location**
          (usually a box) and a **class**. You care about which instances exist and where they
          are.

          | | Classification | Detection |
          |---|----------------|-----------|
          | Output | class scores | boxes + class scores |
          | "Where?" | no | yes |
          | Typical metric | accuracy / top-k | mAP-style localisation+label |

          **Single-shot detectors** (YOLO-style families) predict boxes and classes in one
          forward pass across scales, rather than a slow separate propose-then-classify loop —
          useful intuition even when you use a newer detector in practice.

      - type: intermediate
        markdown: |
          **Shared backbone, different head.** Convolutional features (local filters, hierarchy)
          often feed either a classification head (pool → logits) or a detection head (dense
          predictions over locations/scales). The inductive bias is related; the supervision
          is not.

          **When classification suffices.** Moderation tags, whole-slide "is this defective?",
          document type. No need for instance geometry.

          **When you need detection.** Counting, cropping, tracking, robotics, overlapping
          instances, "highlight the tumour." If the decision is spatial, the label must be
          spatial.

          **Failure mode.** Training a classifier on cropped objects then running it in sliding
          windows is an old pattern; modern detectors learn localisation end-to-end. Do not
          confuse "we used a CNN" with "we solved detection."

      - type: example
        markdown: |
          Product: dashboard camera warning for nearby vehicles.

          - **Classification only:** "is there a vehicle somewhere in this frame?" — misses
            count, distance proxies, and which region to emphasise.
          - **Detection:** boxes for vehicles (and maybe lanes/people) every frame — supports
            "object in path" logic.

          A classifier might hit high accuracy on frames that are mostly road texture while
          still failing the product. Task framing first; backbone second.

      - type: misconception
        payload:
          code: cv.cnn_means_detection
          claim: "If we use a CNN, we are doing object detection."
          markdown: |
            **The claim:** convolutional nets equal detection.

            **Why it feels right:** detection papers are full of CNNs, and vision ≈ CNN in
            popular talk.

            **What is true:** CNNs (and later vision transformers) provide features. Detection
            additionally requires a localisation output and matching losses/metrics. A CNN
            classifier is still just classification.

            **How to catch yourself:** draw the output tensor. Softmax over classes for the
            whole image ≠ list of boxes.

      - type: common_mistake
        markdown: |
          **Reporting classification accuracy for a detection product.**

          **Ignoring small objects / scale** when the decision cares about distant instances.

          **Assuming one label per image** when scenes contain many overlapping objects.

      - type: exercise_set
        payload:
          checkedByPlatform: false
          markdown: |
            1. For each product, pick classification or detection: (a) "is this X-ray normal?",
               (b) "circle every lesion."
            2. Sketch the outputs of each task for one image with two dogs.
            3. Why might mAP matter when accuracy does not?
            4. What does a single-shot detector try to avoid?
            5. Explain the misconception "CNN ⇒ detection" in one sentence.

      - type: quiz_set
        payload:
          selfCheck: true
          items:
            - question: "What does classification output vs detection?"
              answer: >-
                Classification: label(s) for the whole image. Detection: instances with
                locations (boxes) and classes.
            - question: "When is classification enough?"
              answer: "When the decision does not need instance locations or counts."
            - question: "Does using a CNN imply detection?"
              answer: "No — CNNs are features/backbones; detection needs a localisation head."
            - question: "What is the YOLO-style idea at a high level?"
              answer: >-
                Predict boxes and classes in one forward pass (often multi-scale), rather than a
                heavy separate proposal stage.

      - type: mastery_criteria
        payload:
          markdown: |
            You have this when you can:

            - Match a product decision to classification vs detection.
            - Describe outputs and metrics at a high level for both.
            - Separate backbone choice from task head choice.
    resources:
      - source: yolov3-2018
        purpose: PRIMARY_SOURCE
        relevance: 0.85
        excerpt: >-
          Single-shot detection framing with multi-scale predictions — use for task intuition,
          not as a claim that YOLOv3 is today's SOTA.
      - source: lecun-cnn-1998
        purpose: BACKGROUND
