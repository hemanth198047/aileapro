# The seeded paths. Both contain exactly the units that are authored and published, in the order
# they should be studied, and neither promises a curriculum that does not exist yet.
#
# ai-engineer-core is the full authored route after Wave 5.
# ai-engineer-abridged stays at ten published waypoints — pinned by CatalogApiTest.
#
# authoring-queue-draft is the authoring-queue waypoint: dropped for learners until published.

paths:
  - slug: ai-engineer-core
    title: AI Engineer (core)
    roleTarget: AI Engineer
    status: published
    version: 4.0.0
    description: >-
      The full authored route through the seed after Wave 5: programs and Python, DSA and interfaces, linear
      algebra and calculus, probability and statistics, optimisation, SQL and data engineering,
      EDA, classical ML (supervised, unsupervised, ensembles), evaluation, neural nets through
      CNNs and RNNs, RL intuition, generative models, attention and transformers, language models,
      embeddings and RAG quality, fine-tuning and LoRA, multimodal embeddings, vision and speech,
      agents, multi-agent handoffs and tool schemas, then evaluation, security, MLOps/LLMOps,
      inference infra, system-design choices, product/governance judgment, MoE, architecture
      seams, AI economics, entrepreneurship, research literacy, frontier uncertainty labels, and
      production-vs-demo judgment. Authored pages only — map-honesty-reserve stays empty on purpose.
