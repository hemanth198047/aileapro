# The seeded paths. Both contain exactly the units that are authored and published, in the order
# they should be studied, and neither promises a curriculum that does not exist yet.
#
# ai-engineer-core is the full authored route after Wave 3 (~60 published knowledge units).
# ai-engineer-abridged stays at ten published waypoints — pinned by CatalogApiTest.
#
# mixture-of-experts-draft is the authoring-queue waypoint: dropped for learners until published.

paths:
  - slug: ai-engineer-core
    title: AI Engineer (core)
    roleTarget: AI Engineer
    status: published
    version: 2.0.0
    description: >-
      The full authored route through the seed: programs and Python, linear algebra and calculus,
      probability and statistics, optimisation, SQL for features, classical ML and evaluation,
      neural nets through CNNs and RNNs, attention and transformers, language models, embeddings
      and RAG quality, fine-tuning and LoRA, multimodal embeddings, agents and memory, then
      evaluation, security, MLOps/LLMOps, and system-design choices. Authored pages only — empty
      domains on the map still say they are empty.
