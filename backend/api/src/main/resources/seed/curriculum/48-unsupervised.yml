  - slug: pca-for-intuition
    title: PCA for Intuition — Rotating to Explain Variance
    kind: knowledge_unit
    parent: unsupervised-core
    status: published
    version: 1.0.0
    difficulty: 3
    estimateMinutes: 40
    volatility: LOW
    knowledgeClass: STABLE
    lastReviewedAt: 2026-09-20
    tags: [machine-learning, pca, dimensionality-reduction]
    objectives:
      - Describe PCA as finding orthogonal directions of maximum variance after centering.
      - Read a scree plot and say what "explained variance ratio" claims — and does not claim.
      - Use 2D PCA plots as visualisation, not as proof of clusters or causation.
      - Know that PCA is linear and sensitive to scaling; nonlinear structure may need other tools.
    description: >-
      Principal component analysis rotates centered data onto orthogonal axes ordered by captured
      variance. It compresses and visualises; it does not invent class labels.
    blocks:
      - type: why
        markdown: |
          High-dimensional tables are hard to plot and often redundant. PCA is the default first
          cut: a linear change of basis that puts as much variance as possible into the first few
          coordinates. Used well, it is a map. Used badly, a 2D scatter becomes a fictional story
          about clusters and "drivers".

      - type: eli5
        markdown: |
          Imagine a cloud of points shaped like a tilted football. PCA finds the longest direction
          through the cloud (first principal component), then the next-longest direction at right
          angles to the first, and so on.

          If you keep only the first two directions, you are looking at the football's shadow on
          the best flat screen — most of the spread, some detail lost.

      - type: beginner
        markdown: |
          **Center first.** Subtract the mean of each feature so the cloud sits at the origin. PCA
          without centering mixes "where the mean is" into the components.

          **First principal component.** The unit vector $u_1$ that maximises the variance of the
          projected data $Xu_1$. The second, $u_2$, maximises remaining variance subject to being
          orthogonal to $u_1$, and so on. Equivalently: eigenvectors of the covariance matrix,
          ordered by eigenvalue.

          **Scores and loadings.** Projecting $X$ onto the components gives **scores** (new
          coordinates). The vectors $u_j$ are **loadings** (how old features mix into component
          $j$).

          **Explained variance ratio.** Each eigenvalue divided by the sum of eigenvalues — the
          fraction of total variance along that axis. A scree plot shows these fractions; an
          "elbow" is a heuristic for how many components to keep, not a law.

          **Scale.** PCA on raw dollars-and-grams is dominated by the large-magnitude feature.
          Standardise when features are incomparable — unless the magnitude *is* the signal you
          want to preserve.

      - type: intermediate
        markdown: |
          **Reconstruction.** Keeping $r$ components and mapping back approximates $X$ with a rank-
          $r$ matrix (after centering). The discarded variance is the reconstruction error. That
          error being small means linear redundancy — not that the discarded directions are
          semantically unimportant for a downstream task.

          **Not clustering.** A PCA plot may *reveal* blobs if they already separate along high-
          variance directions. PCA did not optimise separation; k-means did not rotate for
          variance. Colouring PCA scores by k-means labels is a visualisation, not a proof that
          either method found truth.

          **Linearity.** PCA is a linear projection. A Swiss-roll manifold can look like a mess in
          the first two PCs; methods like t-SNE/UMAP (with their own pitfalls) or autoencoders
          target different goals. Do not expect PCA to "unfold" nonlinear structure.

          **Interpretation caution.** A loading that is large on feature $j$ means feature $j$
          participates in that high-variance direction. It does not mean $j$ causes the outcome,
          and sign flips of a whole component are arbitrary.

          Mathematics for Machine Learning develops the eigendecomposition view cleanly; scikit-
          learn's decomposition guide matches the API you will actually call.

      - type: example
        markdown: |
          Four correlated sensor channels. After standardising:

          ```python
          from sklearn.decomposition import PCA
          from sklearn.preprocessing import StandardScaler

          X_scaled = StandardScaler().fit_transform(X_train)
          pca = PCA(n_components=2)
          Z = pca.fit_transform(X_scaled)
          print(pca.explained_variance_ratio_)  # e.g. [0.71, 0.18] → ~89% in 2D
          ```

          Fit PCA **on training rows only**, then `transform` validation/test — same leakage rule
          as scalers. If you fit on all data before a split, the components peeked at held-out
          variance.

          **Reading the plot.** Points in $Z$ form a banana shape. That is geometry in the top
          two variance directions. Drawing a marker around a dense region and calling it a
          "discovered segment" confuses visualisation with clustering.

      - type: misconception
        payload:
          code: unsup.pca_finds_clusters
          claim: "PCA finds the clusters in the data."
          markdown: |
            **The claim:** running PCA is how you discover groups; the blobs in the 2D plot are
            the answer.

            **Why it feels right:** tutorials often show PCA scatters with coloured groups, and
            separated blobs look like a result.

            **What actually happens:** PCA maximises captured variance under orthogonality. Groups
            appear in the plot only if they already differ along high-variance linear directions.
            Overlapping classes, or separation along a low-variance direction, will not show.
            Clustering algorithms optimise a different objective.

            **How to catch yourself:** ask what was optimised. If nobody chose $k$ or a cluster
            criterion, you did not "find clusters" — you projected. If you need groups, run a
            clustering method (and still treat IDs as invented).

      - type: common_mistake
        markdown: |
          **Skipping centering or scaling** and then narrating components as if they were on equal
          footing.

          **Keeping two components because plotting is easy**, then discarding a third that carries
          the only direction that matters for a rare failure mode.

          **Fitting PCA on train+test** before evaluation, especially inside a supervised pipeline.

      - type: exercise_set
        payload:
          checkedByPlatform: false
          markdown: |
            1. In one sentence, what does the first principal component maximise?
            2. Why center before PCA? What goes wrong if you do not?
            3. Explained variance ratios are 0.55, 0.25, 0.10, 0.10. How much variance do the first
               two PCs capture together?
            4. Give a case where a beautiful 2D PCA plot hides a class difference.
            5. Correct "PCA finds clusters" in two sentences.

      - type: quiz_set
        payload:
          selfCheck: true
          items:
            - question: "What does PCA optimise?"
              answer: >-
                Orthogonal directions of maximum variance in centered (and often scaled) data —
                equivalently, top eigenvectors of the covariance matrix.
            - question: "What is explained variance ratio?"
              answer: >-
                Each component's variance (eigenvalue) divided by total variance — the fraction of
                spread captured by that axis.
            - question: "Does PCA require labels?"
              answer: "No. It uses only X (after centering/scaling choices you make)."
            - question: "Why is a PCA scatter not proof of clusters?"
              answer: >-
                PCA does not optimise group separation; blobs appear only if groups already differ
                along high-variance linear directions.

      - type: mastery_criteria
        payload:
          markdown: |
            You have this when you can:

            - Explain PCA as variance-maximising orthogonal rotation, not as clustering.
            - Choose whether to scale and defend the choice from units and intent.
            - Read explained-variance numbers without mistaking them for task importance.
            - Fit PCA inside a train-only transform discipline in a supervised pipeline.
