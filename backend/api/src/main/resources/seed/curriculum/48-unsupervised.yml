# Wave 4: unsupervised learning — clustering and PCA intuition.
#
# Parent domain: unsupervised-learning (10-domains.yml). Chapter nests under the domain;
# knowledge units nest under the chapter.

units:
  - slug: unsupervised-core
    title: Unsupervised Learning Core
    kind: chapter
    parent: unsupervised-learning
    status: published
    version: 1.0.0
    difficulty: 3
    estimateMinutes: 90
    volatility: LOW
    knowledgeClass: STABLE
    lastReviewedAt: 2026-09-20
    tags: [machine-learning, unsupervised]
    objectives:
      - State what unsupervised methods optimise when there is no label column.
      - Contrast clustering (group assignment) with PCA (axis finding).
      - Name the failure modes that make a silhouette plot or a 2D scatter look convincing and wrong.
    description: >-
      Structure without labels: k-means and related clustering as partition finding, and PCA as
      the first rotation that explains variance — two tools people confuse, with different jobs.
    blocks:
      - type: why
        markdown: |
          Most of the curriculum so far assumes a label. Unsupervised methods answer a different
          question: given only $X$, what structure is worth writing down? Clustering invents group
          IDs; PCA invents a smaller coordinate system. These two pages are the minimum honest
          versions of both, including how to notice when the plot lied.

  - slug: kmeans-and-clustering
    title: K-Means and What Clustering Actually Optimises
    kind: knowledge_unit
    parent: unsupervised-core
    status: published
    version: 1.0.0
    difficulty: 3
    estimateMinutes: 40
    volatility: LOW
    knowledgeClass: STABLE
    lastReviewedAt: 2026-09-20
    tags: [machine-learning, clustering, k-means]
    objectives:
      - State the k-means objective as within-cluster sum of squared distances to centroids.
      - Run the assign–update loop and say what can go wrong with bad init or wrong $k$.
      - Explain why clustering is not classification and why cluster IDs are arbitrary.
      - Choose a scaling and distance story before trusting a partition.
    description: >-
      K-means partitions points into $k$ groups by alternating assignment to nearest centroids and
      updating those centroids. The result is a partition, not a ground-truth label.
    blocks:
      - type: why
        markdown: |
          When you have customers, documents, or embeddings and no label, the first question is
          often "are there natural groups?". K-means is the algorithm people reach for first
          because it is fast and geometrically clear. It is also the algorithm people misuse first:
          wrong $k$, unscaled features, and treating cluster IDs as if they were supervised classes.

      - type: eli5
        markdown: |
          Drop $k$ pins on a map of towns. Assign every town to its nearest pin. Move each pin to
          the average location of the towns that chose it. Repeat until the pins stop moving.

          You invented $k$ regions. Nobody told you the "true" regions — you chose $k$ and a
          distance, and the pins settled into a local compromise.

      - type: beginner
        markdown: |
          **Input.** A matrix $X \in \mathbb{R}^{n \times d}$ of $n$ points. No $y$.

          **K-means objective.** Choose centroids $\mu_1,\ldots,\mu_k$ and assignments $c_i \in
          \{1,\ldots,k\}$ to minimise within-cluster sum of squares (WCSS):

          $$
          \sum_{i=1}^{n} \|x_i - \mu_{c_i}\|^2
          $$

          **Lloyd's loop** (the usual algorithm):

          1. **Assign.** Each point goes to the nearest centroid (Euclidean distance).
          2. **Update.** Each centroid becomes the mean of its assigned points.
          3. Repeat until assignments stop changing (or a max iteration hits).

          **What the IDs mean.** Cluster labels $\{0,1,2\}$ are arbitrary names. Swapping two IDs
          does not change the partition. There is no "correct" class to score against unless you
          bring external labels later for analysis — and even then, agreement with those labels is
          a separate evaluation, not what k-means optimised.

          **Choosing $k$.** Elbow plots of WCSS, silhouette scores, and domain knowledge are
          heuristics. K-means will always return $k$ non-empty clusters if you ask for $k$; that
          is not evidence that $k$ is "true".

      - type: intermediate
        markdown: |
          **Local minima and init.** The objective is non-convex. Random init can trap you in a
          poor partition. `k-means++` seeds centroids far apart in expectation and is the modern
          default for a reason. Still run several restarts and keep the lowest WCSS.

          **Assumptions baked into Euclidean k-means.** Spherical-ish clusters of similar scale;
          features on comparable units; outliers that do not yank means. Elongated clusters,
          unequal variances, and categorical features break the story. Soft alternatives (GMM) or
          density-based methods (DBSCAN) answer different geometric questions.

          **Scaling.** Because distance is Euclidean, a feature measured in thousands dominates one
          measured in fractions. Standardise (or otherwise scale) when units differ — the same
          lesson as for k-NN, for the same reason.

          **Evaluation without labels.** Silhouette, Davies–Bouldin, and stability under bootstrap
          are diagnostics. With labels available only for audit, adjusted Rand index or mutual
          information measure agreement — they do not prove the clusters are the "right" business
          segments.

          ESL and the scikit-learn clustering guide both stress that choosing the algorithm is
          choosing a geometry. K-means is Voronoi cells around means, nothing more mystical.

      - type: example
        markdown: |
          Two features already standardised: `(spend, visits)`. Ask for $k=3$:

          ```python
          from sklearn.cluster import KMeans
          from sklearn.preprocessing import StandardScaler

          X_scaled = StandardScaler().fit_transform(X)
          km = KMeans(n_clusters=3, init="k-means++", n_init=10, random_state=0)
          labels = km.fit_predict(X_scaled)
          # km.inertia_ is the WCSS; km.cluster_centers_ are the means in scaled space
          ```

          Suppose after fit you colour a scatterplot and see three blobs. That plot is consistent
          with the objective — it is not proof that marketing should create three campaigns. Change
          $k$ to 5 and you will get five colours. The algorithm did not "discover truth"; it
          minimised WCSS for the $k$ you chose.

          **Failure sketch.** Feature `income` in dollars, feature `age` in years, no scaling.
          Centroids chase income; age is nearly ignored. The "clusters" are income bands wearing a
          clustering costume.

      - type: misconception
        payload:
          code: unsup.clustering_needs_labels
          claim: "Clustering is just classification without showing the model the labels."
          markdown: |
            **The claim:** k-means is supervised learning with the answers hidden — same job,
            missing column.

            **Why it feels right:** both assign each row a discrete ID, and tutorials often colour
            clusters like classes.

            **What actually happens:** classification has an external target and a loss against it.
            Clustering invents the IDs to optimise a geometric criterion (here, WCSS). There is no
            held-out accuracy for the IDs themselves. You can later compare clusters to known
            segments, but that is validation of usefulness, not training.

            **How to catch yourself:** ask what quantity decreases each iteration. If the answer is
            "classification error", you are not doing k-means. If it is "sum of squared distances
            to centroids", you are partitioning, not predicting a label.

      - type: common_mistake
        markdown: |
          **Skipping scaling** when features have different units, then interpreting Euclidean
          clusters as meaningful.

          **Treating a pretty $k=4$ plot as settled science** without checking stability under
          restarts, bootstrap, or a nearby $k$.

          **Using cluster ID as a feature in a supervised model without care** — the ID is a
          many-to-one summary of $X$; leaking test-time assignment rules or fitting $k$ on all
          data can inflate metrics the same way other unsupervised preprocessing leaks.

      - type: exercise_set
        payload:
          checkedByPlatform: false
          markdown: |
            1. Write the k-means objective in words and in math for $k=2$ on points in $\mathbb{R}^2$.
            2. Walk one assign step and one update step on four points and two centroids of your choosing.
            3. Why does standardising features change k-means partitions when it does not change
               tree splits?
            4. Give an example where silhouette is high and the clusters are still useless for the
               business question.
            5. Correct the claim "clustering needs labels during training" in two sentences.

      - type: quiz_set
        payload:
          selfCheck: true
          items:
            - question: "What does k-means minimise?"
              answer: >-
                Within-cluster sum of squared Euclidean distances from points to their assigned
                centroids (WCSS / inertia).
            - question: "Why are cluster IDs arbitrary?"
              answer: >-
                They are names for a partition; permuting IDs leaves the same groups. Nothing in
                the objective prefers ID 0 over ID 1.
            - question: "Name two reasons a k-means run can be misleading."
              answer: >-
                Bad init / local minima, wrong k, unscaled features, non-spherical clusters, or
                outliers yanking means — any two with a brief why.
            - question: "Is clustering a form of classification?"
              answer: >-
                No. Classification predicts an external label; clustering invents groups under a
                geometric objective.

      - type: mastery_criteria
        payload:
          markdown: |
            You have this when you can:

            - Derive one full assign–update iteration and state the objective it serves.
            - Refuse a cluster story that skipped scaling or fixed $k$ without a reason.
            - Explain to a non-ML teammate that cluster IDs are invented partitions, not classes.
            - Name when you would leave k-means for a different clustering geometry.
    resources:
      - source: sklearn-clustering
        purpose: TOOL_REFERENCE
