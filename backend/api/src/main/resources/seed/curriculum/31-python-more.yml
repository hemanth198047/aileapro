# Wave 3: control flow and NumPy essentials for ML pipelines.
#
# These sit under the python domain (not under python-essentials) because they are the next
# layer every notebook assumes: deciding what runs, and operating on arrays without Python loops.

units:
  - slug: python-control-flow
    title: Control Flow for Data Pipelines
    kind: knowledge_unit
    parent: python
    status: published
    version: 1.0.0
    difficulty: 2
    estimateMinutes: 32
    volatility: LOW
    knowledgeClass: STABLE
    lastReviewedAt: 2026-09-19
    lastVerifiedAt: 2026-09-19
    tags: [python, control-flow, pipelines]
    objectives:
      - Choose if/else, early return, or a loop for a clear filtering or routing decision.
      - Write a for-loop and a while-loop that terminate for the cases you care about.
      - Explain why control flow in a data pipeline is a correctness question, not decoration.
      - Prefer early returns and guard clauses over deeply nested conditionals.
    description: >-
      If, else, loops, and early return — the decisions that decide which rows get processed,
      which examples get skipped, and whether a pipeline ever finishes.
    blocks:
      - type: why
        markdown: |
          A training script is mostly control flow wrapped around numerical work. Skip corrupt
          rows or you train on garbage. Break out of a loop too late or you burn the night on an
          empty generator. Nest three `if`s and the next person cannot tell which path ran.

          Control flow is how you encode *policy*: what is valid, what is skipped, when to stop.
          Get the policy wrong and the model never sees the failure — the pipeline silently did
          the wrong thing.

      - type: eli5
        markdown: |
          Imagine a conveyor belt of apples. Some are rotten. You need a rule: keep, throw away,
          or stop the belt.

          `if` is the keep-or-throw decision. A loop is "do this for every apple". Early return is
          "this box is empty — leave the room now, do not keep checking shelves".

          Without those rules the belt either jams, or you end up baking a pie with rotten fruit
          and wondering why it tastes wrong.

      - type: beginner
        markdown: |
          **Branching.** An `if` / `elif` / `else` chain picks one path:

          ```python
          def label_score(score: float) -> str:
              if score >= 0.8:
                  return "pass"
              elif score >= 0.5:
                  return "review"
              else:
                  return "fail"
          ```

          Conditions are any expression that is truthy or falsy. Empty containers, `0`, `0.0`,
          `None`, and `False` are falsy; almost everything else is truthy. Prefer explicit checks
          (`if row is None`) when the distinction matters.

          **Early return** exits as soon as the answer is known:

          ```python
          def clean_text(text: str | None) -> str | None:
              if text is None:
                  return None
              text = text.strip()
              if not text:
                  return None
              return text.lower()
          ```

          Flat guard clauses beat nested pyramids. Each return documents a rejection reason.

          **Loops.** `for item in iterable` walks a known collection. `while condition` repeats
          until a stop condition holds — use it when you do not know the length in advance
          (streaming, retry until success, read until EOF).

          ```python
          kept = []
          for row in rows:
              if row.get("label") is None:
                  continue          # skip this row, keep going
              kept.append(row)
          ```

          `continue` skips the rest of the current iteration. `break` leaves the loop entirely.
          Prefer `for` when you can; `while True` with a buried `break` is harder to reason about.

      - type: intermediate
        markdown: |
          **Control flow is the skeleton of a pipeline.** Typical stages:

          1. Guard invalid inputs (early return / raise).
          2. Filter or transform each record (loop + `continue`).
          3. Aggregate or stop early when a budget is hit (`break`).
          4. Branch on schema or modality (`if` / `elif`).

          In ML code the same pattern appears as: drop NaN labels, skip empty documents, stop
          reading after `max_examples`, route image vs text batches to different loaders.

          **Comprehensions** are loops with a return value:

          ```python
          ids = [r["id"] for r in rows if r.get("split") == "train"]
          ```

          Use them when the body is a single expression. When the body needs logging, multiple
          statements, or early exit, keep an explicit loop — readability wins.

          **Else on loops** exists in Python (`for ... else`) and runs only if the loop did *not*
          `break`. It is useful for "search failed" paths, but many readers misread it. Prefer a
          flag or an early return if your teammates do not know the idiom.

          **Infinite loops** almost always mean a missing update to the loop variable or a stop
          condition that can never become true. When reading a `while`, ask: what changes each
          iteration, and can that change make the condition false?

      - type: code
        payload:
          language: python
          markdown: |
            ```python
            def filter_training_rows(rows: list[dict], max_n: int) -> list[dict]:
                """Keep labelled rows; stop once we have max_n examples."""
                out: list[dict] = []
                for row in rows:
                    label = row.get("label")
                    if label is None:
                        continue
                    if not isinstance(label, (int, float, str)):
                        continue
                    out.append(row)
                    if len(out) >= max_n:
                        break
                return out


            def route_example(example: dict) -> str:
                modality = example.get("modality")
                if modality == "text":
                    return "text_encoder"
                if modality == "image":
                    return "vision_encoder"
                raise ValueError(f"unknown modality: {modality!r}")
            ```

            The first function encodes three policies: skip missing labels, skip bad types, and
            stop early when the budget is met. The second encodes routing. Both are control flow;
            neither is optional decoration.

      - type: misconception
        payload:
          code: python.control_else_always_runs
          claim: "The else after a for-loop always runs when the loop finishes."
          markdown: |
            **The claim:** `for x in xs: ... else: ...` means "after the loop, always do this".

            **Why it feels right:** `if/else` pairs an alternative with a condition, so `for/else`
            looks like "loop, then otherwise".

            **What actually happens:** the `else` runs only when the loop completed *without*
            hitting `break`. If you `break` on a successful find, the `else` is skipped — that is
            the point of the construct.

            **How to catch yourself:** rewrite with an explicit `found = False` flag. If that
            clearer version and the `for/else` disagree in your head, you had the misconception.

      - type: common_mistake
        markdown: |
          **Nested if-pyramids.** Three levels deep means three mental stacks. Flatten with early
          returns and `continue`.

          **`while True` without a clear exit.** Always name the stop condition or document the
          only `break` path.

          **Silent `pass` in except.** Catching errors and doing nothing hides pipeline failures
          that should stop the run or at least be counted.

      - type: exercise_set
        payload:
          checkedByPlatform: false
          markdown: |
            1. Rewrite a three-level nested `if` that validates a row into guard-clause early
               returns. Keep the same behaviour.
            2. Write a loop that yields at most 100 non-empty strings from a list, skipping blanks
               with `continue` and stopping with `break`.
            3. Explain when you would choose `while` over `for` in a data loader.
            4. Given `for item in items: if item == target: break else: ...`, say when the `else`
               body runs.
            5. Design the control-flow skeleton (no real I/O) for: read CSV rows, drop null labels,
               cap at 10_000 examples, raise if zero examples remain.

      - type: quiz_set
        payload:
          selfCheck: true
          items:
            - question: "What does an early return buy you in a validation function?"
              answer: >-
                You exit as soon as a rejection reason is known, keep the happy path unindented,
                and make each failure mode visible as its own return.
            - question: "When should you prefer for over while?"
              answer: >-
                When you are iterating a known collection or iterator with a natural end. Use
                while when the stop condition depends on state that is not a fixed sequence.
            - question: "What does continue do inside a filtering loop?"
              answer: >-
                It skips the rest of the current iteration and moves to the next item, without
                leaving the loop.
            - question: "Why is control flow central to ML pipelines?"
              answer: >-
                It encodes which examples are kept, skipped, or routed — silent wrong decisions
                corrupt training without raising an obvious error.

      - type: mastery_criteria
        payload:
          markdown: |
            You have this when you can:

            - Write a filter loop with `continue` and an early-stop `break` without nesting.
            - Replace a nested validation pyramid with guard-clause returns.
            - Explain `for`/`else` correctly, or choose not to use it and say why.
            - Sketch the control-flow skeleton of a small ingest pipeline before writing I/O.
    resources:
      - source: python-tutorial
        purpose: PRIMARY_REFERENCE
        relevance: 0.9
        excerpt: >-
