  - slug: python-numpy-essentials
    title: NumPy Essentials for Machine Learning
    kind: knowledge_unit
    parent: python
    status: published
    version: 1.0.0
    difficulty: 3
    estimateMinutes: 40
    volatility: LOW
    knowledgeClass: STABLE
    lastReviewedAt: 2026-09-19
    lastVerifiedAt: 2026-09-19
    tags: [python, numpy, arrays, broadcasting]
    objectives:
      - Create and reshape NumPy arrays and read their shape and dtype.
      - Apply broadcasting rules to predict the shape of an elementwise operation.
      - Replace a Python loop over rows with a vectorized expression when it is clearer.
      - Explain why vectorized ops matter for ML feature and batch code.
    description: >-
      Arrays, broadcasting, and vectorized operations — the default way ML code manipulates
      batches of numbers without writing Python loops.
    blocks:
      - type: why
        markdown: |
          Almost every ML library speaks NumPy's dialect: shape tuples, `float32` batches, and
          operations that run over whole arrays at once. If you think in Python `for` loops over
          rows, you will write code that is slow, hard to batch, and easy to get wrong on the
          batch axis.

          Broadcasting is the rule that lets a vector of biases add to every row of a matrix
          without an explicit loop. Misread the rule and you silently expand the wrong axis —
          a bug that often still "runs".

      - type: eli5
        markdown: |
          A NumPy array is a grid of numbers with a shape sticker on the box: "3 rows by 4
          columns".

          Vectorized code means: tell the box "add 1 to every cell" once, instead of visiting
          each cell yourself with a shopping list.

          Broadcasting is the rule for when two boxes have different shapes but can still line
          up — like adding one seasoning mix to every tray in an oven because the mix is meant
          to stretch across trays.

      - type: beginner
        markdown: |
          Create arrays from lists, or with helpers:

          ```python
          import numpy as np

          x = np.array([[1.0, 2.0], [3.0, 4.0]])  # shape (2, 2)
          z = np.zeros((3, 4))                    # shape (3, 4)
          r = np.arange(6).reshape(2, 3)          # shape (2, 3)
          ```

          Always know **`shape`** (sizes of each axis) and **`dtype`** (element type). ML code
          usually wants `float32` or `float64`; integers appear for indices and labels.

          **Elementwise** ops (`+`, `*`, `np.exp`, comparisons) apply per cell when shapes match.
          **Reductions** (`sum`, `mean`, `max`) collapse axes:

          ```python
          batch = np.random.randn(8, 16)   # 8 examples, 16 features
          batch.mean(axis=0)               # mean feature vector, shape (16,)
          batch.mean(axis=1)               # per-example mean, shape (8,)
          ```

          The batch axis is almost always axis `0` in this curriculum's examples.

      - type: intermediate
        markdown: |
          **Broadcasting** compares shapes right-to-left. Two dimensions are compatible if they
          are equal, or one of them is `1`. Missing leading dimensions behave like `1`.

          Example: `(4, 3)` with `(3,)` → the vector acts as `(1, 3)` and stretches over 4 rows.
          Example: `(4, 1)` with `(1, 3)` → result `(4, 3)`.
          Failure: `(4, 3)` with `(4,)` — after aligning from the right, `3` vs `4` conflict.

          This is how you subtract a per-feature mean from every row:

          ```python
          X = ...                      # (n, d)
          mu = X.mean(axis=0)          # (d,)
          X_centered = X - mu          # broadcasts (d,) across n rows
          ```

          **Vectorization** replaces:

          ```python
          out = []
          for row in X:
              out.append(row @ w)
          ```

          with `X @ w` when `w` has shape `(d,)`. Prefer clarity: a short loop that is obviously
          correct beats an opaque broadcast — but for batch math, the vectorized form is usually
          both clearer and faster.

          Watch **views vs copies**. `reshape` and slicing often return views; in-place edits can
          surprise you. When in doubt, `.copy()`.

      - type: code
        payload:
          language: python
          markdown: |
            ```python
            import numpy as np

            # Batch of 4 examples, 3 features; add a bias per feature via broadcast.
            X = np.array([
                [1.0, 2.0, 3.0],
                [0.5, 0.5, 0.5],
                [2.0, 0.0, 1.0],
                [1.0, 1.0, 1.0],
            ])                                 # (4, 3)
            bias = np.array([0.1, -0.2, 0.0]) # (3,)
            X_biased = X + bias               # (4, 3)

            # Standardize features (zero mean, unit variance) without a Python loop.
            mu = X.mean(axis=0)
            sigma = X.std(axis=0) + 1e-8
            X_std = (X - mu) / sigma

            # Softmax over classes for one batch (axis=1 = class axis).
            logits = np.array([[2.0, 0.5, 0.1],
                               [0.0, 0.0, 1.0]])  # (2, 3)
            shifted = logits - logits.max(axis=1, keepdims=True)
            exp = np.exp(shifted)
            probs = exp / exp.sum(axis=1, keepdims=True)
            ```

            `keepdims=True` preserves a size-1 axis so the division broadcasts correctly. Dropping
            it is a classic shape bug.

      - type: misconception
        payload:
          code: numpy.broadcast_confuses_shape
          claim: "If two arrays have the same number of elements, they broadcast."
          markdown: |
            **The claim:** matching element counts (or "same rank") is enough for broadcasting.

            **Why it feels right:** reshape can turn any flat buffer into any shape with the same
            size, so people assume NumPy will "figure it out".

            **What actually happens:** broadcasting is a *per-axis* rule from the right, not a
            free reshape. `(4, 3)` and `(4,)` do not broadcast even though both involve a 4.
            `(4, 3)` and `(3,)` do.

            **How to catch yourself:** write both shapes, pad the shorter on the left with 1s,
            and check each pair. If any pair is unequal and neither is 1, it will fail — or, if
            you forced a reshape earlier, it may "succeed" with the wrong alignment.

      - type: common_mistake
        markdown: |
          **Forgetting `keepdims` on reductions** used in later broadcasts — shapes become
          `(n,)` instead of `(n, 1)` and align on the wrong axis.

          **Assuming `*` is matmul.** In NumPy, `*` is elementwise; use `@` or `np.matmul` for
          matrix products.

          **Silent dtype demotion.** Mixing ints and floats can produce ints; cast explicitly
          when you need floats for gradients or probabilities.

      - type: exercise_set
        payload:
          checkedByPlatform: false
          markdown: |
            1. Predict the result shape of `(8, 1, 5)` + `(3, 5)`, or explain why it errors.
            2. Center a matrix `X` with shape `(n, d)` by subtracting the per-column mean using
               broadcasting only (no Python loop).
            3. Rewrite a loop that computes `y[i] = x[i] * w + b` for 1-D `x` as a vectorized
               expression.
            4. Show why `(4, 3) + (4,)` fails and how to fix it to add a per-row scalar.
            5. Implement row-wise L2 normalization of `X` with shape `(n, d)` using reductions and
               broadcasting.

      - type: quiz_set
        payload:
          selfCheck: true
          items:
            - question: "What two attributes of an array should you check before combining arrays?"
              answer: "shape and dtype — sizes of each axis and the element type."
            - question: "State the broadcasting compatibility rule for one pair of dimensions."
              answer: >-
                They are compatible if equal or if one of them is 1 (missing leading dims act
                like 1).
            - question: "Why does keepdims matter after a reduction used in a later divide?"
              answer: >-
                It preserves a length-1 axis so the reduced array broadcasts against the original
                axes instead of aligning from the right incorrectly.
            - question: "What is the difference between * and @ in NumPy?"
              answer: "* is elementwise multiplication; @ is matrix multiplication."

      - type: mastery_criteria
        payload:
          markdown: |
            You have this when you can:

            - Read and predict shapes for elementwise ops and simple broadcasts.
            - Center or scale a feature matrix with broadcasting and no Python row loop.
            - Spot a `keepdims` mistake before it ships.
            - Choose `@` vs `*` deliberately in batch code.
