    tags: [mathematics, linear-algebra]
    objectives:
      - Read vector and matrix notation without translating it back to "a table of numbers".
      - Compute dot products, norms, and matrix products by hand on small examples.
      - Explain a matrix product as a composition of linear maps.
    description: >-
      The three ideas that every model's forward pass is written in. Enough to read a paper's
      notation and enough to predict the shape of what comes out.
    blocks:
      - type: why
        markdown: |
          A neural network's forward pass is a chain of matrix products with nonlinearities
          between them. An embedding search is a dot product. Attention is a product of three
          matrices. If this notation is opaque, then every architecture diagram after it is
          decoration rather than explanation.

  - slug: vectors
    title: Vectors
    kind: knowledge_unit
    parent: vectors-matrices-and-matmul
    status: published
    version: 1.0.0
    difficulty: 2
    estimateMinutes: 30
    volatility: LOW
    knowledgeClass: FOUNDATIONAL
    lastReviewedAt: 2026-09-16
    tags: [mathematics, linear-algebra, vectors, embeddings]
    objectives:
      - Write a vector in coordinates and state its dimension.
      - Compute a dot product and a Euclidean norm by hand.
      - Interpret cosine similarity, including what it deliberately ignores.
    description: >-
      A vector is a list of numbers you are allowed to add and scale. That modest definition is
      what makes embeddings, gradients, and parameters all the same kind of object.
    blocks:
      - type: why
        markdown: |
          Every embedding is a vector, so every "find me similar documents" query is a question
          about vector geometry. When a retrieval system returns something irrelevant, the
          explanation is usually in the definitions on this page — not in the model.

      - type: eli5
        markdown: |
          A vector is a list of numbers, like a set of dials.

          Two dials: `[3, 4]` could be "3 steps east, 4 steps north". You can follow one set of
          directions and then another, which is **adding** vectors. You can follow the same
          directions but twice as far, which is **scaling** a vector.

          That is all a vector is: something you can add to another one and stretch.

      - type: beginner
        markdown: |
          Write a vector as a list of components:

          $$
          \mathbf{v} = \begin{bmatrix} 3 \\ 4 \end{bmatrix}
          $$

          The number of components is the **dimension**. A word embedding with 768 components is
          a vector in 768 dimensions — impossible to picture, identical to work with.

          **Addition** is componentwise, and only between vectors of the same dimension:

          $$
          \begin{bmatrix} 3 \\ 4 \end{bmatrix} + \begin{bmatrix} 1 \\ 2 \end{bmatrix}
          = \begin{bmatrix} 4 \\ 6 \end{bmatrix}
          $$

          **Scaling** multiplies every component: $2\mathbf{v} = [6, 8]$.

          **Length** (the Euclidean norm) is Pythagoras in as many dimensions as you have:

          $$
          \|\mathbf{v}\|_2 = \sqrt{\sum_{i=1}^{n} v_i^2} = \sqrt{3^2 + 4^2} = 5
          $$

          **Dot product** multiplies matching components and adds the results:

          $$
          \mathbf{a} \cdot \mathbf{b} = \sum_{i=1}^{n} a_i b_i
          $$

          With $\mathbf{a} = [3, 4]$ and $\mathbf{b} = [4, 3]$: $3(4) + 4(3) = 24$.

      - type: math_intuition
        markdown: |
          The dot product answers: **how much does one vector point along the other?**

          $$
          \mathbf{a} \cdot \mathbf{b} = \|\mathbf{a}\|\,\|\mathbf{b}\|\cos\theta
          $$

          Three cases worth holding in your head:

          - Same direction → $\cos\theta = 1$ → the dot product is as large as the lengths allow.
          - Perpendicular → $\cos\theta = 0$ → the dot product is **zero**, regardless of length.
            $[1,0] \cdot [0,1] = 0$.
          - Opposite → $\cos\theta = -1$ → negative.

          Rearranged, that identity gives **cosine similarity**, which throws away length and
          keeps only direction:

          $$
          \cos\theta = \frac{\mathbf{a} \cdot \mathbf{b}}{\|\mathbf{a}\|\,\|\mathbf{b}\|}
          $$

          For $\mathbf{a} = [3,4]$, $\mathbf{b} = [4,3]$: $\frac{24}{5 \cdot 5} = 0.96$. Nearly
          the same direction, and they would score 0.96 even if one were a hundred times longer.
          That is the property retrieval systems want, since document length should not decide
          relevance.

      - type: math_formal
        markdown: |
          Formally, $\mathbb{R}^n$ with componentwise addition and scalar multiplication is a
          **vector space**: addition is associative and commutative, there is a zero vector, every
          vector has an additive inverse, and scaling distributes over addition.

          The dot product is an **inner product**: symmetric, linear in each argument, and
          positive definite ($\mathbf{v} \cdot \mathbf{v} > 0$ for $\mathbf{v} \neq \mathbf{0}$).
          The norm it induces, $\|\mathbf{v}\| = \sqrt{\mathbf{v} \cdot \mathbf{v}}$, satisfies
          the triangle inequality and the Cauchy–Schwarz inequality

          $$
          |\mathbf{a} \cdot \mathbf{b}| \le \|\mathbf{a}\|\,\|\mathbf{b}\|,
          $$

          which is precisely why cosine similarity is confined to $[-1, 1]$ and can be read as a
          similarity score at all.

      - type: code
        payload:
          language: python
          markdown: |
            ```python
            import numpy as np

            a = np.array([3.0, 4.0])
            b = np.array([4.0, 3.0])

            a + b                      # array([7., 7.])
            2 * a                      # array([6., 8.])
            np.dot(a, b)               # 24.0
            np.linalg.norm(a)          # 5.0

            cosine = np.dot(a, b) / (np.linalg.norm(a) * np.linalg.norm(b))
            cosine                     # 0.96

            # Perpendicular vectors: zero dot product, no matter the lengths.
            np.dot(np.array([1.0, 0.0]), np.array([0.0, 99.0]))   # 0.0
            ```

            Every one of these is a single dispatch into compiled code, which is the practical
            reason embeddings are compared this way rather than in a Python loop.

      - type: application
        markdown: |
          A retrieval system stores one vector per chunk of text. A query becomes a vector, and
          the system returns the chunks whose vectors have the highest cosine similarity to it.

          Nothing in that pipeline understands language. It compares directions in a space that
          a model arranged so that related text points the same way. Which is also why retrieval
          fails in ways that look silly: two passages with opposite meanings can still point in
          nearly the same direction if they use the same vocabulary.

      - type: misconception
        payload:
          code: vectors.cosine_means_same_meaning
          claim: "High cosine similarity means the two texts mean the same thing."
          markdown: |
            **The claim:** cosine similarity of 0.95 means two passages say the same thing, so
            retrieval hits at 0.95 must be relevant.

            **Why it feels right:** the number behaves like a percentage, and in demos the top
            hit usually *is* relevant, so the number gets read as a confidence score.

            **What actually happens:** cosine similarity measures the angle between two vectors
            produced by a specific embedding model. It reports similarity **as that model
            encodes it** — which is dominated by topic and vocabulary. "The drug reduced
            mortality" and "the drug did not reduce mortality" sit very close together, because
            almost every word matches. Negation, numbers, and dates are exactly what embeddings
            compress away.

            Absolute scores are also not comparable across models, and in high dimensions most
            pairs cluster in a narrow band, so 0.8 can be near-unrelated for one model and very
            close for another.

            **How to catch yourself:** treat cosine similarity as *ranking* evidence, never as
            truth. If a claim depends on a negation, a quantity, or a date, verify it against the
            retrieved text rather than trusting the score.

      - type: exercise_set
        payload:
          checkedByPlatform: false
          markdown: |
            By hand first, then check with NumPy.

            1. Compute $\mathbf{a} \cdot \mathbf{b}$ and $\|\mathbf{a}\|$ for
               $\mathbf{a} = [1, 2, 2]$, $\mathbf{b} = [2, 0, 1]$.
            2. Find a non-zero vector perpendicular to $[3, 4]$. Verify the dot product is zero.
            3. Compute the cosine similarity between $[1, 1]$ and $[10, 10]$. Explain the result
               in one sentence.
            4. Two document vectors have the same direction but one is ten times longer. Which
               changes, the dot product or the cosine similarity? Show both numbers.
            5. Write one sentence pair that a cosine-similarity search would rank as nearly
               identical even though they contradict each other.

            Check for 1: dot $= 4$, norm $= 3$.

      - type: quiz_set
        payload:
          selfCheck: true
          items:
            - question: "What does a dot product of zero tell you?"
              answer: >-
                The vectors are perpendicular — neither points along the other at all. It says
                nothing about their lengths.
            - question: "Why do retrieval systems prefer cosine similarity to a raw dot product?"
              answer: >-
                Cosine divides out both lengths, so a long document cannot outrank a short one on
                magnitude alone. The raw dot product grows with length.

      - type: mastery_criteria
        payload:
          markdown: |
            You have this when you can:

            - Compute a dot product, a norm, and a cosine similarity on a three-dimensional
              example without notes.
            - Say what cosine similarity ignores, and name a case where that omission produces a
              wrong retrieval result.
            - Read $\sum_i a_i b_i$ and see "dot product" rather than parsing it symbol by symbol.
    resources:
