  - slug: chunking-and-retrieval-quality
    title: Chunking and Retrieval Quality
    kind: knowledge_unit
    parent: retrieval-augmented-generation
    status: published
    version: 1.0.0
    difficulty: 3
    estimateMinutes: 35
    volatility: HIGH
    knowledgeClass: CURRENT
    lastReviewedAt: 2026-09-19
    lastVerifiedAt: 2026-09-19
    tags: [rag, chunking, retrieval, embeddings]
    objectives:
      - Explain how chunk boundaries change what an embedding can represent.
      - Choose structure-aware splitting and overlap for a document type.
      - Separate retrieval failures caused by chunking from those caused by ANN or the embedder.
      - Design a small offline test that catches destructive chunking.
    description: >-
      Beyond the basic RAG pipeline: chunking is where many "retrieval is bad" bugs are born.
      Size, structure, and overlap decide whether the supporting sentence is retrievable at all.
    blocks:
      - type: why
        markdown: |
          The RAG basics unit shows a refund policy split across chunks so the exception never
          travels with the rule. That failure is not exotic — it is the default outcome of naive
          fixed-size splitting on real documents.

          This page stays on chunking and retrieval quality: how to split, what to measure, and
          how to tell a chunking bug from an index bug.

      - type: eli5
        markdown: |
          You tear a textbook into index cards for a quiz game. If a definition spans two cards,
          the card with the term might not include the meaning, and the card with the meaning
          might not include the term. Search finds one card; the answer is incomplete.

          Good chunking keeps ideas that must travel together on the same card, and lets cards
          share a little overlap so sentences are not chopped in half.

      - type: beginner
        markdown: |
          Each chunk is embedded as **one vector**. That vector is a compressed summary of
          everything in the chunk. Mixing unrelated topics in one chunk blurs the vector; cutting
          a thought across two chunks hides the full meaning from either vector.

          Practical defaults to start from (then measure):

          - Prefer **structure**: headings, sections, pages, or semantic breaks over raw character
            counts when the format allows.
          - Target a size your embedder and prompt budget like (often hundreds of tokens, not
            tens of thousands).
          - Add **overlap** (a trailing window of the previous chunk) so boundary sentences appear
            intact in at least one chunk.
          - Store **metadata**: document id, section title, URLs, dates, tenant — for filters and
            citations, not only for vectors.

          Query-side: embed the question with the **same** model used for documents. Mismatched
          models make similarity meaningless.

      - type: intermediate
        markdown: |
          **Failure signatures.**

          | Symptom | Suspect chunking if… |
          |---------|----------------------|
          | Answer cites a real passage but misses a caveat | Caveat lived in a neighbour chunk |
          | Good keyword hit, weak vector hit | Chunk text lost the exact token / heading |
          | Similar scores for irrelevant chunks | Chunks too large / multi-topic |
          | Never retrieves the right doc | Wrong metadata filter or embedder mismatch |

          **Parent document / small-to-big patterns.** Retrieve small chunks for precision, then
          expand to the parent section for generation so the model sees local context. That helps
          when tight chunks retrieve well but read poorly alone.

          **Tables, code, and lists.** Fixed character splits destroy rows and function bodies.
          Keep rows together; keep functions or logical blocks together; consider specialised
          extractors rather than one splitter for every MIME type.

          **Evaluation.** Build 20–50 questions with known supporting spans. For each splitter
          candidate, measure whether the supporting span lands in the retrieved top-$k$ (retrieval
          recall). Only then look at answer quality. If recall is low, do not tune the prompt.

          **Relation to ANN.** A perfect chunk still fails if the index drops it. Diagnose with
          exact search on a sample: if exact finds the chunk and ANN does not, fix the index; if
          neither finds it, fix chunking, metadata, or the embedding model.

      - type: example
        markdown: |
          Document section:

          ```
          ## Digital licences
          Refunds are available within 30 days of purchase.
          Exception: digital licences are non-refundable after activation.
          ```

          **Fixed 80-character chunks** (caricature): chunk A ends after "purchase."; chunk B
          starts at "Exception…". Query "Can I refund an activated licence?" matches A; model
          answers yes with a true citation of A.

          **Structure-aware chunk:** one chunk for the whole `## Digital licences` section with
          a short overlap into the previous section's last sentence. Both rule and exception
          embed together; retrieval can surface the caveat.

          Same embedder, same index — different chunker, different product behaviour.

      - type: misconception
        payload:
          code: rag.bigger_chunks_better
          claim: "Bigger chunks are always better because they keep more context."
          markdown: |
            **The claim:** maximise chunk size so nothing important is left out; retrieval will
            still find the right document.

            **Why it feels right:** humans prefer reading full sections, and tiny chunks feel
            lossy.

            **What actually happens:** large multi-topic chunks embed to an average that matches
            nothing precisely. You retrieve a vaguely related blob; the supporting sentence is
            buried; long context then dilutes attention. Precision retrieval wants focused
            chunks; generation can expand afterward.

            **How to catch yourself:** if top hits are "about the right document" but not the
            right paragraph, shrink and structure-split, then remeasure Recall@$k$ on gold spans.

      - type: common_mistake
        markdown: |
          **One splitter for PDFs, HTML, and source code.** Formats break differently; so should
          chunkers.

          **Tuning the LLM temperature to fix missing caveats.** If the caveat never entered the
          prompt, sampling will not invent the correct policy reliably — and if it does, you got
          lucky, not grounded.

      - type: exercise_set
        payload:
          checkedByPlatform: false
          markdown: |
            1. Rewrite the digital-licence section into chunks that keep the exception with the
               rule; note what you sacrifice.
            2. Describe a parent-document retrieval pattern in three steps.
            3. You change only the chunker and Recall@5 drops. What did you likely break?
            4. Exact search finds the gold chunk; ANN does not. Where do you look next?
            5. Design five gold questions for a 20-page employee handbook focused on chunking
               edge cases (negation, tables, exceptions).

      - type: quiz_set
        payload:
          selfCheck: true
          items:
            - question: "Why do multi-topic chunks hurt vector retrieval?"
              answer: >-
                One embedding averages several subjects, so similarity matches vaguely rather than
                precisely.
            - question: "What is overlap for?"
              answer: >-
                Keeping sentences that sit on boundaries intact in at least one chunk.
            - question: "What should you measure before blaming the generator?"
              answer: >-
                Whether the supporting span appears in the retrieved set (retrieval recall).
            - question: "Same embedder for queries and documents — why?"
              answer: >-
                Vectors from different models are not comparable; similarity becomes meaningless.

      - type: mastery_criteria
        payload:
          markdown: |
            You have this when you can:

            - Design a structure-aware chunking scheme for a real document type.
            - Diagnose caveat-split failures from symptoms alone.
            - Separate chunking misses from ANN misses with a concrete test.
            - Refuse to "fix retrieval" by only editing the generation prompt when recall is low.
