  - slug: gradient-descent-basics
    title: Gradient Descent Basics
    kind: knowledge_unit
    parent: optimization-for-ml
    status: published
    version: 1.0.0
    difficulty: 3
    estimateMinutes: 36
    volatility: LOW
    knowledgeClass: FOUNDATIONAL
    lastReviewedAt: 2026-09-19
    lastVerifiedAt: 2026-09-19
    tags: [optimization, gradient-descent, autograd]
    objectives:
      - Write the parameter update $w \leftarrow w - \eta \nabla L(w)$ and interpret each term.
      - Distinguish full-batch, mini-batch, and stochastic gradient descent at a practical level.
      - Explain what autograd contributes versus what the optimizer step does.
      - Predict the next loss move from a toy 1-D example with a chosen $\eta$.
    description: >-
      Gradient descent is repeated local downhill steps. Autograd supplies the gradient;
      the optimizer applies the step.
    blocks:
      - type: why
        markdown: |
          Loss is a function of parameters. You cannot grid-search a million weights. The
          derivative tells you which way the loss increases locally; stepping the other way is
          the entire idea.

          Frameworks hide the arithmetic, not the meaning. When training diverges, you are still
          debugging this update.

      - type: eli5
        markdown: |
          You are blindfolded on a hillside and want the valley floor. You feel the slope under
          your feet and take a small step downhill. Repeat.

          The slope is the gradient. The step length is the learning rate. Too bold a step and
          you leap onto another ridge; too timid and you shuffle forever.

      - type: beginner
        markdown: |
          For parameters $w$ and loss $L(w)$, one gradient-descent step is

          $$
          w \leftarrow w - \eta \, \nabla L(w)
          $$

          - $\nabla L(w)$ points uphill (steepest increase).
          - The minus sign moves downhill.
          - $\eta > 0$ is the **learning rate** — how far to trust the local linear picture.

          **Full batch** uses $\nabla L$ on the whole training set. **Stochastic** uses one
          example. **Mini-batch** uses a small batch — the usual compromise for stable-ish
          gradients and GPU efficiency.

          One **epoch** is one pass over the training data (in whatever batching you chose).

      - type: intermediate
        markdown: |
          **What autograd does.** A framework builds a computation graph for the forward loss,
          then applies the chain rule backwards to get $\partial L / \partial w$ for each
          parameter. That is the gradient vector. It does *not* choose $\eta$ or apply the step
          — the optimizer does.

          **Mini-batch noise.** Each batch gradient is a noisy estimate of the full gradient.
          Noise can help escape sharp bad regions; too much noise (batch size 1 on a jagged loss)
          makes progress erratic. Learning-rate schedules and larger batches both quiet the path.

          **Scale matters.** If features or parameters live on wild scales, gradients do too.
          Normalising inputs and careful initialisation are optimization hygiene, not optional
          polish.

          Pseudocode of one step:

          ```text
          loss = forward(batch, w)
          grads = backward(loss)      # autograd
          w = w - eta * grads         # optimizer
          ```

      - type: code
        payload:
          language: python
          markdown: |
            ```python
            # Toy 1-D descent on L(w) = (w - 3)**2  → minimum at w=3, L'=2(w-3)
            w = 0.0
            eta = 0.1
            for step in range(5):
                grad = 2 * (w - 3)
                w = w - eta * grad
                print(step, w, (w - 3) ** 2)

            # Conceptual PyTorch-shaped loop (illustrative):
            # loss = model(batch).sum()          # forward
            # loss.backward()                    # autograd fills .grad
            # with torch.no_grad():
            #     for p in model.parameters():
            #         p -= eta * p.grad
            #     model.zero_grad()
            ```

            After a few steps with $\eta = 0.1$, $w$ climbs from 0 toward 3 and the loss falls.
            Autograd replaces the hand-written `grad = 2 * (w - 3)` for real graphs.

      - type: misconception
        payload:
          code: opt.autograd_is_the_optimizer
          claim: "Calling loss.backward() updates the weights."
          markdown: |
            **The claim:** backpropagation trains the model by itself.

            **Why it feels right:** tutorials emphasise `backward()`, and without it nothing
            learns — so it feels like the training step.

            **What actually happens:** `backward()` (autograd) *computes* gradients and stores
            them. Weights move only when an optimizer step (or an explicit `w -= eta * grad`)
            applies them. Forget the step and you recompute grads forever on frozen weights.

            **How to catch yourself:** print a parameter before `backward()`, after `backward()`,
            and after `optimizer.step()`. Only the last call should change the value.

      - type: common_mistake
        markdown: |
          **Forgetting to zero grads** between steps, so gradients accumulate and the step size
          silently grows.

          **Using the training loss alone as proof of generalisation.** Descent can memorise.

          **Huge $\eta$ on unnormalised inputs.** The first batch explodes; the bug looks like
          "PyTorch is broken".

      - type: exercise_set
        payload:
          checkedByPlatform: false
          markdown: |
            1. For $L(w)=(w-3)^2$, $w=0$, $\eta=0.1$, compute the next two values of $w$ by hand.
            2. Explain the minus sign in $w \leftarrow w - \eta \nabla L$ using the hill metaphor.
            3. Contrast full-batch vs mini-batch in one sentence each on noise and cost per step.
            4. List the three lines of a training step: forward, backward, update — and say which
               one moves parameters.
            5. What happens if you call backward twice without zeroing grads, then step once?

      - type: quiz_set
        payload:
          selfCheck: true
          items:
            - question: "Write the basic gradient-descent update and name each symbol."
              answer: >-
                w ← w − η ∇L(w): w parameters, η learning rate, ∇L gradient of loss (uphill
                direction).
            - question: "What does autograd compute, and what does it not do?"
              answer: >-
                It computes gradients via the chain rule. It does not apply the parameter update
                or choose η.
            - question: "Why use mini-batches instead of one example or the full set?"
              answer: >-
                Compromise: stabler estimates than pure SGD, cheaper/more frequent updates than
                full batch, and good hardware utilisation.
            - question: "Which way does ∇L point, and why do we subtract it?"
              answer: >-
                Steepest increase of L; subtracting moves toward lower loss locally.

      - type: mastery_criteria
        payload:
          markdown: |
            You have this when you can:

            - Hand-execute a 1-D descent step and predict whether loss falls for a given $\eta$.
            - Separate autograd (gradient) from optimizer (update) in a framework loop.
            - Choose vocabulary: batch, mini-batch, epoch — without mixing them.
            - Diagnose "backward without step" and "forgot zero_grad" failure modes.
    resources:
