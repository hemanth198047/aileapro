  - slug: learning-rates-and-local-minima
    title: Learning Rates, Valleys, and Local Minima
    kind: knowledge_unit
    parent: optimization-for-ml
    status: published
    version: 1.0.0
    difficulty: 3
    estimateMinutes: 34
    volatility: LOW
    knowledgeClass: FOUNDATIONAL
    lastReviewedAt: 2026-09-19
    lastVerifiedAt: 2026-09-19
    tags: [optimization, learning-rate, nonconvex]
    objectives:
      - Diagnose too-large and too-small learning rates from loss-curve symptoms.
      - Explain why deep losses are non-convex and what "local minimum" means operationally.
      - Distinguish saddles / plateaus from useful progress stalls at a basic level.
      - State what learning-rate schedules try to achieve without memorising every schedule name.
    description: >-
      The learning rate decides whether a correct gradient becomes progress, noise, or
      divergence — especially on non-convex deep losses.
    blocks:
      - type: why
        markdown: |
          The gradient can be right and the run still fails. $\eta$ controls whether each step
          stays inside the region where the linear approximation of $L$ is trustworthy. Deep
          networks add another complication: many basins, flat regions, and saddles — so "find
          the global minimum" is the wrong mental model for most training runs.

      - type: eli5
        markdown: |
          Walking downhill with giant strides: you overshoot the valley and bounce between walls
          (learning rate too big). Ant-sized steps: you eventually arrive, but dinner is cold
          (too small).

          Mountain ranges have many valleys. Landing in a decent valley can be enough; hunting
          the single deepest point on Earth is not how hikers travel — or how we usually train
          nets.

      - type: beginner
        markdown: |
          **Too large $\eta$:** loss oscillates, becomes NaN, or climbs. Steps leave the
          neighbourhood where $\nabla L$ was a good guide.

          **Too small $\eta$:** loss decreases very slowly; training looks "stuck" but gradients
          are tiny steps, not zero.

          **Rule of thumb workflow:** start with a commonly used default for the optimizer
          (e.g. something on the order of $10^{-3}$ for many Adam runs — task-dependent), watch
          the curve, then adjust by factors of 3–10 rather than tiny nudges.

          **Schedules** reduce $\eta$ over time (step decay, cosine, warmup then decay). Early
          larger steps explore; later smaller steps settle. Warmup avoids huge early updates when
          gradients are chaotic.

      - type: intermediate
        markdown: |
          Deep network losses are typically **non-convex**: many critical points where
          $\nabla L \approx 0$. A **local minimum** is a point lower than its neighbourhood, not
          necessarily the global best. Empirically, many "problems" that look like bad minima are
          **saddles** or **plateaus** where progress is slow until noise or a schedule helps.

          For overparameterised nets, reaching zero training loss is often possible from many
          initialisations; the practical question is which region generalises. That is why
          initialization, batch noise, and regularisation matter alongside $\eta$.

          **Loss curve reading:**

          | Pattern | Likely cause |
          |---------|--------------|
          | Smooth steady drop | Reasonable $\eta$ |
          | Spikes / divergence | $\eta$ too large or bad batches |
          | Flat from step 0 | $\eta$ tiny, dead units, or bug (no update) |
          | Train ↓ val ↑ | Overfitting, not primarily $\eta$ |

          Learning rate is not a cure for wrong labels or leakage — it only controls step scale.

      - type: example
        markdown: |
          On $L(w)=w^2$, start at $w=5$.

          - $\eta = 0.1$: $w \leftarrow 5 - 0.1\cdot 10 = 4$, then $3.2$, … monotonically toward 0.
          - $\eta = 1$: $w \leftarrow 5 - 10 = -5$, then $+5$, … oscillates; loss never settles.
          - $\eta = 1.1$: magnitude *grows* each step — classic divergence.

          Same gradient formula; the step size decides success. Non-convex nets add many such
          bowls glued together, but the local lesson about $\eta$ is unchanged.

      - type: misconception
        payload:
          code: opt.must_find_global_min
          claim: "Training fails unless gradient descent finds the global minimum."
          markdown: |
            **The claim:** non-convexity means GD is useless unless it reaches the global min.

            **Why it feels right:** calculus homework treats global minima as the answer, and
            "stuck in local minima" is popular folklore.

            **What actually happens:** deep models are trained successfully all the time without
            certifying global optimality. Many regions achieve low training loss; generalisation
            and stability matter more than global optimality certificates. Plateaus and saddles
            often explain slowdowns better than "the" bad local min.

            **How to catch yourself:** ask whether train loss is high and stuck with huge
            gradients (optimization failure) or train loss is low while val is bad
            (generalisation). Only the first is primarily an $\eta$/architecture optimize issue.

      - type: common_mistake
        markdown: |
          **Tuning $\eta$ while the data pipeline is broken.** Fix NaN inputs before grid-searching
          rates.

          **Comparing runs with different batch sizes without retuning $\eta$.** Effective step
          scale changes.

          **Reading one noisy batch spike as proof you must halt training.** Look at a smoothed
          curve and gradient norms.

      - type: exercise_set
        payload:
          checkedByPlatform: false
          markdown: |
            1. Sketch loss-vs-step curves for too-small, good, and too-large $\eta$ on a simple
               bowl-shaped loss.
            2. For $L(w)=w^2$, $w=5$, show that $\eta=1$ oscillates between 5 and $-5$.
            3. Give one reason a schedule might decrease $\eta$ late in training.
            4. Train loss is near zero but val loss is high — is your first suspect "local
               minimum of the population risk" or overfitting? Why?
            5. Name two symptoms that look like a bad minimum but may be a too-small $\eta$ or a
               dead gradient path instead.

      - type: quiz_set
        payload:
          selfCheck: true
          items:
            - question: "What does a diverging or violently oscillating loss often indicate?"
              answer: "Learning rate too large (or unstable batches / bad scaling)."
            - question: "Why is 'find the global minimum' a poor slogan for deep net training?"
              answer: >-
                Losses are non-convex with many good-enough regions; practice optimises for low
                loss and generalisation, not certified global optimality.
            - question: "What is a learning-rate schedule trying to do?"
              answer: >-
                Use larger steps early for progress/exploration, then smaller steps to settle
                without overshooting.
            - question: "Flat loss from step 0 — name two distinct causes to check."
              answer: >-
                η far too small, or a bug (no optimizer step / zero gradients / wrong graph).

      - type: mastery_criteria
        payload:
          markdown: |
            You have this when you can:

            - Match loss-curve shapes to $\eta$ mistakes.
            - Explain non-convexity without claiming training is hopeless.
            - Separate optimization failure from overfitting in a short diagnosis.
            - Say what schedules change, without treating them as magic.
