    volatility: LOW
    knowledgeClass: STABLE
    lastReviewedAt: 2026-09-19
    tags: [deep-learning, sequences, rnn]
    objectives:
      - Explain recurrence as sharing a cell across time with a hidden state.
      - Motivate gating (LSTM) as a fix for vanishing gradients through time.
    description: >-
      Modelling sequences with shared weights across time: plain RNNs, the vanishing-gradient
      problem, and LSTM gates as controllable memory.
    blocks:
      - type: why
        markdown: |
          Before transformers, almost every sequence model carried a hidden state through time.
          Attention largely replaced recurrence for large-scale language modelling, but the RNN/LSTM
          story is still the right way to understand state, vanishing gradients through time, and
          why gating appeared — and it still ships in speech and some streaming settings.

  - slug: rnn-sequence-modeling
    title: RNNs as Shared Cells Across Time
    kind: knowledge_unit
    parent: sequence-models
    status: published
    version: 1.0.0
    difficulty: 4
    estimateMinutes: 40
    volatility: LOW
    knowledgeClass: STABLE
    lastReviewedAt: 2026-09-19
    tags: [deep-learning, rnn, sequences]
    objectives:
      - Write the basic RNN recurrence $h_t = f(W_h h_{t-1} + W_x x_t)$.
      - Explain weight sharing across time and how backpropagation through time works at a high level.
      - State the vanishing-gradient problem for long dependencies.
      - Contrast sequential state with attention's all-pairs mixing.
    description: >-
      One cell, applied at every timestep, threading a hidden state through the sequence. Elegant,
      parallel-hostile, and fragile over long spans without gating.
    blocks:
      - type: why
        markdown: |
          Language, audio, and sensor streams are ordered. A model that reads one step at a time
          with a memory of the past matches that structure. The simple recurrent net is the
          clearest statement of that idea — and the clearest demonstration of why naive depth
          through time fails.

      - type: eli5
        markdown: |
          Read a story one word at a time. After each word, update a sticky note that says "what I
          believe so far." The next word is understood in light of the sticky note, then you rewrite
          the note.

          Same rewriting rule every time — that is weight sharing across time. If the story is long
          and the note keeps getting smudged, early plot points vanish — that is the vanishing
          problem.

      - type: beginner
        markdown: |
          At timestep $t$ with input $x_t$ and previous hidden state $h_{t-1}$:

          $$
          h_t = \tanh(W_h h_{t-1} + W_x x_t + b)
          $$

          (Activation may vary; $\tanh$ is the textbook default.) Output layers read from $h_t$ for
          next-token prediction, tagging, etc.

          **Sharing.** The same $W_h, W_x$ apply at every $t$. Sequence length does not add new
          parameters — comparable to convolution's sharing over space.

          **BPTT.** Training unrolls the recurrence into a deep chain of copies of the cell and
          backpropagates through that chain (backpropagation through time). Memory and compute scale
          with sequence length; steps are not parallel across $t$ the way transformer attention is.

      - type: intermediate
        markdown: |
          **Vanishing and exploding gradients.** The gradient of the loss at time $T$ w.r.t. early
          states multiplies many Jacobians $\partial h_t / \partial h_{t-1}$. If those maps shrink
          singular values below 1, signals from the distant past die; if they explode, training
          diverges. Plain tanh RNNs often vanish on dependencies longer than tens of steps.

          **What recurrence gives that attention also gives differently.** Both mix information
          across positions. Recurrence mixes **sequentially** with $O(L)$ state updates and a
          compressed state bottleneck; attention mixes with $O(L^2)$ pairwise scores and keeps all
          positions explicit. Transformers largely won at scale on parallelism and path length;
          RNNs still matter pedagogically and in some latency-streaming regimes.

          **Bidirectional RNNs** run a second state backward for offline tagging; they are illegal
          for true left-to-right generation.

      - type: example
        markdown: |
          Sentiment on a five-token sentence. Hidden size 2 for illustration — ignore learned
          realism.

          $h_0 = (0,0)$. After token 1, $h_1$ encodes that token; after token 5, $h_5$ must still
          carry negation from token 2 ("not") to flip the polarity of "good" at token 5. In a plain
          RNN, that bit has been squashed through three tanh Jacobians — often gone.

          Empirically, copying a bit across 50 steps fails for vanilla RNNs and succeeds much more
          often for LSTMs — motivation for the next unit, and the empirical pattern Hochreiter &
          Schmidhuber designed for.

      - type: misconception
        payload:
          code: rnn.state_is_lossless_memory
          claim: "The hidden state stores the entire past sequence losslessly."
          markdown: |
            **The claim:** $h_t$ is a perfect summary of $x_1,\ldots,x_t$.

            **Why it feels right:** we call it memory; diagrams show an arrow carrying the past.

            **What actually happens:** $h_t$ is a fixed-size bottleneck. Information is compressed
            and overwritten. Long-range bits survive only if the dynamics preserve them — which
            plain RNNs often do not. Attention keeps past tokens as explicit vectors to re-read;
            recurrence must squeeze them into $h$.

            **How to catch yourself:** ask what happens to capacity as $t$ grows with $\|h\|$ fixed.
            Lossless storage of unbounded history is impossible; the architecture never claimed it.

      - type: common_mistake
        markdown: |
          **Unrolling truncated BPTT without noticing.** Long dependencies outside the truncation
          window cannot be learned — silent failure.

          **Comparing RNN wall-clock to transformers on short sequences only.** The parallelism gap
          shows up at scale and length.

          **Using bidirectional context in a streaming product.** Future frames are not available.

      - type: exercise_set
        payload:
          checkedByPlatform: false
          markdown: |
            1. Write the update for $h_t$ and circle which matrices are shared across time.
            2. Why does BPTT memory scale with sequence length?
            3. Give an intuitive reason gradients vanish through many tanh steps.
            4. Name one advantage of recurrence and one of attention for sequence mixing.
            5. Correct: "the hidden state stores the entire past losslessly."

      - type: quiz_set
        payload:
          selfCheck: true
          items:
            - question: "What is shared across timesteps in an RNN?"
              answer: "The cell parameters (e.g. W_h, W_x), not a separate network per time index."
            - question: "What is BPTT?"
              answer: "Backpropagation through the unrolled recurrent chain across timesteps."
            - question: "Why do plain RNNs struggle with long-range dependencies?"
              answer: >-
                Gradients through many multiplied Jacobians vanish (or explode), so early tokens
                stop influencing learning.
            - question: "Is h_t a lossless recording of the past?"
              answer: "No — it is a fixed-size compression that can overwrite earlier information."

      - type: mastery_criteria
        payload:
          markdown: |
            You have this when you can:

            - Write the RNN recurrence and explain sharing versus unrolling.
            - Connect vanishing gradients through time to failed long dependencies.
            - Compare sequential state to attention without declaring either useless.
            - Point to d2l's RNN chapter and the historical LSTM motivation paper.
    resources:
      - source: hochreiter-lstm-1997
        purpose: PRIMARY_SOURCE
        relevance: 0.7
        excerpt: "Motivates gated memory from the failure of plain recurrent gradient flow."
      - source: d2l
        purpose: TOOL_REFERENCE
        relevance: 0.9
        excerpt: "RNN chapters implement the recurrence and discuss BPTT. CC BY-SA 4.0."

  - slug: lstm-gates-intuition
    title: LSTM Gates as Controllable Memory
    kind: knowledge_unit
    parent: sequence-models
    status: published
    version: 1.0.0
    difficulty: 4
    estimateMinutes: 40
    volatility: LOW
    knowledgeClass: STABLE
    lastReviewedAt: 2026-09-19
    tags: [deep-learning, lstm, rnn, sequences]
    objectives:
      - Name the forget, input, and output gates and what each modulates.
      - Explain the cell state as an additive highway that eases gradient flow.
      - Say why gating helps long-range dependencies relative to a plain tanh RNN.
    description: >-
      LSTMs add an explicit cell state updated by gates so information can pass across many
      timesteps without being squashed at every step.
    blocks:
      - type: why
        markdown: |
          Gating is the idea that fixed the practical RNN: let the network decide what to erase,
          what to write, and what to expose — and keep a cell state that adds updates instead of
          overwriting through a squash every time. Transformers later bypassed recurrence; they did
          not make the vanishing problem imaginary.

      - type: eli5
        markdown: |
          Upgrade the sticky note to a notebook with three switches:

          - **Forget:** erase some old notes?
          - **Input:** write this new word into the notebook?
          - **Output:** how much of the notebook do I show when speaking my next thought?

          The notebook itself can carry a sentence for a long time if the forget switch stays off —
          that is the long-term cell state.

      - type: beginner
        markdown: |
          An LSTM keeps a **cell state** $c_t$ and a **hidden state** $h_t$. Gates are sigmoids with
          values in $(0,1)$, applied elementwise:

          - **Forget gate $f_t$** — how much of $c_{t-1}$ to keep.
          - **Input gate $i_t$** — how much of a new candidate $\tilde{c}_t$ to write.
          - **Output gate $o_t$** — how much of the cell to expose as $h_t$.

          Core update (schematic):

          $$
          c_t = f_t \odot c_{t-1} + i_t \odot \tilde{c}_t
          $$

          $$
          h_t = o_t \odot \tanh(c_t)
          $$

          The **additive** path $f_t \odot c_{t-1}$ is the highway: if $f_t \approx 1$ and $i_t
          \approx 0$, the cell copies forward almost unchanged — gradients can flow across many
          steps along that path. That is the design Hochreiter & Schmidhuber introduced.

      - type: intermediate
        markdown: |
          **Why addition beats repeated tanh.** In a plain RNN, $h_t = \tanh(W_h h_{t-1}+\cdots)$
          forces every timestep through a nonlinearity whose derivative is $\le 1$. In an LSTM,
          the cell can mostly *add* small writes. Derivatives along a near-copy path stay near 1,
          so credit assignment to early events remains possible.

          **Gates are data-dependent.** They are functions of $x_t$ and $h_{t-1}$ (and sometimes
          $c_{t-1}$). The model learns *when* to reset memory (sentence boundaries, topic changes)
          rather than using a fixed decay.

          **GRU.** A popular simplification merges gates and drops a separate cell; same spirit —
          learned control of what persists — fewer parameters. If you understand LSTM gates, GRU is
          a short step.

          **Limits.** Even LSTMs struggle with very long contexts compared with attention's direct
          paths; state is still a bottleneck. They remain useful when you need causal streaming with
          modest state and sequential hardware constraints.

      - type: example
        markdown: |
          Copy-a-bit task: at $t=1$, input a bit $b$; at $t=50$, output $b$. A successful LSTM
          learns $f_t \approx 1$ for $t=2..49$ on the dimension storing $b$, and $i_t \approx 0$ so
          noise does not overwrite it; at $t=50$, $o_t$ opens so $h_t$ reveals the bit.

          A plain tanh RNN tends to overwrite or squash that dimension long before step 50 — not
          because it "lacks neurons," but because its dynamics lack a near-identity path through
          time.

      - type: misconception
        payload:
          code: lstm.gates_are_symbolic_rules
          claim: "LSTM gates are hand-written if/then rules like a program counter."
          markdown: |
            **The claim:** forget/input/output are discrete logic the designer sets.

            **Why it feels right:** names sound like imperative code; diagrams look like flowcharts.

            **What actually happens:** gates are smooth, learned functions (sigmoids) trained by
            gradient descent. They *behave* like soft switches after training, but nothing inserts
            symbolic rules. You cannot read a deployed LSTM as reliable source code.

            **How to catch yourself:** ask who set the gate thresholds. If the answer is "SGD on
            data," they are not a program you authored.

      - type: common_mistake
        markdown: |
          **Treating LSTM as guaranteeing long memory.** Capacity and training still limit what
          persists; gating makes long credit assignment *possible*, not automatic.

          **Ignoring gradient clipping.** Exploding gradients can still occur; clipping remains
          common practice.

          **Stacking deep LSTMs without residual/norm tricks** and blaming "LSTMs don't work" when
          optimisation is the issue.

      - type: exercise_set
        payload:
          checkedByPlatform: false
          markdown: |
            1. Match forget / input / output gates to erase, write, and expose.
            2. Why does $c_t = f_t \odot c_{t-1} + \cdots$ help gradients versus $h_t=\tanh(W h_{t-1})$?
            3. If $f_t=\mathbf{1}$ and $i_t=\mathbf{0}$ for many steps, what happens to $c_t$?
            4. Are gates discrete? Justify in one sentence.
            5. Name one limitation LSTMs still share with plain RNNs relative to attention.

      - type: quiz_set
        payload:
          selfCheck: true
          items:
            - question: "What does the forget gate scale?"
              answer: "How much of the previous cell state c_{t-1} is kept."
            - question: "Why is an additive cell update important?"
              answer: >-
                It creates a near-identity path through time so gradients do not vanish as quickly
                as through repeated tanh Jacobians.
            - question: "Are LSTM gates hard-coded logic?"
              answer: "No — they are learned smooth sigmoids, not author-written if/then rules."
            - question: "What problem did LSTMs primarily target?"
              answer: "Learning long-range dependencies despite vanishing gradients in plain RNNs."

      - type: mastery_criteria
        payload:
          markdown: |
            You have this when you can:

            - Sketch the cell update and name what each gate modulates.
            - Explain the additive highway in gradient terms, not metaphors only.
            - Separate "gating enables long memory" from "gating guarantees it."
            - Cite Hochreiter & Schmidhuber as the primary source for the LSTM design.
