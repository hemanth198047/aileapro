      - type: why
        markdown: |
          Generative AI is not one algorithm. GANs made sharp samples via an adversarial game;
          diffusion models made training more predictable by learning to denoise. These pages are
          the intuition you need before reading either literature — not a bake-off scoreboard.

  - slug: gan-game-intuition
    title: GANs as a Two-Player Game
    kind: knowledge_unit
    parent: generative-models
    status: published
    version: 1.0.0
    difficulty: 4
    estimateMinutes: 40
    volatility: LOW
    knowledgeClass: STABLE
    lastReviewedAt: 2026-09-20
    tags: [generative-ai, gan]
    objectives:
      - Describe the generator and discriminator roles and what each maximises or minimises.
      - Explain mode collapse as a failure where diversity dies while samples still "look real."
      - Say why GAN training is a game (and why that makes optimisation brittle).
      - Relate the 2014 Goodfellow et al. setup to the modern idea of adversarial generation.
    description: >-
      A generator maps noise to samples; a discriminator learns to tell real from fake. They train
      against each other — a minimax game, not a single loss downhill forever.
    blocks:
      - type: why
        markdown: |
          Before diffusion dominated image benchmarks, GANs showed that you could sample sharp
          images by training two networks in opposition. The idea is still the cleanest way to
          understand adversarial generation, and the failure modes still show up in GAN-like
          objectives elsewhere.

      - type: eli5
        markdown: |
          A forger (generator) tries to print fake banknotes. A detective (discriminator) tries to
          spot fakes. The forger sees what the detective catches and improves; the detective sees
          new fakes and improves.

          If they balance, fakes look real. If the forger finds one trick that always fools the
          detective, you get the same fake over and over — that is mode collapse in costume.

      - type: beginner
        markdown: |
          **Generator** $G(z)$: maps random noise $z$ to a sample in data space (image, etc.).

          **Discriminator** $D(x)$: outputs a score for how real $x$ looks (classically a
          probability of "real").

          **Game (Goodfellow et al., 2014).** $D$ wants to label real data as real and $G$'s
          outputs as fake. $G$ wants $D$ to label its outputs as real. Written as a minimax
          objective: $D$ maximises classification accuracy; $G$ minimises the discriminator's
          ability to tell fakes apart (equivalently maximises fooling).

          **Training alternates.** Update $D$ on a batch of real and fake; update $G$ so fakes
          score better under the current $D$. Neither loss is a fixed landscape — each player's
          move changes the other's board.

          **At a conceptual equilibrium**, $G$ reproduces the data distribution and $D$ cannot do
          better than chance. Practice rarely sits politely at that equilibrium.

      - type: intermediate
        markdown: |
          **Why it is brittle.** Simultaneous gradient descent on a game can cycle, diverge, or
          collapse. Hyperparameters, architectural tricks, and loss variants (WGAN, hinge, etc.)
          exist because the vanilla game is awkward to optimise — not because the story is wrong.

          **Mode collapse.** $G$ concentrates on a few samples that fool $D$, covering little of
          the data distribution. $D$ may still be imperfect; samples can look individually sharp
          while diversity is gone. Measuring collapse needs distribution-level metrics, not one
          pretty grid.

          **No explicit likelihood.** Classic GANs do not give you $p(x)$ for a sample; they give
          you a procedure to sample. Likelihood-based models (and diffusion's ELBO-style training)
          trade some of that sharpness/simplicity for a different training signal.

          **Where GANs still matter.** The adversarial *idea* — train against a learned critic —
          appears in losses beyond the 2014 image setup. Understanding the game clarifies those
          papers faster than memorising acronyms.

      - type: example
        markdown: |
          Toy loop (shapes only):

          ```text
          for each training step:
              # Discriminator step
              x_real ~ data
              z ~ noise; x_fake = G(z)
              update D to raise D(x_real) and lower D(x_fake)

              # Generator step
              z ~ noise; x_fake = G(z)
              update G to raise D(x_fake)   # fool D
          ```

          **Collapse sketch.** Data has many digit styles. After training, $G$ emits only "7"-like
          blobs that $D$ currently struggles with. Loss curves may still look "busy." A sample
          sheet with twenty near-copies is the diagnostic, not a single convincing image.

          Goodfellow et al. 2014 is the citation for the original game; later work changes losses
          and architectures but keeps the two-player story.

      - type: misconception
        payload:
          code: gen.gan_always_converges
          claim: "If the GAN losses look stable, the generator has learned the full data distribution."
          markdown: |
            **The claim:** quiet or converged-looking losses mean $G$ matches the data.

            **Why it feels right:** in supervised learning, flat low loss usually means fit; people
            import that habit.

            **What actually happens:** game dynamics can look calm while $G$ occupies a few modes.
            $D$ and $G$ may co-adapt around a narrow solution. Stability of scalars ≠ coverage of
            the distribution.

            **How to catch yourself:** inspect diversity (many samples), use metrics sensitive to
            coverage, and treat loss plots as training health — not as proof of distributional
            match.

      - type: common_mistake
        markdown: |
          **Judging success from cherry-picked samples** instead of checking variety and failure
          modes.

          **Updating only $G$ for many steps** so $D$ becomes useless (or the reverse), then
          declaring GANs "don't work."

          **Equating GANs with all of generative AI** and skipping likelihood-based or diffusion
          views when the task needs them.

      - type: exercise_set
        payload:
          checkedByPlatform: false
          markdown: |
            1. In two sentences, what does G try to do and what does D try to do?
            2. Why is GAN training not "just another supervised loss"?
            3. Describe mode collapse without using the phrase "mode collapse."
            4. Name one thing a classic GAN does not give you that a likelihood model would.
            5. Correct "stable losses mean the distribution is learned" in two sentences.

      - type: quiz_set
        payload:
          selfCheck: true
          items:
            - question: "What are the two players in a GAN?"
              answer: >-
                A generator that maps noise to samples, and a discriminator that scores real vs
                fake.
            - question: "What is mode collapse?"
              answer: >-
                The generator produces limited varieties of samples that fool the discriminator,
                failing to cover the data distribution's diversity.
            - question: "Why can GAN optimisation be unstable?"
              answer: >-
                  Because each network changes the other's loss landscape — it is a game, not a
                  fixed supervised objective.
            - question: "Do classic GANs provide likelihoods p(x)?"
              answer: "Typically no — they provide a sampling procedure via G(z)."

      - type: mastery_criteria
        payload:
          markdown: |
            You have this when you can:

            - Explain the GAN game without collapsing it into "one neural net generates images."
            - Diagnose mode collapse from a sample sheet story.
            - Say what equilibrium would mean and why practice misses it.
            - Point to Goodfellow et al. 2014 as the origin of the adversarial setup.
