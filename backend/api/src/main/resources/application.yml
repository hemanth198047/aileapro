spring:
  application:
    name: aileapro-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aileapro}
    username: ${SPRING_DATASOURCE_USERNAME:aileapro}
    password: ${SPRING_DATASOURCE_PASSWORD:aileapro}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  session:
    store-type: redis
    timeout: 12h

server:
  port: ${AILEAPRO_API_PORT:8090}
  servlet:
    session:
      cookie:
        name: AILEAPRO_SESSION
        http-only: true
        same-site: lax

aileapro:
  web:
    origin: ${AILEAPRO_WEB_ORIGIN:http://localhost:3000}
  ai:
    provider: ${AILEAPRO_AI_PROVIDER:fake}
  search:
    # jdbc = Postgres FTS + pgvector. Tests override to memory.
    backend: ${AILEAPRO_SEARCH_BACKEND:jdbc}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
