spring.application.name=ailepro-api
server.port=${AILEPRO_API_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ailepro}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ailepro}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ailepro}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.session.store-type=redis
spring.session.timeout=12h

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.name=AILEPRO_SESSION

ailepro.web.origin=${AILEPRO_WEB_ORIGIN:http://localhost:3000}
ailepro.ai.provider=${AILEPRO_AI_PROVIDER:fake}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
