services:
  # pgvector image: Phase 8 retrieval needs the vector type. The official
  # postgres:16-alpine image does not ship the extension.
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: aileapro
      POSTGRES_USER: aileapro
      POSTGRES_PASSWORD: aileapro
    ports:
      - "5432:5432"
    volumes:
      - aileapro_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aileapro"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Docker Hub no longer publishes minio/minio:latest; quay.io is MinIO's official registry.
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aileapro
      MINIO_ROOT_PASSWORD: aileaprosecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - aileapro_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  aileapro_pg:
  aileapro_minio:
